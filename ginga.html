.lg-voltar{ align-self:center; padding:6px 14px; font:bold 16px var(--fonte2); color:var(--sub); text-decoration:underline; text-underline-offset:3px; }
.folha.login .pop-erro{ min-height:20px; margin:0; }
.retrato .lg-caixa{ flex-direction:column; max-height:none; }
.retrato .lg-lado{ flex:none; gap:10px; padding:20px 22px 18px; border-right:0; border-bottom:5px solid var(--borda); }
.retrato .lg-carimbo{ font-size:72px; }
.retrato .lg-tit{ font-size:32px; }
.retrato .lg-form{ padding:20px 22px; }

/* trocar a senha */
.lg-pop{ display:flex; flex-direction:column; gap:12px; }
.pop-caixa .lg-pop .in-txt{ height:66px; font:bold 26px var(--fonte2); text-align:left; }

/* ID da conta no perfil e nas salas */
.pf-nome .pf-id{ flex:none; display:inline-flex; align-items:center; height:62px; padding:0 20px; border-radius:31px; font-style:italic; font-size:30px; letter-spacing:1px; color:#1a1200;
  background:linear-gradient(#ffe766, #ffc21a); box-shadow:inset 0 3px 0 rgba(255,255,255,.5), 0 4px 0 var(--borda); white-space:nowrap; }
.pf-conta{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.pf-conta .bt3d svg{ width:20px; height:20px; }
.sa-cid{ margin-left:8px; font:bold 14px var(--fonte2); color:var(--amarelo); letter-spacing:.5px; }

/* =================================================================== VERIFICADO (o selo V na frente do nome) */
.vf{ display:inline-flex; flex:none; width:.95em; height:.95em; margin-right:.22em; vertical-align:-.14em; }
.vf svg{ display:block; width:100%; height:100%; filter:drop-shadow(0 1px 0 rgba(0,0,0,.35)); }
.lb-eu b .vf{ animation:seloBrilha 3.2s ease-in-out infinite; }
@keyframes seloBrilha{ 0%, 70%, 100%{ transform:none; } 80%{ transform:scale(1.18) rotate(-8deg); } 90%{ transform:scale(1); } }
#lobby.parado .vf{ animation:none !important; }
.ch-de.toca{ cursor:pointer; text-decoration:underline dotted rgba(255,210,63,.6); text-underline-offset:3px; }
.ch-msg .vf{ width:1.05em; height:1.05em; }

/* =================================================================== PAINEL ADMIN */
.icq.adm{ color:#fff; background:linear-gradient(#ff7a6b, #c8102e); }
.ad-abas{ margin-bottom:16px; }
.ad-lista{ display:flex; flex-direction:column; gap:10px; }
.ad-linha{ display:grid; grid-template-columns:52px minmax(0,1fr) auto; align-items:center; gap:14px; padding:10px 14px; border-radius:18px;
  background:linear-gradient(#1f2a5a, #141c42); border:4px solid var(--borda); box-shadow:0 4px 0 var(--borda); }
.ad-linha canvas{ width:52px; height:52px; }
.ad-nome{ min-width:0; display:flex; flex-direction:column; gap:5px; }
.ad-nome b{ font-weight:400; font-style:italic; font-size:27px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ad-nome b i{ font:bold 16px var(--fonte2); font-style:normal; color:var(--amarelo); }
.ad-nome > span{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
.ad-nome .tag{ height:24px; font-size:13px; padding:0 9px; }
.ad-nome small{ font:14px var(--fonte2); color:var(--sub); }
.ad-acoes{ display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; }
.ad-acoes .bt3d svg{ width:22px; height:22px; }
.ad-hist{ display:flex; gap:14px; align-items:baseline; padding:10px 14px; border-radius:14px; background:rgba(0,0,0,.2); font:17px/1.4 var(--fonte2); color:var(--sub); }
.ad-hist small{ flex:none; font-weight:bold; color:var(--sub2); }
.ad-hist b{ color:#fff; } .ad-hist i{ font-style:normal; color:var(--amarelo); }
.retrato .ad-linha{ grid-template-columns:52px minmax(0,1fr); }
.retrato .ad-acoes{ grid-column:1 / -1; justify-content:stretch; }
.retrato .ad-acoes .bt3d{ flex:1; }

/* =================================================================== PARTIDA: HUD */
#hud{ position:absolute; top:0;right:0;bottom:0;left:0; z-index:20; pointer-events:none; --tx2:#cdd5f5; --tx3:#8f99c4; }
#hud[hidden]{ display:none; }
#hud > *{ pointer-events:auto; }
/* o desenho do analógico e as tarjas do replay não podem pegar o dedo (o toque vai para a área do analógico) */
#hud > .joy, #hud > .tarja{ pointer-events:none; }
/* os controles são posicionados pelo JS (dá para mover e mudar o tamanho no EDITAR BOTÕES) */
.h-pausa{ position:absolute; width:58px; height:58px; transform:translate(-50%, -50%); border-radius:16px; display:grid; place-items:center;
  background:rgba(13,20,50,.8); border:3px solid #070b1e; box-shadow:inset 0 2px 0 rgba(255,255,255,.12), 0 4px 0 #070b1e; opacity:var(--op, .9); }
.h-pausa svg{ width:46%; height:46%; }
.h-pausa:active{ transform:translate(-50%, -50%) scale(.9); }
.h-pausa.sala svg{ width:56%; height:56%; }
#h-editar{ position:absolute; left:50%; top:max(64px, calc(env(safe-area-inset-top,0px) + 58px)); transform:translateX(-50%); width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#fff; background:rgba(10,16,40,.55); box-shadow:inset 0 0 0 2px rgba(255,255,255,.22); opacity:.8; z-index:40; }
#h-editar svg{ width:55%; height:55%; }
#h-editar:active{ transform:translateX(-50%) scale(.9); opacity:1; }
#placar{ position:absolute; left:50%; top:max(8px, env(safe-area-inset-top)); transform:translateX(-50%); display:flex; align-items:stretch; height:clamp(40px, 9.5vmin, 58px);
  border-radius:16px; overflow:hidden; background:rgba(13,20,50,.9); border:3px solid #070b1e; box-shadow:0 6px 14px rgba(0,0,0,.4); pointer-events:none; font-size:clamp(15px, 4.4vmin, 28px); font-style:italic; }
.pl-t{ display:flex; align-items:center; gap:clamp(6px, 1.4vmin, 10px); padding:0 clamp(8px, 2vmin, 16px); }
.pl-t i{ width:clamp(12px, 2.8vmin, 18px); height:clamp(12px, 2.8vmin, 18px); border-radius:50%; background:var(--tc); box-shadow:0 0 0 3px rgba(255,255,255,.18), 0 0 10px var(--tc); }
.pl-t span{ font-size:.62em; letter-spacing:1px; color:var(--tx2); max-width:22vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pl-g{ min-width:1.4em; display:grid; place-items:center; font-size:1.25em; font-variant-numeric:tabular-nums; }
.pl-g.golpop{ animation:golPop .7s cubic-bezier(.2,.9,.3,1.5); }
@keyframes golPop{ 0%{ transform:scale(2.2); color:var(--sol); } 100%{ transform:scale(1); } }
#placar.treino #pl-gb, #placar.treino #pl-tb i{ display:none; }
#placar.treino #pl-tb span{ color:var(--sol); }
.pl-relogio{ display:grid; place-items:center; min-width:3.6em; padding:0 .4em; background:rgba(255,255,255,.07); font-size:.9em; font-variant-numeric:tabular-nums; }
.pl-relogio.ouro{ color:#3a2300; background:var(--sol); animation:piscaSuave 1.2s infinite; }
.pl-relogio.fim{ color:var(--coral); }
#minimapa{ position:absolute; right:max(10px, env(safe-area-inset-right)); top:max(10px, env(safe-area-inset-top)); border-radius:10px; background:rgba(10,7,30,.55); box-shadow:inset 0 0 0 2px rgba(255,255,255,.12); pointer-events:none; }
#hud.retrato #minimapa{ top:calc(max(10px, env(safe-area-inset-top)) + clamp(48px, 11vmin, 66px)); }
#hud.retrato .pl-t span{ display:none; }
#hud.mini-esq #minimapa{ right:auto; left:max(10px, env(safe-area-inset-left)); top:calc(max(10px, env(safe-area-inset-top)) + 74px); }
#fps{ position:absolute; left:max(12px, env(safe-area-inset-left)); bottom:max(6px, env(safe-area-inset-bottom)); font:12px/1 ui-monospace, monospace; color:#9effa0; text-shadow:0 1px 2px #000; pointer-events:none; }
#fps[hidden]{ display:none; }
#rede-info{ position:absolute; right:max(12px, env(safe-area-inset-right)); bottom:max(6px, env(safe-area-inset-bottom)); font:bold 12px/1 var(--fonte2); color:rgba(255,255,255,.75); text-shadow:0 1px 2px #000; pointer-events:none; }
#rede-info[hidden]{ display:none; }

/* analógico fixo */
.joy{ position:absolute; width:var(--js, 170px); height:var(--js, 170px); transform:translate(-50%, -50%); border-radius:50%; opacity:var(--op, .9); pointer-events:none; }
.joy .base{ position:absolute; top:0;right:0;bottom:0;left:0; border-radius:50%; background:radial-gradient(circle, rgba(13,20,50,.25) 0 40%, rgba(13,20,50,.55) 41% 60%, rgba(13,20,50,.72) 61%); box-shadow:inset 0 0 0 4px rgba(255,255,255,.3), 0 0 0 3px rgba(7,11,30,.5); }
.joy .base::before{ content:''; position:absolute; top:9%;right:9%;bottom:9%;left:9%; border-radius:50%; border:2px dashed rgba(255,255,255,.2); }
.joy .seta{ position:absolute; z-index:2; left:50%; top:50%; width:0; height:0; margin:-18px 0 0 -9px; border:9px solid transparent; border-bottom-color:rgba(255,210,63,.9); transform-origin:50% 100%; opacity:0; transition:opacity .15s; }
.joy .k{ position:absolute; left:50%; top:50%; width:46%; height:46%; margin:-23% 0 0 -23%; border-radius:50%; will-change:transform;
  background:radial-gradient(circle at 38% 32%, #ffffff 0, #e4ebff 30%, #9fb0ea 75%, #5c6fc4 100%); box-shadow:0 6px 12px rgba(0,0,0,.45), inset 0 -4px 0 rgba(40,50,130,.35), 0 0 0 3px #070b1e; }
/* o pino segue o dedo na hora; só volta para o meio com animação */
.joy .k.volta{ transition:transform .12s ease-out; }
.joy .k::after{ content:''; position:absolute; top:30%;right:30%;bottom:30%;left:30%; border-radius:50%; background:var(--amarelo); opacity:.95; box-shadow:inset 0 -2px 0 rgba(0,0,0,.2); }
.joy.ativo{ opacity:1; }
.joy.ativo .base{ box-shadow:inset 0 0 0 4px rgba(255,210,63,.65), 0 0 20px rgba(255,210,63,.25); }
#joy-area{ position:absolute; touch-action:none; }

/* PASSE e CHUTE */
.hb{ position:absolute; --bs:120px; width:var(--bs); height:var(--bs); transform:translate(-50%, -50%); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; touch-action:none; opacity:var(--op, .9); transition:transform .09s ease-out; border:4px solid #070b1e; font-style:italic; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
/* a área de toque é maior que o desenho (não precisa acertar o botão no milímetro) */
.hb::before{ content:''; position:absolute; top:-17%;right:-17%;bottom:-17%;left:-17%; border-radius:50%; }
/* aceso quando está apertado (sem filtro: não pesa) */
.hb::after{ content:''; position:absolute; top:-4px;right:-4px;bottom:-4px;left:-4px; border-radius:50%; background:rgba(255,255,255,.28); box-shadow:0 0 0 3px rgba(255,255,255,.55); opacity:0; pointer-events:none; }
.hb svg.ic{ width:42%; height:42%; }
.hb span{ font-size:calc(var(--bs) * .16); letter-spacing:1px; line-height:1; text-shadow:0 2px 0 rgba(0,0,0,.35); }
.hb.on{ transform:translate(-50%, -50%) scale(.9); opacity:1; transition:none; }
.hb.on::after{ opacity:1; }
.hb.chute{ background:radial-gradient(circle at 35% 28%, #ffb1c0 0, var(--coral) 42%, var(--coral2) 85%); box-shadow:inset 0 -6px 0 rgba(120,0,40,.35), inset 0 4px 0 rgba(255,255,255,.4), 0 7px 0 #070b1e, 0 10px 18px rgba(0,0,0,.4); }
.hb.passe{ color:#003c40; background:radial-gradient(circle at 35% 28%, #c4fff8 0, var(--mar) 45%, #0c9c97 88%); box-shadow:inset 0 -5px 0 rgba(0,70,80,.35), inset 0 4px 0 rgba(255,255,255,.45), 0 7px 0 #070b1e, 0 10px 18px rgba(0,0,0,.4); }
.hb.passe span{ text-shadow:0 2px 0 rgba(255,255,255,.4); }
.hb .anel{ position:absolute; top:-12px;right:-12px;bottom:-12px;left:-12px; width:calc(100% + 24px); height:calc(100% + 24px); transform:rotate(-90deg); pointer-events:none; }
.hb .anel circle{ fill:none; stroke-width:7; stroke-linecap:round; }
.hb .anel .fundo{ stroke:rgba(255,255,255,.12); }
.hb .anel .carga{ stroke:var(--sol); stroke-width:9; stroke-dasharray:0 1000; }
.hb .anel .cd{ stroke:rgba(7,11,30,.6); stroke-dasharray:0 1000; }
/* chute forte carregado: o botão pulsa (só tamanho e um anel de luz, sem filtro) */
.hb.chute.cheio{ animation:cheio .3s ease-in-out infinite alternate; }
.hb.chute.cheio::after{ opacity:1; background:rgba(255,210,63,.3); box-shadow:0 0 0 4px var(--sol), 0 0 22px 6px rgba(255,210,63,.55); }
@keyframes cheio{ from{ transform:translate(-50%, -50%) scale(.92); } to{ transform:translate(-50%, -50%) scale(1); } }
@media (max-width:600px){ .pl-t span{ max-width:18vw; } }

/* ---------- EDITAR BOTÕES ---------- */
#editor{ position:absolute; top:0;right:0;bottom:0;left:0; z-index:45; touch-action:none; background:rgba(7,11,30,.25); }
#editor[hidden]{ display:none; }
.ed-alvo{ position:absolute; transform:translate(-50%, -50%); cursor:grab; touch-action:none; }
.ed-alvo > .copia{ position:relative !important; left:auto !important; top:auto !important; transform:none !important; width:100% !important; height:100% !important; pointer-events:none; }
.ed-alvo::after{ content:''; position:absolute; top:-10px;right:-10px;bottom:-10px;left:-10px; border-radius:50%; border:3px dashed rgba(255,255,255,.6); pointer-events:none; }
.ed-alvo.quad::after{ border-radius:22px; }
.ed-alvo.sel::after{ border-color:var(--amarelo); box-shadow:0 0 0 6px rgba(255,210,63,.25); animation:gira 8s linear infinite; }
.ed-alvo b{ position:absolute; left:50%; top:calc(100% + 14px); transform:translateX(-50%); padding:3px 10px; border-radius:8px; font-weight:400; font-style:italic; font-size:14px; letter-spacing:1px; white-space:nowrap; background:rgba(7,11,30,.85); color:#fff; pointer-events:none; }
.ed-alvo.sel b{ background:var(--amarelo); color:#1a1200; }
#ed-painel{ position:absolute; left:50%; top:max(10px, env(safe-area-inset-top)); transform:translateX(-50%); width:min(620px, calc(100% - 20px)); padding:10px 14px 12px; border-radius:20px;
  background:rgba(13,20,50,.96); border:4px solid #070b1e; box-shadow:0 6px 0 #070b1e, 0 12px 26px rgba(0,0,0,.5); transition:opacity .15s; font-style:italic; }
#ed-painel.some{ opacity:.15; pointer-events:none; }
#ed-painel.baixo{ top:auto; bottom:max(10px, env(safe-area-inset-bottom)); }
.ed-cab{ display:flex; align-items:center; gap:10px; }
.ed-cab b{ flex:1; font-weight:400; font-size:22px; color:var(--amarelo); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ed-cab .bt3d{ height:44px; font-size:18px; padding:0 14px; border-width:2px; box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 4px 0 #070b1e; }
.ed-lin{ display:grid; grid-template-columns:118px minmax(0,1fr) 54px; align-items:center; gap:10px; margin-top:8px; font-size:17px; }
.ed-lin output{ text-align:right; color:var(--amarelo); font-variant-numeric:tabular-nums; }
.ed-lin input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:34px; background:transparent; margin:0; touch-action:none; }
.ed-lin input[type=range]::-webkit-slider-runnable-track{ height:10px; border-radius:5px; background:linear-gradient(90deg, var(--amarelo) var(--p, 50%), rgba(255,255,255,.2) var(--p, 50%)); }
.ed-lin input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:30px; height:30px; margin-top:-10px; border-radius:50%; background:#fff; border:5px solid var(--amarelo2); }
.ed-lin input[type=range]::-moz-range-track{ height:10px; border-radius:5px; background:rgba(255,255,255,.2); }
.ed-lin input[type=range]::-moz-range-progress{ height:10px; border-radius:5px; background:var(--amarelo); }
.ed-lin input[type=range]::-moz-range-thumb{ width:22px; height:22px; border-radius:50%; background:#fff; border:5px solid var(--amarelo2); }
.ed-dica{ margin-top:6px; font:13px var(--fonte2); font-style:normal; color:var(--sub); }

/* apresentação dos times antes do primeiro apito */
#vs{ position:absolute; left:0; right:0; top:50%; height:clamp(74px, 24vmin, 140px); transform:translateY(-50%); display:flex; align-items:stretch; pointer-events:none; }
#vs[hidden]{ display:none; }
#vs .vs-l{ flex:1 1 0; display:flex; flex-direction:column; justify-content:center; gap:.3em; padding:0 6vw; min-width:0; }
#vs .vs-l b{ font-weight:400; font-size:clamp(20px, 7vmin, 46px); letter-spacing:1.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 3px 0 rgba(0,0,0,.3); }
#vs .vs-l small{ font-size:clamp(11px, 3vmin, 18px); letter-spacing:.5px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#vs .vs-a{ align-items:flex-end; text-align:right; background:linear-gradient(90deg, rgba(232,71,60,0), #b8302a 30%, var(--vermelho)); clip-path:polygon(0 0, 100% 0, calc(100% - 4vmin) 100%, 0 100%); animation:vsA .45s cubic-bezier(.2,.9,.3,1.2) both; }
#vs .vs-b{ align-items:flex-start; background:linear-gradient(270deg, rgba(47,111,230,0), #2358bf 30%, var(--azul)); clip-path:polygon(4vmin 0, 100% 0, 100% 100%, 0 100%); animation:vsB .45s cubic-bezier(.2,.9,.3,1.2) both; margin-left:-4vmin; }
#vs .vs-x{ position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); font-size:clamp(34px, 13vmin, 90px); color:var(--sol); --o:#1a0d3a; text-shadow:-4px -4px 0 var(--o), 4px -4px 0 var(--o), -4px 4px 0 var(--o), 4px 4px 0 var(--o), 0 6px 0 var(--o); animation:vsX .5s .25s cubic-bezier(.2,.9,.3,1.6) both; }
#vs.sai .vs-a{ animation:vsAs .35s ease-in both; } #vs.sai .vs-b{ animation:vsBs .35s ease-in both; } #vs.sai .vs-x{ animation:msgSai .3s ease-in both; }
@keyframes vsA{ from{ transform:translateX(-105%); } } @keyframes vsB{ from{ transform:translateX(105%); } }
@keyframes vsAs{ to{ transform:translateX(-105%); } } @keyframes vsBs{ to{ transform:translateX(105%); } }
@keyframes vsX{ from{ transform:translate(-50%, -50%) scale(3) rotate(-20deg); opacity:0; } }

/* mensagens grandes no meio */
#msg{ position:absolute; top:0;right:0;bottom:0;left:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1vmin; pointer-events:none; text-align:center; }
#msg .grande{ font-size:clamp(46px, 17vmin, 150px); line-height:.95; letter-spacing:2px; color:#fff; --o:#1a0d3a; }
#msg .grande span{ display:inline-block; animation:letraPula .7s cubic-bezier(.2,.9,.3,1.6) both; animation-delay:calc(var(--i) * 45ms);
  background:linear-gradient(#fff7c2, var(--sol) 45%, var(--sol2)); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 0 #1a0d3a) drop-shadow(0 -2px 0 #1a0d3a) drop-shadow(3px 0 0 #1a0d3a) drop-shadow(-3px 0 0 #1a0d3a) drop-shadow(0 0 22px rgba(255,180,40,.55)); }
#msg .grande.conta span{ background:linear-gradient(#ffffff, #d9d2ff); -webkit-background-clip:text; background-clip:text; }
#msg .grande.rival span{ background:linear-gradient(#eef4ff, #8fb4ff 50%, #2f6fe6); -webkit-background-clip:text; background-clip:text; filter:drop-shadow(0 4px 0 #1a0d3a) drop-shadow(0 -2px 0 #1a0d3a) drop-shadow(3px 0 0 #1a0d3a) drop-shadow(-3px 0 0 #1a0d3a); }
#msg .grande.ouro span{ background:linear-gradient(#fff3a6, #ffd23f 50%, #e09a0c); -webkit-background-clip:text; background-clip:text; }
@keyframes letraPula{ 0%{ opacity:0; transform:translateY(-60%) scale(.4) rotate(-12deg); } 60%{ opacity:1; transform:translateY(8%) scale(1.15) rotate(3deg); } 100%{ transform:none; } }
#msg .sub{ font-size:clamp(16px, 5vmin, 34px); letter-spacing:1.5px; color:#fff; padding:.25em .9em; border-radius:999px; background:rgba(10,7,30,.75); animation:entra .5s .25s both; }
#msg .sub b{ font-weight:400; color:var(--sol); }
#msg.sai > *{ animation:msgSai .3s ease-in forwards !important; }
@keyframes msgSai{ to{ opacity:0; transform:scale(1.2); } }
#selo{ position:absolute; left:50%; top:calc(max(8px, env(safe-area-inset-top)) + clamp(46px, 11vmin, 66px)); transform:translateX(-50%); padding:.3em 1em; border-radius:999px; font-size:clamp(12px, 3.2vmin, 19px);
  letter-spacing:2px; background:var(--coral); color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.4); pointer-events:none; white-space:nowrap; }
#selo.rep{ background:#ff2d55; animation:piscaSuave 1s infinite; }
#selo[hidden]{ display:none; }
#dica{ position:absolute; left:50%; bottom:max(12px, env(safe-area-inset-bottom)); transform:translateX(-50%); max-width:min(56vw, 560px); padding:.5em 1.1em; border-radius:16px; text-align:center;
  font-size:clamp(12px, 3.3vmin, 20px); line-height:1.25; background:rgba(10,7,30,.84); box-shadow:inset 0 0 0 2px rgba(255,210,63,.35); pointer-events:none; }
#dica b{ font-weight:400; color:var(--sol); }
#dica[hidden]{ display:none; }
.tarja{ position:absolute; left:0; right:0; height:9vh; background:#000; pointer-events:none; transition:transform .35s; }
.tarja.c{ top:0; transform:translateY(-100%); } .tarja.b{ bottom:0; transform:translateY(100%); }
.replay .tarja.c, .replay .tarja.b{ transform:none; }
#pular{ position:absolute; right:max(14px, env(safe-area-inset-right)); bottom:calc(9vh + 12px); padding:.45em 1em; border-radius:14px; font-size:clamp(13px, 3.4vmin, 20px); background:rgba(255,255,255,.14); box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); }
#pular[hidden]{ display:none; }
.replay #joy, .replay .hb, .replay #minimapa{ visibility:hidden; }

/* sobreposições da partida (pausa e resultado) */
#sobre{ position:absolute; top:0;right:0;bottom:0;left:0; z-index:30; background:rgba(6,4,20,.72); }
#sobre[hidden]{ display:none; }
.cx{ position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); width:1100px; max-width:calc(100% - 40px); max-height:calc(100% - 40px); overflow:auto; padding:36px 46px; border-radius:34px; text-align:center;
  background:linear-gradient(#24326e, #141c42); border:5px solid #070b1e; box-shadow:0 10px 0 #070b1e, 0 30px 70px rgba(0,0,0,.6); animation:caixaEntra .3s cubic-bezier(.2,1.2,.4,1); }
.cx.larga{ width:1400px; }
.cx h2{ font-size:84px; line-height:1; letter-spacing:3px; font-style:italic; }
.cx .acoes{ display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-top:30px; }
.cx .acoes .bt3d{ min-width:300px; }
.ps-lista{ display:flex; flex-direction:column; gap:14px; margin:26px auto 0; max-width:620px; }
.ps-lista .bt3d{ width:100%; }
.rs-placar{ display:flex; align-items:center; justify-content:center; gap:36px; margin:18px 0 6px; font-size:120px; line-height:1; font-variant-numeric:tabular-nums; }
.rs-placar small{ display:flex; align-items:center; gap:12px; font-size:30px; letter-spacing:1px; color:var(--tx2); }
.rs-placar small i{ width:24px; height:24px; border-radius:50%; background:var(--tc); }
.rs-placar .x{ font-size:60px; color:var(--tx3); }
.rs-tab{ width:100%; margin-top:20px; border-collapse:collapse; font-size:26px; }
.rs-tab th{ font-weight:400; font-size:19px; letter-spacing:1.5px; color:var(--tx3); padding:6px 10px; text-align:center; }
.rs-tab th:first-child, .rs-tab td:first-child{ text-align:left; }
.rs-tab td{ padding:9px 10px; text-align:center; border-top:2px solid rgba(255,255,255,.06); font-variant-numeric:tabular-nums; }
.rs-tab tr.eu td{ color:var(--sol); }
.rs-tab .tm{ display:inline-block; width:16px; height:16px; border-radius:50%; margin-right:10px; background:var(--tc); vertical-align:-1px; }
.rs-premio{ display:flex; flex-wrap:wrap; justify-content:center; gap:14px 30px; margin-top:24px; font-size:34px; }
.rs-premio span{ display:inline-flex; align-items:center; gap:10px; }
.rs-premio .xp{ color:var(--lima); }
.rs-premio .up{ color:var(--sol); animation:piscaSuave 1s infinite; }



/* painel da sala durante a partida */
.sj-grade{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-top:16px; text-align:left; }
.sj-time{ border-radius:18px; overflow:hidden; background:rgba(0,0,0,.22); border:3px solid #070b1e; }
.sj-time header{ height:46px; display:flex; align-items:center; padding:0 14px; font-style:italic; font-size:22px; background:var(--tc); }
.sj-time ul{ list-style:none; margin:0; padding:8px; display:flex; flex-direction:column; gap:6px; }
.sj-time li{ display:flex; align-items:center; gap:10px; font-size:22px; }
.sj-time li canvas{ width:38px; height:38px; }
.sj-chat{ margin-top:16px; text-align:left; }
.sj-chat .ch-msgs{ height:170px; flex:none; }
.sj-chat .ch-envio{ margin-top:10px; }
.retrato .sj-grade{ grid-template-columns:minmax(0,1fr); }

/* quem só assiste não vê os controles */
#hud.espectador .joy, #hud.espectador #joy-area, #hud.espectador .hb{ display:none; }
#sobre.leve{ background:rgba(6,4,20,.45); }
.ps-duas{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:34px; margin-top:22px; text-align:left; align-items:start; }
.ps-duas .ps-lista{ margin:0; max-width:none; }
.ps-duas .sub-t{ margin-top:0; }
#ps-graf .gf-grade{ grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
#ps-graf .gf-card{ min-height:0; padding:14px 16px; gap:6px; }
#ps-graf .gf-card > span:not(.pontos){ display:none; }
#ps-graf .gf-card b{ font-size:32px; }
#ps-graf .gf-card.on::after{ top:12px; right:12px; font-size:13px; }
.retrato .ps-duas{ grid-template-columns:minmax(0,1fr); }
/* editor aberto pelo lobby: um campinho de fundo */
#editor.fundo{ background:#1f6e3a; }
.ed-campo{ position:absolute; top:0;right:0;bottom:0;left:0; display:none; pointer-events:none;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 9%, rgba(0,0,0,.04) 9% 18%), radial-gradient(ellipse at 50% 50%, #2f8f4a, #1d6534 75%); }
#editor.fundo .ed-campo{ display:block; }
.ed-campo::before{ content:''; position:absolute; left:6%; right:6%; top:10%; bottom:10%; border:4px solid rgba(255,255,255,.55); border-radius:6px; background:linear-gradient(90deg, transparent calc(50% - 2px), rgba(255,255,255,.55) calc(50% - 2px) calc(50% + 2px), transparent calc(50% + 2px)); }
.ed-campo::after{ content:''; position:absolute; left:50%; top:50%; width:22vmin; height:22vmin; transform:translate(-50%, -50%); border:4px solid rgba(255,255,255,.55); border-radius:50%; }
.ed-alvo.arrasta{ cursor:grabbing; z-index:2; }
.ed-alvo.arrasta::after{ border-style:solid; }
.ed-alvo:focus-visible{ outline:none; }
.ed-alvo:focus-visible::after{ border-color:var(--amarelo); }

/* resultado mais compacto (cabe no celular deitado) */
.cx h2{ font-size:68px; }
.rs-placar{ margin:8px 0 2px; font-size:92px; gap:30px; }
.rs-placar small{ font-size:26px; }
.rs-tab{ margin-top:10px; font-size:21px; }
.rs-tab th{ font-size:16px; padding:4px 10px; }
.rs-tab td{ padding:5px 10px; }
.rs-premio{ margin-top:14px; font-size:28px; }
.cx .acoes{ margin-top:18px; }
.cx{ padding:26px 40px; }

/* =================================================================== RANKING, MELHOR DA PARTIDA e ajustes do admin */
.rk-corpo{ display:flex; flex-direction:column; gap:14px; }
.rk-abas{ flex:none; }
.rk-lista{ display:flex; flex-direction:column; gap:10px; }
.rk-linha{ display:grid; grid-template-columns:96px 56px minmax(0,1fr) auto; align-items:center; gap:16px; padding:10px 18px 10px 12px; border-radius:20px; text-align:left;
  background:linear-gradient(#1f2a5a, #141c42); border:4px solid var(--borda); box-shadow:0 5px 0 var(--borda); transition:transform .07s; }
.rk-linha:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--borda); }
.rk-linha canvas{ width:56px; height:56px; }
.rk-pos{ display:flex; align-items:center; justify-content:center; gap:4px; font-style:italic; font-size:34px; color:var(--sub); font-variant-numeric:tabular-nums; }
.rk-pos i{ display:grid; width:30px; height:30px; }
.rk-pos i svg{ width:30px; height:30px; }
.rk-linha.top1 .rk-pos{ color:#ffd23f; } .rk-linha.top2 .rk-pos{ color:#dfe6f5; } .rk-linha.top3 .rk-pos{ color:#e8a46a; }
.rk-linha.top1{ border-color:#ffc21a; box-shadow:0 0 0 2px rgba(255,194,26,.5), 0 5px 0 var(--borda); background:linear-gradient(#3a2f5c, #1d2148); }
.rk-nome{ min-width:0; display:flex; flex-direction:column; gap:3px; }
.rk-nome b{ font-weight:400; font-style:italic; font-size:30px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rk-nome b small{ font:bold 16px var(--fonte2); font-style:normal; color:var(--amarelo); }
.rk-nome > small{ font:bold 15px var(--fonte2); color:var(--sub); letter-spacing:.3px; }
.rk-v{ display:flex; flex-direction:column; align-items:flex-end; line-height:1; }
.rk-v b{ font-weight:400; font-size:46px; color:var(--amarelo); font-variant-numeric:tabular-nums; }
.rk-v small{ font:bold 14px var(--fonte2); color:var(--sub); letter-spacing:1px; text-transform:uppercase; }
.rk-linha.eu{ border-color:var(--amarelo); }
.rk-eu{ flex:none; display:flex; align-items:center; gap:16px; padding:12px 20px; border-radius:18px; background:rgba(255,210,63,.12); box-shadow:inset 0 0 0 3px rgba(255,210,63,.4); font:bold 17px var(--fonte2); color:var(--sub); }
.rk-eu:empty{ display:none; }
.rk-eu b{ font:400 italic 32px var(--fonte); color:var(--amarelo); }
.rk-eu span:first-child{ font:400 italic 22px var(--fonte); color:#fff; letter-spacing:1px; }
.rk-vazio .bt3d{ margin-top:6px; }
.rk-vazio .bt3d svg{ width:26px; height:26px; color:currentColor; }
.rk-cartao{ display:flex; align-items:center; justify-content:center; gap:24px; text-align:left; margin-bottom:14px; }
.rk-cartao canvas{ width:110px; height:110px; flex:none; }
.rk-cartao h2{ margin:8px 0 0 !important; }
.pf-stats.c5, .rk-st{ grid-template-columns:repeat(5, minmax(0,1fr)); }
.pf-st em{ font:bold 14px var(--fonte2); font-style:normal; color:var(--amarelo); letter-spacing:.3px; }
.rk-st .pf-st{ text-align:left; }
.rk-st .pf-st b{ font-size:40px; }
.sub-t .bt3d{ margin-left:auto; font-style:normal; }
.sub-t .bt3d svg{ width:20px; height:20px; }
/* tela do resultado: o melhor da partida */
.rs-melhor{ display:flex; align-items:center; justify-content:center; gap:18px; width:max-content; max-width:100%; margin:14px auto 4px; padding:10px 26px 10px 16px; border-radius:22px;
  background:linear-gradient(90deg, rgba(255,194,26,.22), rgba(255,194,26,.08)); box-shadow:inset 0 0 0 3px rgba(255,210,63,.55); }
.rs-melhor.eu{ background:linear-gradient(90deg, rgba(255,194,26,.4), rgba(255,140,40,.18)); box-shadow:inset 0 0 0 3px var(--amarelo), 0 0 26px rgba(255,210,63,.35); }
.rs-melhor canvas{ width:64px; height:64px; flex:none; }
.rs-melhor div{ display:flex; flex-direction:column; text-align:left; min-width:0; }
.rs-melhor div small{ font:bold 15px var(--fonte2); letter-spacing:2px; color:var(--amarelo); }
.rs-melhor div b{ font-weight:400; font-style:italic; font-size:36px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rs-melhor em{ font-style:normal; font:bold 18px var(--fonte2); color:var(--sub); white-space:nowrap; }
.rs-coroa{ display:inline-grid; width:24px; height:24px; margin-right:6px; vertical-align:-3px; color:#ffc21a; }
.rs-coroa svg{ width:100%; height:100%; }
.rs-coroa.grande{ width:42px; height:42px; margin:0; }
.rs-tab tr.melhor td{ background:rgba(255,194,26,.08); }
.rs-bot{ font:bold 14px var(--fonte2); color:var(--sub2); }
.rs-rk{ display:flex; align-items:center; justify-content:center; gap:10px; margin:16px auto 0; font:bold 18px var(--fonte2); color:var(--sub); text-align:center; }
.rs-rk svg{ width:24px; height:24px; flex:none; color:var(--sub2); }
.rs-rk.ok{ color:#e9ffd0; } .rs-rk.ok svg{ color:var(--lima); }
.rs-rk b{ font:400 italic 20px var(--fonte); color:var(--lima); letter-spacing:1px; margin-right:4px; }
/* admin: mexer nos números */
.aj-rks{ display:flex; flex-direction:column; gap:10px; margin:6px 0 4px; }
.aj-rk{ display:grid; grid-template-columns:minmax(0,1fr) auto 220px auto; align-items:center; gap:12px; padding:10px 14px; border-radius:18px; background:rgba(0,0,0,.22); }
.aj-rk-n{ text-align:left; font-style:italic; font-size:26px; color:var(--amarelo); }
.aj-rk-b{ display:flex; gap:8px; }
.aj-rk-b .bt3d{ min-width:74px; font-size:22px; }
.aj-rk-v{ display:flex; flex-direction:column; align-items:center; line-height:1.05; }
.aj-rk-v b{ font-weight:400; font-size:44px; font-variant-numeric:tabular-nums; }
.aj-rk-v small{ font:bold 14px var(--fonte2); color:var(--sub2); }
.aj-rk-v small.mais{ color:var(--lima); } .aj-rk-v small.menos{ color:var(--coral); }
.ad-nome small.ad-rk{ color:var(--amarelo); font-weight:bold; }
/* ajustes: diagnóstico */
.aj-diag{ display:flex; flex-direction:column; gap:6px; margin-top:16px; padding:14px 18px; border-radius:18px; background:rgba(0,0,0,.22); font:15px/1.45 var(--fonte2); color:var(--sub); }
.aj-diag b{ font:400 italic 20px var(--fonte); color:var(--amarelo); letter-spacing:1px; }
.aj-diag .bt3d{ align-self:flex-start; margin-top:6px; }
.cm-item.breve{ border-color:#5a4a1a; background:linear-gradient(#2c2848, #191b3a); }
.cm-item.breve em{ color:var(--amarelo); }
#lg-dica-u{ font:bold 13px var(--fonte2); font-style:normal; color:var(--sub); letter-spacing:.3px; margin-left:8px; }
#lg-dica-u[hidden]{ display:none; }
/* em pé */
.retrato .rk-linha{ grid-template-columns:70px 48px minmax(0,1fr) auto; gap:10px; }
.retrato .rk-linha canvas{ width:48px; height:48px; }
.retrato .rk-pos{ font-size:28px; }
.retrato .pf-stats.c5, .retrato .rk-st{ grid-template-columns:repeat(2, minmax(0,1fr)); }
.retrato .aj-rk{ grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"n n n" "b1 v b2"; row-gap:6px; }
.retrato .aj-rk > :nth-child(1){ grid-area:n; } .retrato .aj-rk > :nth-child(2){ grid-area:b1; } .retrato .aj-rk > :nth-child(3){ grid-area:v; } .retrato .aj-rk > :nth-child(4){ grid-area:b2; }
.retrato .rs-melhor div b{ font-size:28px; }

/* ---------- aviso de RETRATO (o jogo é só deitado) ---------- */
#aviso-retrato{ display:none; position:fixed; inset:0; z-index:99999; background:radial-gradient(circle at 50% 28%, #27307a, #0b0f2c); color:#fff; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:30px; }
@media (orientation:portrait){ #aviso-retrato{ display:flex; } }
#aviso-retrato svg{ width:86px; height:86px; animation:giracel 1.7s ease-in-out infinite; }
@keyframes giracel{ 0%, 18%{ transform:rotate(0); } 55%, 100%{ transform:rotate(90deg); } }
#aviso-retrato b{ font-size:28px; letter-spacing:1px; }
#aviso-retrato span{ font-size:15px; opacity:.82; }

/* ---------- chat sempre embaixo, também na partida ---------- */
#ch-jogo{ position:fixed; left:50%; bottom:max(6px, env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:60; width:min(320px, 44vw); opacity:.92; }
#chj-msgs{ display:flex; flex-direction:column; align-items:center; gap:2px; margin-bottom:3px; pointer-events:none; }
#chj-msgs .chm{ max-width:100%; padding:2px 8px; border-radius:9px; background:rgba(6,10,30,.78); color:#fff; font-size:11px; line-height:1.25; word-break:break-word; animation:chmFade 6s forwards; }
@keyframes chmFade{ 0%, 60%{ opacity:1; } 100%{ opacity:.18; } }
#chj-msgs .chm b{ margin-right:3px; }
#chj-msgs .chm.t0 b{ color:#ff9a8a; } #chj-msgs .chm.t1 b{ color:#8ecfff; }
#chj-msgs .chm i{ opacity:.75; }
#ch-jogo form{ display:flex; gap:4px; padding:2px 3px 2px 10px; border-radius:15px; background:rgba(6,10,30,.78); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14), 0 3px 8px rgba(0,0,0,.35); }
#ch-jogo form:focus-within{ box-shadow:inset 0 0 0 2px #ffd23f, 0 3px 8px rgba(0,0,0,.35); background:rgba(6,10,30,.92); }
#ch-jogo input{ flex:1; min-width:0; height:30px; border:0; outline:none; background:transparent; color:#fff; font-size:16px; -webkit-user-select:text; user-select:text; }
#ch-jogo input::placeholder{ color:rgba(255,255,255,.35); font-size:13px; }
#ch-jogo button{ flex:none; width:34px; height:30px; border:0; border-radius:14px; background:linear-gradient(#8bec55,#35a21f); color:#10300a; font-size:13px; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv-jogo" aria-label="Campo da partida"></canvas>
  <div id="luz" aria-hidden="true"></div>

  <!-- ===================== HUD DA PARTIDA ===================== -->
  <div id="hud" hidden>
    <div class="tarja c"></div><div class="tarja b"></div>
    <div id="joy-area"></div>
    <div id="placar" aria-live="polite">
      <div class="pl-t" id="pl-ta"><i></i><span id="pl-na">VERMELHO</span></div>
      <div class="pl-g" id="pl-ga">0</div>
      <div class="pl-relogio" id="pl-rel">3:00</div>
      <div class="pl-g" id="pl-gb">0</div>
      <div class="pl-t" id="pl-tb"><span id="pl-nb">AZUL</span><i></i></div>
    </div>
    <div id="selo" hidden>GOL DE OURO</div>
    <canvas id="minimapa" width="10" height="10" aria-hidden="true"></canvas>
    <div id="joy" class="joy" aria-hidden="true"><div class="base"></div><div class="seta" id="joy-seta"></div><div class="k" id="joy-k"></div></div>
    <button type="button" class="hb passe" id="b-passe" aria-label="Passe">
      <svg class="anel" viewBox="0 0 100 100" aria-hidden="true"><circle class="fundo" cx="50" cy="50" r="46"/><circle class="cd" id="passe-cd" cx="50" cy="50" r="46"/></svg>
      <svg class="ic" viewBox="0 0 48 48" aria-hidden="true"><circle cx="11" cy="31" r="7" fill="#003c40"/><path d="M17 27c6-9 15-12 23-10" fill="none" stroke="#003c40" stroke-width="4.6" stroke-linecap="round" stroke-dasharray="1 8.5"/><path d="M33 9l9 7.5-10.5 5z" fill="#003c40"/><circle cx="11" cy="31" r="3" fill="#c4fff8"/></svg>
      <span>PASSE</span>
    </button>
    <button type="button" class="hb chute" id="b-chute" aria-label="Chute (segure para o chute forte)">
      <svg class="anel" viewBox="0 0 100 100" aria-hidden="true"><circle class="fundo" cx="50" cy="50" r="46"/><circle class="carga" id="chute-carga" cx="50" cy="50" r="46"/><circle class="cd" id="chute-cd" cx="50" cy="50" r="46"/></svg>
      <svg class="ic" viewBox="0 0 48 48" aria-hidden="true"><circle cx="30" cy="24" r="11" fill="#fff"/><path d="M30 15.5l5.2 3.8-2 6.1h-6.4l-2-6.1z" fill="#3a0a1c"/><path d="M19.5 26.5l-4.6 3.6M38 20.5l3.8-2.6M37.5 30.5l3.6 2.8M26 34.8l-1.5 4.6" stroke="#3a0a1c" stroke-width="1.6"/><path d="M3 16h11M1 24h12M4 32h10" stroke="#fff" stroke-width="3.4" stroke-linecap="round" opacity=".85"/></svg>
      <span>CHUTE</span>
    </button>
    <button type="button" class="h-pausa" id="h-pausa" aria-label="Pausar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.6" fill="#fff"/><rect x="14" y="4" width="5" height="16" rx="1.6" fill="#fff"/></svg></button>
    <div id="vs" hidden><div class="vs-l vs-a"><b id="vs-na">VERMELHO</b><small id="vs-ja"></small></div><div class="vs-l vs-b"><b id="vs-nb">AZUL</b><small id="vs-jb"></small></div><div class="vs-x">VS</div></div>
    <div id="msg"></div>
    <div id="dica" hidden></div>
    <button type="button" id="pular" hidden>PULAR ▸</button>
    <div id="fps" hidden></div>
    <div id="rede-info" hidden></div>
    <button type="button" id="h-editar" aria-label="Editar botões" title="Editar botões"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.2L16.5 4.5a2.4 2.4 0 0 1 3.4 0l.6.6a2.4 2.4 0 0 1 0 3.4L9.2 19.8z" fill="currentColor"/><path d="M3.5 21.5h17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>

  <!-- chat da sala sempre embaixo, também durante a partida -->
  <div id="ch-jogo" hidden>
    <div id="chj-msgs" aria-live="polite"></div>
    <form id="chj-form"><input id="chj-in" maxlength="80" autocomplete="off" enterkeyhint="send" placeholder="Escreva aqui" aria-label="Mensagem para a sala"><button type="submit" aria-label="Enviar">➤</button></form>
  </div>

  <!-- o jogo é só na horizontal -->
  <div id="aviso-retrato" role="alert">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" aria-hidden="true"><rect x="14" y="29" width="72" height="42" rx="7"/><path d="M30 14h40l-10-9M70 86H30l10 9"/></svg>
    <b>VIRE O CELULAR</b>
    <span>O GINGA se joga deitado, na horizontal — com as duas mãos.</span>
  </div>

  <div id="sobre" hidden><div class="palco" id="sobre-palco"></div></div>

  <!-- ===================== EDITAR BOTÕES ===================== -->
  <div id="editor" hidden></div>

  { id: 'gelo', nome: 'Gelo', preco: 400, cores: ['120,220,255', '220,250,255'] },
  { id: 'neon', nome: 'Neon', preco: 500, cores: ['57,255,136', '46,224,207'] },

const RASTRO = Object.fromEntries(RASTROS.map(r => [r.id, r]));

/* ---- 30-sim.js ---- */
// ======================================================================= FÍSICA do GINGA (botões, bola, paredes e traves)
const FIS = {

  reachMul: 1.4, reachPad: 6, kick: 520, kickCd: .15, grace: .2, passMul: .6, recuo: .16,

  // GINGA: segurar o CHUTE antes de chegar na bola carrega o chute forte (mais rápido e sem frear tanto)
  cargaIni: .08, cargaDur: .4, cargaLento: .92, forteMul: 1.5, forteCd: 2.2, forteMin: .6,
  duploJan: .14, duploMul: .5

  1: { W: 1000, H: 680, GW: 170, GD: 55, CC: 60, PAW: 220, PAH: 330 },
  2: { W: 1240, H: 840, GW: 200, GD: 60, CC: 70, PAW: 270, PAH: 420 },
  3: { W: 1480, H: 1000, GW: 230, GD: 64, CC: 80, PAW: 320, PAH: 500 }

  [[.42, -.2], [.42, .2]],
  [[.3, 0], [.62, -.24], [.62, .24]],
  [[.26, 0], [.5, -.28], [.5, .28], [.74, 0]]

// JOGABILIDADE: LEVE (o botão responde na hora e quase não desliza) · CLÁSSICA (com inércia: o botão desliza mais)
const MOVIMENTO = {
  leve:     { acc: 48, rev: 3.4, damp: .74, idle: .4, mom: .76 },
  classica: { acc: FIS.acc, rev: FIS.rev, damp: FIS.damp, idle: FIS.idle, mom: FIS.mom }
};

class Jog {
  constructor(id, time, nome, visual, humano){
    this.id = id; this.time = time; this.nome = nome; this.visual = visual || null; this.humano = !!humano;
    this.num = 0; this.dono = null;
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.r = FIS.pr; this.inv = FIS.pInv; this.bola = false;
    this.px = 0; this.py = 0;
    this.mx = 0; this.my = 0;
    this.kD = false; this.pD = false; this.kN = 0; this.pN = 0; this._kN = 0; this._pN = 0;

    this.ultChuteT = -9; this.ultBotao = ''; this.chutando = false; this.passando = false;
    this.mira = true; this.travado = false;

    this.bot = null; this.papel = '';
  }
}
function trava(L, down, borda, dt){
  L.tm = Math.max(0, L.tm - dt);
  if (borda) L.tm = FIS.grace;
  if (!down) L.arm = true;
  return (down && L.arm) || L.tm > 0;
}
function consome(L){ L.arm = false; L.tm = 0; }

class Partida {
  constructor(o){

  montaArena(){

      seg(-W2, -H2, -W2, -G2, 1, 0, true), seg(-W2, G2, -W2, H2, 1, 0, true),
      seg(W2, -H2, W2, -G2, -1, 0, true), seg(W2, G2, W2, H2, -1, 0, true),
      seg(-W2 - D, -G2, -W2 - D, G2, 0, 0, false), seg(-W2 - D, -G2, -W2, -G2, 0, 0, false), seg(-W2 - D, G2, -W2, G2, 0, 0, false),
      seg(W2 + D, -G2, W2 + D, G2, 0, 0, false), seg(W2, -G2, W2 + D, -G2, 0, 0, false), seg(W2, G2, W2 + D, G2, 0, 0, false)

  add(j){ this.jog.push(j); return j; }

  // posições do pontapé inicial (formação de cada modo)

  }

  // ------------------------------------------------ habilidades e movimento
  habilidades(j, dt){

  movimento(j, dt, k){

      if (b.x < -lx){ b.x = -lx; b.vx = Math.max(0, b.vx); } else if (b.x > lx){ b.x = lx; b.vx = Math.min(0, b.vx); }

    const jj = -(1 + e) * vn / im;

      else if (b.x - b.r > this.W / 2) this.marcou(0);
    }

  }
  marcou(time){
    this.golLigado = false;

      else {
        autor.st.gols++;

        }

    }
    const ultChute = autor && !contra && this.t - autor.ultChuteT < 2.5 ? autor : null;
    this.ev.push({ tipo: 'gol', time, autor, assist, contra, x: this.bola.x, y: this.bola.y, forte: !!(ultChute && (autor._ultK === 'forte' || autor._ultK === 'duplo')) });
  }

  // ------------------------------------------------ gravação para o replay
  grava(){
    const f = new Float32Array(3 + this.jog.length * 3);

    this.jog.forEach((j, i) => { f[3 + i * 3] = j.x; f[4 + i * 3] = j.y; f[5 + i * 3] = j.carga; });

    this.jog.forEach((j, i) => { j.px = j.x; j.py = j.y; j.vx = (f[3 + i * 3] - j.x) * 60; j.vy = (f[4 + i * 3] - j.y) * 60; j.x = f[3 + i * 3]; j.y = f[4 + i * 3]; j.carga = f[5 + i * 3]; });
  }

  foto(){

  }

  preve(t){ const b = this.bola, s = (1 - Math.pow(FIS.bDamp, t * FIS.tick)) * SOMA_BOLA; return { x: clamp(b.x + b.vx * s, -this.W / 2, this.W / 2), y: clamp(b.y + b.vy * s, -this.H / 2, this.H / 2) }; }
}

/* ---- 40-ia.js ---- */
// ======================================================================= BOTS
const DIF_P = [
  { reac: .34, atraso: .16, erro: .2,  tol: .34, vel: .8,  carga: 0,   passe: .3,  antecipa: .45, duplo: 0,   lerdo: .25 },
  { reac: .2,  atraso: .1,  erro: .11, tol: .24, vel: .92, carga: .35, passe: .55, antecipa: .75, duplo: 0,   lerdo: .1 },
  { reac: .11, atraso: .05, erro: .06, tol: .16, vel: 1,   carga: .7,  passe: .75, antecipa: .95, duplo: .12, lerdo: .03 },
  { reac: .06, atraso: .02, erro: .03, tol: .11, vel: 1,   carga: .9,  passe: .85, antecipa: 1,   duplo: .3,  lerdo: 0 }
];
function preveDe(p, s, t){ const k = (1 - Math.pow(FIS.bDamp, t * FIS.tick)) * SOMA_BOLA; return { x: clamp(s.x + s.vx * k, -p.W / 2, p.W / 2), y: clamp(s.y + s.vy * k, -p.H / 2, p.H / 2) }; }
function distSeg(px, py, ax, ay, bx, by){ const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1; const t = clamp(((px - ax) * dx + (py - ay) * dy) / L2, 0, 1); return Math.hypot(px - ax - dx * t, py - ay - dy * t); }

const IA = {
  // o estado da IA fica guardado em cada partida (o servidor roda várias ao mesmo tempo)
  est(p){ return p.ia || (p.ia = { hist: [], times: [{ t: 0, ch: null }, { t: 0, ch: null }] }); },
  registra(p){ const h = this.est(p).hist, b = p.bola; h.push({ x: b.x, y: b.y, vx: b.vx, vy: b.vy }); if (h.length > 40) h.shift(); },
  percebe(p, atraso){ const h = this.est(p).hist, n = h.length; if (!n) return { x: 0, y: 0, vx: 0, vy: 0 }; return h[Math.max(0, n - 1 - Math.round(atraso * 60))]; },
  reset(p){ if (p) p.ia = null; },
  tempoAte(p, j, s){
    const v = 185;
    for (let t = 0; t <= 2; t += .1){ const bp = preveDe(p, s, t); const d = Math.hypot(bp.x - j.x, bp.y - j.y) - 28; if (d / v <= t) return t; }
    const bp = preveDe(p, s, 2); return 2 + Math.hypot(bp.x - j.x, bp.y - j.y) / v;
  },
  papeis(p, time, dt){
    const st = this.est(p).times[time]; st.t -= dt; if (st.t > 0) return; st.t = .22;
    const m = p.jog.filter(j => j.time === time); if (!m.length) return;
    const s = this.percebe(p, .05);
    let ch = null, best = 1e9;
    for (const j of m){
      if (j.bot && j.bot.fixo){ j.papel = j.bot.fixo; continue; }
      const ti = this.tempoAte(p, j, s) - (j === st.ch ? .22 : 0) - (j.humano ? .35 : 0);
      if (ti < best){ best = ti; ch = j; }
    }
    st.ch = ch; if (ch) ch.papel = 'atacante';
    const meuGolX = time === 0 ? -p.W / 2 : p.W / 2;
    const outros = m.filter(j => j !== ch && !(j.bot && j.bot.fixo)).sort((a, b) => Math.abs(a.x - meuGolX) - Math.abs(b.x - meuGolX));
    const noMeuLado = s.x * (meuGolX > 0 ? 1 : -1) > -60;
    outros.forEach((j, i) => { j.papel = i === 0 && (m.length >= 3 || noMeuLado) ? (m.length >= 3 ? 'goleiro' : 'zagueiro') : 'apoio'; });
  }
};

class Bot {
  constructor(j, dif){ this.j = j; this.dif = dif; this.P = DIF_P[clamp(dif, 0, 3)]; this.decT = 0; this.acao = null; this.botao = null; this.botaoT = 0; this.segurando = false; this.mira = 0; this.lado = Math.random() < .5 ? -1 : 1; this.fixo = null; this.duploPend = -1; this.lerdoT = 0; }
  // não chuta se a bola for sair na direção do próprio gol
  seguro(){
    const p = this.p, j = this.j, b = p.bola; if (!p) return true;
    const dx = b.x - j.x, dy = b.y - j.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    const meuGolX = -this.dirAtk() * p.W / 2;
    if (ux * (meuGolX - b.x) > 0){ const t = (meuGolX - b.x) / ux; const yy = b.y + uy * t; if (Math.abs(yy) < p.GW / 2 + 70 && t < 1000) return false; }
    return true;
  }
  pensa(p, dt){
    this.p = p;
    const j = this.j; if (j.travado){ j.mx = j.my = 0; this.solta(); return; }
    this.decT -= dt; this.lerdoT -= dt;
    const s = IA.percebe(p, this.P.atraso);
    const papel = this.fixo || j.papel;
    if (papel === 'atacante') this.atacar(p, dt, s);
    else if (papel === 'goleiro') this.goleiro(p, dt, s);
    else if (papel === 'zagueiro') this.zagueiro(p, dt, s);
    else this.apoio(p, dt, s);
    this.botoes(p, dt);
  }
  vaiPara(p, gx, gy, chegada = 26, vel = 1){
    const j = this.j, W2 = p.W / 2, G2 = p.GW / 2;
    // sair de trás da linha de fundo sem enroscar na trave nem na rede
    if (Math.abs(j.x) > W2 - 4){
      const sx = Math.sign(j.x), dentro = Math.abs(j.y) < G2;
      if (dentro && Math.abs(gx) < W2 - 10){ gx = sx * (W2 - 60); gy = clamp(j.y, -G2 + 22, G2 - 22); }
      else if (!dentro && (Math.sign(gy) !== Math.sign(j.y) || Math.abs(gy) < G2 + 34)){ gx = sx * (W2 - 60); gy = Math.sign(j.y) * Math.max(Math.abs(j.y), G2 + j.r + 14); }
    }
    // destravar quando fica empurrando e não sai do lugar
    const vj = Math.hypot(j.vx, j.vy), quer = Math.hypot(gx - j.x, gy - j.y) > 40;
    if (quer && vj < 28) this.travaT = (this.travaT || 0) + 1 / 60; else this.travaT = 0;
    if (this.travaT > .7){ this.travaT = 0; const a = Math.atan2(gy - j.y, gx - j.x) + (Math.random() < .5 ? 1 : -1) * 1.3; this.desvio = { t: .45, x: j.x + Math.cos(a) * 120, y: j.y + Math.sin(a) * 120 }; }
    if (this.desvio && this.desvio.t > 0){ this.desvio.t -= 1 / 60; gx = this.desvio.x; gy = this.desvio.y; }
    // separação dos companheiros
    for (const o of p.jog){ if (o === j || o.time !== j.time) continue; const dx = j.x - o.x, dy = j.y - o.y, d = Math.hypot(dx, dy); if (d < 64 && d > 0 && j.papel !== 'atacante'){ gx += dx / d * (64 - d) * 1.4; gy += dy / d * (64 - d) * 1.4; } }
    const dx = gx - j.x, dy = gy - j.y, d = Math.hypot(dx, dy);
    if (d < 1.5){ j.mx = j.my = 0; return; }
    const mag = Math.min(1, d / chegada) * this.P.vel * vel;
    j.mx = dx / d * mag; j.my = dy / d * mag;
  }
  dirAtk(){ return this.j.time === 0 ? 1 : -1; }
  rivais(p){ return p.jog.filter(o => o.time !== this.j.time); }

  // ------------------------------------------------ quem vai na bola
  decide(p, s){
    const j = this.j, P = this.P, dir = this.dirAtk(), golX = dir * p.W / 2, meuGolX = -golX;
    const bp = preveDe(p, s, .25);
    const distGol = Math.hypot(golX - bp.x, bp.y), distMeu = Math.hypot(meuGolX - bp.x, bp.y);
    let pressao = 1e9; for (const o of this.rivais(p)) pressao = Math.min(pressao, Math.hypot(o.x - bp.x, o.y - bp.y));
    this.mira = (Math.random() * 2 - 1) * P.erro;
    if (Math.random() < P.lerdo) this.lerdoT = rnd(.2, .5);
    if (distMeu < 340 && pressao < 130){
      this.acao = { tipo: 'afasta', tx: bp.x + dir * 520, ty: bp.y + (bp.y >= 0 ? 1 : -1) * 300, carregar: false }; return;
    }
    const alvoY = this.canto(p, golX);
    const qc = this.qualChute(p, bp, golX, alvoY, dir);
    const ps = this.melhorPasse(p, bp, dir, golX);
    // decide uma vez se vai carregar o chute forte e mantém a ideia por um tempinho
    this.planoT = (this.planoT || 0) - P.reac;
    if (this.planoT <= 0){ this.plano = Math.random() < P.carga; this.planoT = 1.4; }
    if (qc > .52 || (distGol < 360 && qc > .22)){ this.acao = { tipo: 'chute', tx: golX + dir * 30, ty: alvoY, carregar: distGol > 200 && this.plano }; return; }
    if (ps && Math.random() < P.passe && (ps.q > qc + .08 || pressao < 95)){ this.acao = { tipo: 'passe', tx: ps.x, ty: ps.y }; return; }
    if (distGol < 640 && qc > .3 && Math.random() < .45){ this.acao = { tipo: 'chute', tx: golX + dir * 30, ty: alvoY, carregar: this.plano }; return; }
    // conduzir: para o gol, desviando do rival mais perto
    let ty = bp.y * .6; let perto = null, pd = 1e9;
    for (const o of this.rivais(p)){ const ahead = (o.x - bp.x) * dir; if (ahead > 0 && ahead < 260){ const d = Math.hypot(o.x - bp.x, o.y - bp.y); if (d < pd){ pd = d; perto = o; } } }
    if (perto) ty = bp.y + (perto.y > bp.y ? -1 : 1) * 170;
    this.acao = { tipo: 'conduz', tx: clamp(bp.x + dir * 300, -p.W / 2 + 60, p.W / 2 - 60), ty: clamp(ty, -p.H / 2 + 70, p.H / 2 - 70) };
    if (Math.abs(this.acao.tx - bp.x) < 120) this.acao = { tipo: 'chute', tx: golX + dir * 30, ty: alvoY, carregar: false };
  }
  canto(p, golX){
    let gk = null, gd = 1e9;
    for (const o of this.rivais(p)){ const d = Math.hypot(o.x - golX, o.y); if (d < gd){ gd = d; gk = o; } }
    const m = p.GW / 2 - 24;
    if (gk && gd < 220) return (gk.y > 0 ? -1 : 1) * m * rnd(.55, 1);
    return (Math.random() < .5 ? -1 : 1) * m * rnd(.2, .9);
  }
  qualChute(p, bp, golX, alvoY, dir){
    if ((golX - bp.x) * dir < 20) return 0;
    const dist = Math.hypot(golX - bp.x, alvoY - bp.y);
    let q = clamp(1 - (dist - 220) / 620, 0, 1);
    const ang = Math.abs(Math.atan2(bp.y, Math.abs(golX - bp.x)));
    q *= clamp(1.3 - ang, .15, 1);
    for (const o of this.rivais(p)){ if (distSeg(o.x, o.y, bp.x, bp.y, golX, alvoY) < 30) q *= .45; }
    return q;
  }
  melhorPasse(p, bp, dir, golX){
    let best = null;
    for (const m of p.jog){
      if (m === this.j || m.time !== this.j.time) continue;
      const tx = m.x + m.vx * .3, ty = m.y + m.vy * .3, d = Math.hypot(tx - bp.x, ty - bp.y);
      if (d < 110 || d > 760) continue;
      let q = .45 + clamp((tx - bp.x) * dir / 420, -.4, .45);
      for (const o of this.rivais(p)) if (distSeg(o.x, o.y, bp.x, bp.y, tx, ty) < 42) q -= .5;
      q += (1 - clamp(Math.hypot(golX - tx, ty) / 900, 0, 1)) * .35;
      if (m.humano) q += .12;
      if (!best || q > best.q) best = { q, x: tx, y: ty, m };
    }
    return best && best.q > .2 ? best : null;
  }
  atacar(p, dt, s){
    const j = this.j, P = this.P, b = p.bola;
    if (this.decT <= 0 || !this.acao){ this.decT = P.reac * rnd(.8, 1.3); this.decide(p, s); }
    if (this.lerdoT > 0){ this.vaiPara(p, s.x, s.y, 30, .6); return; }
    const a = this.acao;
    const dist = Math.hypot(s.x - j.x, s.y - j.y);
    const bp = preveDe(p, s, clamp(dist / 260, 0, .6) * P.antecipa);
    let ax = a.tx - bp.x, ay = a.ty - bp.y; const al = Math.hypot(ax, ay) || 1; ax /= al; ay /= al;
    const an = Math.atan2(ay, ax) + this.mira; ax = Math.cos(an); ay = Math.sin(an);
    const rx = j.x - bp.x, ry = j.y - bp.y, along = rx * ax + ry * ay, perp = -rx * ay + ry * ax;
    const contato = j.r + b.r;
    // bola presa no canto ou na linha: bate pro meio
    const vb = Math.hypot(b.vx, b.vy), naParede = Math.abs(b.x) > p.W / 2 - 34 || Math.abs(b.y) > p.H / 2 - 34;
    if (vb < 30 && naParede && dist < 60){ this.presoT = (this.presoT || 0) + dt; } else this.presoT = 0;
    if (this.presoT > .9){ this.presoT = 0; this.acao = { tipo: 'afasta', tx: 0, ty: 0, carregar: false }; this.decT = .8; }
    const atras = this.atras ? along < -contato * .05 : along < -contato * .55;
    this.atras = atras;
    let gx, gy;
    if (!atras){
      // contorna a bola sem encostar: primeiro sai de lado, depois vai por trás
      const lado = perp >= 0 ? 1 : -1, px = -ay * lado, py = ax * lado, R0 = contato + 12;
      if (Math.abs(perp) < R0 + 8){ const al = Math.max(along, 6); gx = bp.x + ax * al + px * (R0 + 24); gy = bp.y + ay * al + py * (R0 + 24); }
      else { gx = bp.x + px * (R0 + 14) - ax * (contato + 8); gy = bp.y + py * (R0 + 14) - ay * (contato + 8); }
      this.soltaCarga();
      // se está colado e é pra afastar, bate assim mesmo
      if (a.tipo === 'afasta' && dist < p.alcance(j) + 2){ const dirMeuGol = -this.dirAtk(); if ((b.x - j.x) * dirMeuGol < 0) this.aperta('k'); }
    } else {
      gx = bp.x - ax * (contato + 2); gy = bp.y - ay * (contato + 2);
      const mbx = b.x - j.x, mby = b.y - j.y, mbl = Math.hypot(mbx, mby) || 1;
      const erro = Math.acos(clamp((mbx * ax + mby * ay) / mbl, -1, 1));
      const reach = p.alcance(j);
      if (a.tipo === 'conduz'){ gx = bp.x + ax * 34; gy = bp.y + ay * 34; }
      else if (erro < P.tol){
        gx = bp.x + ax * 12; gy = bp.y + ay * 12;
        if (a.tipo === 'passe'){ if (mbl < reach + 1) this.aperta('p'); }
        else if (a.carregar && j.forteCd <= 0 && mbl > reach + 4) this.segura();
        else if (mbl < reach + 1) this.aperta('k');
      } else if (a.carregar && j.forteCd <= 0 && erro < P.tol * 2.5 && mbl < 320 && mbl > reach + 4) this.segura();
      else this.soltaCarga();
    }
    this.vaiPara(p, gx, gy, 12, 1);
  }
  goleiro(p, dt, s){
    const j = this.j, dir = this.dirAtk(), meuGolX = -dir * p.W / 2, b = p.bola;
    let ty = s.y * .5;
    if (s.vx * -dir > 60){ const tt = Math.abs((meuGolX - s.x) / s.vx); if (tt < 1.6) ty = s.y + s.vy * tt * .85; }
    ty = clamp(ty, -p.GW / 2 + 14, p.GW / 2 - 14);
    let gx = meuGolX + dir * (j.r + 18), gy = ty;
    const distBolaGol = Math.hypot(s.x - meuGolX, s.y), vb = Math.hypot(s.vx, s.vy), db = Math.hypot(s.x - j.x, s.y - j.y);
    let rivalPerto = 1e9; for (const o of this.rivais(p)) rivalPerto = Math.min(rivalPerto, Math.hypot(o.x - s.x, o.y - s.y));
    if (distBolaGol < 250 && (vb < 170 || db < 75) && (rivalPerto > db - 10 || db < 60)){
      let ux = s.x - meuGolX, uy = s.y; const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
      gx = s.x - ux * (j.r + b.r) + ux * 10; gy = s.y - uy * (j.r + b.r) + uy * 10;
      const mbx = b.x - j.x, mby = b.y - j.y, mbl = Math.hypot(mbx, mby) || 1;
      if (mbl < p.alcance(j) + 1 && (mbx * ux + mby * uy) / mbl > .2) this.aperta('k');
      this.vaiPara(p, gx, gy, 10, 1); return;
    }
    this.vaiPara(p, gx, gy, 22, 1);
  }
  zagueiro(p, dt, s){
    const j = this.j, dir = this.dirAtk(), meuGolX = -dir * p.W / 2, b = p.bola;
    const vx = s.x - meuGolX, vy = s.y, L = Math.hypot(vx, vy) || 1;
    const dd = clamp(L * .42, 110, 420);
    let gx = meuGolX + vx / L * dd, gy = vy / L * dd;
    // marca o rival livre mais perigoso quando a bola está longe
    if (L > 520){
      let alvo = null, ad = 1e9;
      for (const o of this.rivais(p)){ const d = Math.hypot(o.x - meuGolX, o.y); if (d < ad && Math.hypot(o.x - s.x, o.y - s.y) > 120){ ad = d; alvo = o; } }
      if (alvo){ const ox = alvo.x - meuGolX, oy = alvo.y, ol = Math.hypot(ox, oy) || 1; gx = lerp(gx, meuGolX + ox / ol * (ol - 70), .6); gy = lerp(gy, oy / ol * (ol - 70), .6); }
    }
    const db = Math.hypot(b.x - j.x, b.y - j.y);
    if (db < p.alcance(j) + 1){ const ux = b.x - j.x; if (ux * dir > 0) this.aperta('k'); }
    this.vaiPara(p, gx, gy, 26, 1);
  }
  apoio(p, dt, s){
    const j = this.j, dir = this.dirAtk();
    if (Math.abs(s.y) > p.H * .25) this.lado = s.y > 0 ? -1 : 1;
    let gx = clamp(s.x + dir * 240, -p.W / 2 + 110, p.W / 2 - 110);
    if (gx * dir > p.W / 2 - 150) gx = dir * (p.W / 2 - 150);
    let gy = clamp(s.y + this.lado * 230, -p.H / 2 + 70, p.H / 2 - 70);
    const db = Math.hypot(p.bola.x - j.x, p.bola.y - j.y);
    if (db < p.alcance(j) + 1 && (p.bola.x - j.x) * dir > 0) this.aperta('k');
    this.vaiPara(p, gx, gy, 40, 1);
  }
  // ------------------------------------------------ botões
  aperta(b){
    if (this.botao || !this.seguro()) return;
    const j = this.j;
    if (b === 'k'){ j.kD = true; j.kN++; } else { j.pD = true; j.pN++; }
    this.botao = b; this.botaoT = .12; this.segurando = false;
    if (b === 'k' && this.acao && this.acao.tipo === 'chute' && Math.random() < this.P.duplo) this.duploPend = .06;
  }
  segura(){
    const j = this.j;
    if (this.botao === 'k' && this.segurando){ this.botaoT = .3; return; }
    if (this.botao || !this.seguro()) return;
    j.kD = true; j.kN++; this.botao = 'k'; this.segurando = true; this.botaoT = .3;
  }
  soltaCarga(){ if (this.segurando){ this.j.kD = false; this.botao = null; this.segurando = false; } }
  solta(){ this.j.kD = this.j.pD = false; this.botao = null; this.segurando = false; }
  botoes(p, dt){
    const j = this.j;
    if (this.duploPend > 0){ this.duploPend -= dt; if (this.duploPend <= 0){ j.pN++; this.duploPend = -1; } }
    if (!this.botao) return;
    if (!this.seguro()){ this.solta(); j.kL.tm = 0; j.pL.tm = 0; return; }
    this.botaoT -= dt;
    const L = this.botao === 'k' ? j.kL : j.pL;
    if (!L.arm || this.botaoT <= 0) this.solta();
  }
}

/* ---- 45-proto.js ---- */
// ======================================================================= SALAS: regras e protocolo (o mesmo arquivo roda no jogo e no servidor)
// Tudo viaja em JSON pelo WebSocket; cada mensagem tem o campo t (o tipo). A lista completa está no PROTOCOLO.md.
const PROTO = 3;
// nome de usuário: de 3 a 8 letras ou números (pode _ e .). Para entrar, aceita os nomes antigos (até 16).
const USUARIO_MAX = 8;
const USUARIO_RE = /^[\p{L}\p{N}_.]{3,8}$/u, USUARIO_ENTRAR_RE = /^[\p{L}\p{N}_.]{3,16}$/u;
const usuarioMin = u => String(u).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const SALA = {
  nomeMin: 3, nomeMax: 32, senhaMax: 32, chatMax: 80, espMax: 12, nomeJogMax: 16,
  modos: [1, 2, 3, 4], campos: [1, 2, 3], tempos: [3, 5, 7, 10], gols: [0, 1, 3, 5, 10]
};
const ESPECTADOR = 2;                                     // time 0 = VERMELHO, 1 = AZUL, 2 = espectadores
const CAMPO_NOME = { 1: 'PEQUENO', 2: 'MÉDIO', 3: 'GRANDE' };
const REGIAO_NOME = { sa: 'BRASIL', us: 'EUA', eu: 'EUROPA', local: 'AQUI' };
const STATUS_NOME = { espera: 'ESPERANDO', comecando: 'COMEÇANDO', jogo: 'EM JOGO' };
const HORAS_SALA = ['tarde', 'por', 'noite'];
const campoPadrao = modo => modo <= 1 ? 1 : modo === 2 ? 2 : 3;
const maxJogadores = modo => modo * 2;

// ajustes da sala sempre válidos (o que vier errado volta para o padrão)
function cfgSala(c){
  c = c && typeof c === 'object' ? c : {};
  const modo = SALA.modos.includes(+c.modo) ? +c.modo : 2;
  return {
    modo,
    campo: SALA.campos.includes(+c.campo) ? +c.campo : campoPadrao(modo),
    tempo: SALA.tempos.includes(+c.tempo) ? +c.tempo : 3,
    gols: SALA.gols.includes(+c.gols) ? +c.gols : 5,
    ouro: c.ouro !== false,

const nomeSala = s => { s = limpaTexto(s, SALA.nomeMax); return s.length >= SALA.nomeMin ? s : ''; };

function visualLimpo(v){
  v = v && typeof v === 'object' ? v : {};
  return { desenho: skinDe(v.desenho).id, texto: textoBotao(v.texto), cor: v.cor === 'time' || COR_RE.test(v.cor) ? v.cor : 'time' };
}
// quantos jogam e quantos assistem
function contaSala(s){ let jog = 0, esp = 0; for (const m of s.membros) m.time === ESPECTADOR ? esp++ : jog++; return { jog, esp }; }
const vagasTime = (s, t) => s.cfg.modo - s.membros.filter(m => m.time === t).length;

function resumoSala(s){
  const { jog, esp } = contaSala(s), dono = s.membros.find(m => m.id === s.dono);

// para onde vai quem entra: o time com menos gente (se tiver vaga) ou a arquibancada
function timeQueEntra(s){
  const a = vagasTime(s, 0), b = vagasTime(s, 1);
  if (a <= 0 && b <= 0) return ESPECTADOR;
  if (a === b) return Math.random() < .5 ? 0 : 1;
  return a > b ? 0 : 1;
}
// nome de bot que ainda não está na sala
function nomeDeBot(s){
  const usados = new Set(s.membros.map(m => m.nome));

const DIF_NOME = ['FÁCIL', 'MÉDIO', 'DIFÍCIL', 'LENDA'];

// ======================================================================= RANKING DAS SALAS: gols, assistências e melhor da partida
// rk = { j: jogos, v: vitórias, g: gols, a: assistências, m: vezes que foi o melhor da partida }
const rkZero = () => ({ j: 0, v: 0, g: 0, a: 0, m: 0 });
function rkLimpo(r){ r = r && typeof r === 'object' ? r : {}; const o = rkZero(); for (const k in o) o[k] = Math.max(0, Math.min(1e7, Math.floor(+r[k] || 0))); return o; }
const RK_NOMES = { g: 'GOLS', a: 'ASSISTÊNCIAS', m: 'MELHOR DA PARTIDA' };
// a nota de cada um na partida: gol 10, assistência 6, vitória 4, chute 1, passe 0,6, toque 0,25 e gol contra −6
function notaPartida(st, venceu){ return (st.gols | 0) * 10 + (st.assist | 0) * 6 + (venceu ? 4 : 0) + (st.chutes | 0) + (st.passes | 0) * .6 + (st.toques | 0) * .25 - (st.contra | 0) * 6; }
// o melhor da partida: a maior nota (empate: mais gols, depois mais assistências). jogs = [{ id, time, st }]
function melhorDaPartida(jogs, placar){
  let melhor = null, mn = -1e9;
  for (const j of jogs || []){
    if (!j || !j.st) continue;
    const venceu = (j.time === 0 && placar[0] > placar[1]) || (j.time === 1 && placar[1] > placar[0]);
    const n = Math.round(notaPartida(j.st, venceu) * 100) / 100;
    if (!melhor || n > mn || (n === mn && ((j.st.gols | 0) > (melhor.st.gols | 0) || ((j.st.gols | 0) === (melhor.st.gols | 0) && (j.st.assist | 0) > (melhor.st.assist | 0))))){ melhor = j; mn = n; }
  }
  return melhor ? { id: melhor.id, nota: mn } : null;
}

  por:   { sombra: [.85, .62], sombraA: .44, ceu: '#ff9b5a', grama: ['#3d9f44', '#348f3c'], luz: 'por' },

function geraCampo(p, hora, res){

// ---------- pessoas da torcida (vistas de cima)
const PELES = ['#8d5524', '#a8672f', '#c68642', '#e0ac69', '#f1c27d', '#5c3a1e', '#ffdbac'];
const CABELOS = ['#1b1210', '#2d1a0e', '#4a2d16', '#7a4a1e', '#d8b060', '#111'];
function geraTorcida(p, geo, rr){
  const lista = [];
  const { kx1, kx2, ky1, ky2, gx1, gx2, gy1, gy2 } = geo;
  const addLinha = (ax, ay, bx, by, nx, ny) => {
    const L = Math.hypot(bx - ax, by - ay), n = Math.floor(L / 25);
    for (let i = 0; i < n; i++){
      if (rr() < .18) continue;
      const t = (i + .5 + (rr() - .5) * .5) / n, prof = 20 + rr() * 80;
      const time = rr() < .42 ? 0 : rr() < .72 ? 1 : 2;
      lista.push({ x: ax + (bx - ax) * t + nx * prof, y: ay + (by - ay) * t + ny * prof, time,
        camisa: time === 0 ? CORES_TIME[0] : time === 1 ? CORES_TIME[1] : pick2(['#ffffff', '#ffd23f', '#3d6bff', '#111', '#ff9f1c', '#c6ff3d'], rr),
        pele: pick2(PELES, rr), cabelo: pick2(CABELOS, rr), bone: rr() < .2, bandeira: rr() < .06, a0: rr() * TAU, f: rr() * TAU, pula: 0, lado: Math.sign(ax + bx) || 1 });
    }
  };
  addLinha(gx1, ky1 + 4, gx2, ky1 + 4, 0, 1);    // em cima
  addLinha(gx1, gy2 + 14, gx2, gy2 + 14, 0, 1);  // embaixo
  addLinha(kx1 + 4, gy1, kx1 + 4, -p.GW, 1, 0); addLinha(kx1 + 4, p.GW, kx1 + 4, gy2, 1, 0);
  addLinha(gx2 + 14, gy1, gx2 + 14, -p.GW, 1, 0); addLinha(gx2 + 14, p.GW, gx2 + 14, gy2, 1, 0);
  return lista;
}
function desenhaPessoa(g, pe, t, olha, so, anim){
  const pulo = anim ? pe.pula : 0;
  const esc = 1 + pulo * .25 + (anim ? Math.sin(t * 3 + pe.f) * .02 : 0);
  const a = anim && olha != null ? olha : pe.a0;
  g.save(); g.translate(pe.x, pe.y);
  g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.ellipse(so[0] * (6 + pulo * 14), so[1] * (6 + pulo * 14), 10, 7, 0, 0, TAU); g.fill();
  g.rotate(a); g.scale(esc * 1.3, esc * 1.3);
  if (pe.bandeira){ const ond = anim ? Math.sin(t * 6 + pe.f) * 4 : 0; g.fillStyle = pe.camisa; g.beginPath(); g.moveTo(4, -4); g.quadraticCurveTo(18, -8 + ond, 30, -4 + ond * .5); g.lineTo(30, 12 + ond * .5); g.quadraticCurveTo(18, 8 + ond, 4, 12); g.closePath(); g.fill(); g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1.5; g.stroke(); }
  g.fillStyle = pe.camisa; g.strokeStyle = 'rgba(20,10,30,.55)'; g.lineWidth = 1.4; g.beginPath(); g.ellipse(0, 0, 6.5, 10.5, 0, 0, TAU); g.fill(); g.stroke();
  g.fillStyle = pe.pele; g.beginPath(); g.ellipse(1.5, -9.5, 2.6, 2.4, 0, 0, TAU); g.ellipse(1.5, 9.5, 2.6, 2.4, 0, 0, TAU); g.fill();
  g.fillStyle = pe.pele; g.beginPath(); g.arc(1.5, 0, 4.6, 0, TAU); g.fill(); g.stroke();
  g.fillStyle = pe.bone ? pe.camisa : pe.cabelo; g.beginPath(); g.arc(.2, 0, 4.4, Math.PI * .5, Math.PI * 1.5); g.fill();
  if (pe.bone){ g.fillRect(3, -2.6, 4, 5.2); }
  g.restore();
}
// ---------- coqueiro visto de cima
function desenhaCoqueiro(g, c, t, so, hora){
  const bal = t ? Math.sin(t * .9 + c.f) * .06 + Math.sin(t * 2.1 + c.f * 2) * .02 : 0;
  const R = 74 * c.s;
  // sombra
  g.save(); g.translate(c.x + so[0] * 70 * c.s, c.y + so[1] * 70 * c.s); g.rotate(c.f + bal * .6); g.fillStyle = 'rgba(20,40,10,.22)';
  for (let k = 0; k < 8; k++){ g.rotate(TAU / 8); g.beginPath(); g.ellipse(R * .5, 0, R * .5, R * .12, 0, 0, TAU); g.fill(); }
  g.restore();
  // folhas
  g.save(); g.translate(c.x, c.y); g.rotate(c.f + bal);
  const verdes = hora === 'noite' ? ['#1e5a2c', '#174a24', '#2a6e36'] : ['#3c9a3a', '#2f8a33', '#57b847'];
  for (let k = 0; k < 9; k++){
    const a = k * TAU / 9 + Math.sin(k * 3.1) * .15, L = R * (.85 + .15 * Math.sin(k * 1.7)), cur = (k % 2 ? .25 : -.2) + bal * 2;
    g.save(); g.rotate(a);
    g.fillStyle = verdes[k % 3];
    g.beginPath(); g.moveTo(0, 0);
    const n = 9;
    for (let i = 1; i <= n; i++){ const u = i / n, x = L * u, y = Math.sin(u * Math.PI) * L * cur * .25; const w = L * .16 * Math.sin(u * Math.PI) + 2; g.lineTo(x, y - w); g.lineTo(x - L * .04, y - w * .25); }
    for (let i = n; i >= 1; i--){ const u = i / n, x = L * u, y = Math.sin(u * Math.PI) * L * cur * .25; const w = L * .16 * Math.sin(u * Math.PI) + 2; g.lineTo(x - L * .04, y + w * .25); g.lineTo(x, y + w); }
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,200,.25)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(0, 0); for (let i = 1; i <= n; i++){ const u = i / n; g.lineTo(L * u, Math.sin(u * Math.PI) * L * cur * .25); } g.stroke();
    g.restore();
  }
  g.fillStyle = '#6b4a22'; g.beginPath(); g.arc(0, 0, 8 * c.s, 0, TAU); g.fill();
  g.fillStyle = '#5a3a14'; for (let k = 0; k < 3; k++){ const a = k * TAU / 3 + .5; g.beginPath(); g.arc(Math.cos(a) * 7 * c.s, Math.sin(a) * 7 * c.s, 4.5 * c.s, 0, TAU); g.fill(); }
  g.restore();
}

// ======================================================================= BOLA 3D (icosaedro truncado de verdade, rolando com a velocidade)
const BOLA_PADRAO = { base: '#eef0f7', gomo: '#1e1c2e' };
const Bola3D = (() => {
  const phi = (1 + Math.sqrt(5)) / 2;
  const norm = v => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

  const pent = ico.map((v, i) => {
    const viz = ico.filter((w, k) => k !== i && Math.abs(Math.hypot(w[0] - v[0], w[1] - v[1], w[2] - v[2]) - 2) < 1e-6);
    const pts = viz.map(w => norm([v[0] + (w[0] - v[0]) * .33, v[1] + (w[1] - v[1]) * .33, v[2] + (w[2] - v[2]) * .33]));
    const c = norm(v); const ux = norm(cross(c, Math.abs(c[1]) < .9 ? [0, 1, 0] : [1, 0, 0])), uy = cross(c, ux);
    pts.sort((a, b) => Math.atan2(dot(a, uy), dot(a, ux)) - Math.atan2(dot(b, uy), dot(b, ux)));
    return { c, pts };
  });

    const v = Math.hypot(vx, vy); if (v < .5) return;

    const M = e.M, N = new Array(9);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) N[i * 3 + j] = R[i * 3] * M[j] + R[i * 3 + 1] * M[3 + j] + R[i * 3 + 2] * M[6 + j];

      g.fillStyle = est.gomo;
      for (const p of pent){ const cz = M[6] * p.c[0] + M[7] * p.c[1] + M[8] * p.c[2]; if (cz < .2) continue; const X = M[0] * p.c[0] + M[1] * p.c[1] + M[2] * p.c[2], Y = M[3] * p.c[0] + M[4] * p.c[1] + M[5] * p.c[2]; g.beginPath(); g.arc(X * r * .9, Y * r * .9, r * .26 * cz, 0, TAU); g.fill(); }
      g.strokeStyle = 'rgba(20,20,40,.55)'; g.lineWidth = r * .12; g.beginPath(); g.arc(0, 0, r * .95, 0, TAU); g.stroke();
      g.restore(); return;
    }
    if (est.brilho){ g.save(); g.globalCompositeOperation = 'lighter'; const bg = g.createRadialGradient(0, 0, r * .6, 0, 0, r * 2); bg.addColorStop(0, rgba(est.brilho, .55)); bg.addColorStop(1, rgba(est.brilho, 0)); g.fillStyle = bg; g.fillRect(-r * 2, -r * 2, r * 4, r * 4); g.restore(); }

// ======================================================================= DESEMPENHO: se o celular não aguenta, a resolução cai sozinha (e volta quando sobra)
// Mede os quadros por segundo da partida. Dois segundos seguidos abaixo do alvo: a resolução cai um degrau.
// Já no mínimo e ainda pesado: o gráfico desce um nível (MAX › ULTRA › PADRÃO › SUAVE), a não ser que a pessoa
// tenha escolhido o gráfico na mão. Sobrou fôlego por 10 segundos: a resolução sobe de novo.
const Desempenho = {
  janela: 0, quadros: 0, ruins: 0, bons: 0, fps: 0, medido: false,
  zera(){ this.janela = 0; this.quadros = 0; this.ruins = 0; this.bons = 0; },
  quadro(dt){
    if (dt > .25){ this.zera(); return; }                  // voltou do fundo ou travou um instante: não conta
    this.janela += dt; this.quadros++;
    if (this.janela < 1) return;
    const fps = this.quadros / this.janela, ref = G.fps || 60;
    this.fps = Math.round(fps); this.medido = true; this.janela = 0; this.quadros = 0;
    if (fps < ref * .86){ this.ruins++; this.bons = 0; }
    else if (fps > ref * .95){ this.bons++; this.ruins = 0; }
    else { this.ruins = 0; this.bons = 0; }
    if (this.ruins >= 2){ this.ruins = 0; this.desce(); }
    else if (this.bons >= 10 && R.auto < 1){ this.bons = 0; R.auto = Math.min(1, +(R.auto + .1).toFixed(2)); this.guarda(); R.tamanho(); }
  },
  // a resolução que deu certo fica guardada: na próxima partida já começa nela
  guarda(){ S.cfg.res = R.auto; salvar(); },
  desce(){
    if (R.auto > .61){ R.auto = Math.max(.6, +(R.auto - .15).toFixed(2)); this.guarda(); R.tamanho(); return; }
    if (S.cfg.grafMao) return;
    const ordem = ['max', 'ultra', 'padrao', 'suave'], i = ordem.indexOf(G.id);
    if (i < 0 || i >= ordem.length - 1) return;
    R.auto = 1; App.graficos(ordem[i + 1], 'auto');
  }
};

// ======================================================================= DESENHO DA PARTIDA
let _filtroOk = null;
function filtroFunciona(){
  if (_filtroOk !== null) return _filtroOk;
  try {
    const c = document.createElement('canvas'); c.width = c.height = 9; const g = c.getContext('2d');
    if (!g || !('filter' in g)){ _filtroOk = false; return false; }
    const f = document.createElement('canvas'); f.width = f.height = 9; const fg = f.getContext('2d'); fg.fillStyle = '#fff'; fg.fillRect(4, 4, 1, 1);
    g.filter = 'blur(2px)'; g.drawImage(f, 0, 0); g.filter = 'none';
    _filtroOk = g.getImageData(2, 4, 1, 1).data[3] > 0;
  } catch (_) { _filtroOk = false; }
  return _filtroOk;
}
const R = {
  cv: null, g: null, w: 1, h: 1, dpr: 1, p: null, campo: null, geo: null, hora: 'por', HC: HORA_CFG.por,

  part: [], tela: [], ripples: [], rastro: [], carros: [], bola: null, eu: null, nomes: true,
  sombraSpr: null, brilhoSpr: null, bloomCv: null, auto: clamp(+S.cfg.res || 1, .6, 1),
  init(cv){

    const rg = sg.createRadialGradient(32, 32, 0, 32, 32, 32); rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(.55, 'rgba(0,0,0,.85)'); rg.addColorStop(1, 'rgba(0,0,0,0)');

// ======================================================================= CONTROLES: analógico + PASSE e CHUTE (+ teclado e controle)

//  · FIXO (padrão): o centro não sai do lugar; tocar longe dele já anda para aquele lado.
//  · SOLTO: o analógico aparece onde o dedo encostar e acompanha o dedo se ele for longe.

      const mag = curvaJoy(Math.min(1, d / J.R));
