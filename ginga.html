<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>GINGA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#140c33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* GINGA — lobby laranja com raios de sol (estilo do Streetball), painéis azul-marinho e destaques amarelos.
   O lobby e as telas medem em px de um palco de referência (1600×640 deitado, 640×1600 em pé) que o JS escala para caber. */
:root{
  --laranja:#f26a1b; --laranja2:#ff9a2e; --laranja3:#c8410c;
  --navy:#141c3e; --navy2:#0d1432; --navy3:#22306a; --borda:#070b1e; --linha:rgba(255,255,255,.1);
  --amarelo:#ffd23f; --amarelo2:#ffb800; --verde:#4fd13a; --verde2:#2a9d1c; --vermelho:#e8473c; --azul:#2f6fe6;
  --t-azul:#3d7bff; --t-roxo:#8a4dff; --t-laranja:#ff8f1f; --t-amarelo:#ffc93c; --t-teal:#2fbfa3; --t-ouro:#f0b030;
  --txt:#ffffff; --sub:#b9c3e6; --sub2:#8590bd;
  --sol:#ffd23f; --sol2:#ff9f1c; --lima:#c6ff3d; --lima2:#7fd400; --coral:#ff5a7a; --coral2:#e0245e; --mar:#2ee0cf;
  --fonte:"Lilita One","Arial Black","Arial Rounded MT Bold",system-ui,sans-serif;
  --fonte2:Arial,"Helvetica Neue",Roboto,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{ height:100%; background:#0b0f26; }
*{ touch-action:manipulation; }   /* iPhone: sem zoom de dois toques em lugar nenhum (as listas com rolagem têm pan-y próprio) */
body{ margin:0; overflow:hidden; color:var(--txt); font-family:var(--fonte); font-weight:400; letter-spacing:.3px;
  touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
button{ font-family:inherit; font-weight:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-appearance:none; appearance:none; border:0; padding:0; margin:0; background:none; letter-spacing:inherit; }
button:focus-visible, input:focus-visible{ outline:4px solid var(--amarelo); outline-offset:3px; }
input{ font-family:inherit; }
#app{ position:fixed; top:0;right:0;bottom:0;left:0; overflow:hidden; background:#0b0f26; }
canvas{ display:block; }
#cv-jogo{ position:absolute; left:0; top:0; width:100%; height:100%; touch-action:none; }
.it{ font-style:italic; }

/* moeda e gema */
.ic-moeda, .ic-gema{ position:relative; display:inline-block; flex:none; width:1.1em; height:1.1em; border-radius:50%; vertical-align:-.18em; }
.ic-moeda{ background:radial-gradient(circle at 36% 30%, #fff6b8 0, #ffd23f 38%, #f0a800 72%, #c47c00 100%); box-shadow:inset 0 0 0 .07em #9a6300; }
.ic-moeda::after{ content:'G'; position:absolute; top:0;right:0;bottom:0;left:0; display:grid; place-items:center; font-size:.66em; font-style:normal; line-height:1; color:#7a4a00; }
.ic-gema{ background:radial-gradient(circle at 36% 30%, #f3d6ff 0, #b14dff 50%, #6a1fb8 100%); box-shadow:inset 0 0 0 .07em #4a138a; border-radius:30%; transform:rotate(45deg) scale(.86); }
.ic-gema::after{ content:''; position:absolute; left:22%; top:22%; width:26%; height:26%; background:rgba(255,255,255,.85); border-radius:2px; }

/* botão 3D (o degrau embaixo afunda quando aperta) */
.bt3d{ --c1:#5db4ff; --c2:#2a79e6; --c3:#123f95; --tc:#fff;
  display:inline-flex; align-items:center; justify-content:center; gap:10px; height:64px; padding:0 30px; border-radius:18px; font-size:28px; letter-spacing:.8px; color:var(--tc); white-space:nowrap; font-style:italic;
  background:linear-gradient(var(--c1), var(--c2)); border:3px solid var(--borda);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(0,0,0,.14), 0 6px 0 var(--borda), 0 10px 16px rgba(0,0,0,.35);
  text-shadow:0 2px 0 var(--c3); transition:transform .07s, box-shadow .07s, filter .15s; }
.bt3d svg{ width:28px; height:28px; flex:none; }
.bt3d:active:not([disabled]){ transform:translateY(5px); box-shadow:inset 0 3px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(0,0,0,.14), 0 1px 0 var(--borda), 0 3px 6px rgba(0,0,0,.35); }
.bt3d[disabled]{ cursor:default; filter:saturate(.25) brightness(.7); }
.bt3d.verde{ --c1:#8bec55; --c2:#35a21f; --c3:#1d6a10; }
.bt3d.amarelo{ --c1:#ffe766; --c2:#ffc21a; --c3:#9a5f00; --tc:#1a1200; text-shadow:0 2px 0 rgba(255,255,255,.45); }
.bt3d.vermelho{ --c1:#ff7a6b; --c2:#d8261a; --c3:#861010; }
.bt3d.roxo{ --c1:#b28cff; --c2:#7046e8; --c3:#3b2096; }
.bt3d.cinza{ --c1:#4d5d92; --c2:#34426f; --c3:#1b2447; }
.bt3d.teal{ --c1:#6ff0d6; --c2:#1fae93; --c3:#0b5e50; }
.bt3d.pq{ height:52px; padding:0 20px; font-size:22px; border-radius:15px; }
.bt3d.mini{ height:44px; padding:0 14px; font-size:19px; border-radius:13px; border-width:2px; box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 4px 0 var(--borda); }
.bt3d.mini:active:not([disabled]){ box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 1px 0 var(--borda); transform:translateY(3px); }

/* etiquetas */
.tag{ display:inline-flex; align-items:center; height:30px; padding:0 12px; border-radius:15px; font-size:17px; letter-spacing:.8px; font-style:italic; color:#1a1200; background:var(--amarelo); white-space:nowrap; }
.tag.verde{ background:var(--verde); color:#0b2a06; } .tag.vermelho{ background:var(--vermelho); color:#fff; } .tag.azul{ background:var(--azul); color:#fff; } .tag.cinza{ background:#3a4372; color:#d8def7; } .tag.roxo{ background:#7046e8; color:#fff; }

/* abertura */
#intro{ position:absolute; top:0;right:0;bottom:0;left:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vmin; background:#0a0620; cursor:pointer; }
#intro canvas{ position:absolute; top:0;right:0;bottom:0;left:0; width:100%; height:100%; }
#intro p, #intro small{ position:relative; z-index:1; }
#intro p{ position:absolute; bottom:calc(14vh + env(safe-area-inset-bottom)); margin:0; padding:.45em 1.2em; border-radius:999px; background:rgba(10,6,30,.72); color:#fff; font-size:clamp(14px, 3.4vmin, 24px); letter-spacing:3px; animation:piscaSuave 1.6s ease-in-out infinite; }
#intro small{ position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); font-size:clamp(10px, 2vmin, 13px); color:#8f86c4; letter-spacing:1px; }
#intro.sai{ animation:introSai .5s ease-in forwards; }
@keyframes introSai{ to{ opacity:0; transform:scale(1.06); } }
@keyframes piscaSuave{ 50%{ opacity:.35; } }

/* avisos */
#aviso{ position:absolute; left:50%; top:max(12px, env(safe-area-inset-top)); z-index:90; transform:translate(-50%, calc(-100% - 40px)); opacity:0; max-width:min(92vw, 640px);
  padding:10px 20px; border-radius:16px; background:rgba(10,14,40,.95); box-shadow:0 0 0 2px rgba(255,255,255,.14), 0 10px 24px rgba(0,0,0,.5);
  font-size:clamp(13px, 3.2vmin, 19px); text-align:center; transition:transform .25s cubic-bezier(.2,.9,.3,1.3), opacity .2s; pointer-events:none; }
#aviso.on{ transform:translate(-50%, 0); opacity:1; }
#aviso b{ font-weight:400; color:var(--amarelo); }

@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
}

/* =================================================================== LOBBY (estilo do streetball-modelado) */
#lobby{ position:absolute; top:0;right:0;bottom:0;left:0; z-index:10; overflow:hidden; background:var(--laranja); --cx:50%; --cy:56%; }
#lobby[hidden]{ display:none !important; }
#sa-probe{ position:absolute; left:0; top:0; width:0; height:0; visibility:hidden; pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
.lb-fundo{ position:absolute; top:0;right:0;bottom:0;left:0; overflow:hidden; pointer-events:none;
  background:radial-gradient(ellipse 70% 80% at var(--cx) var(--cy), #ffbe55 0%, #ff8e22 26%, #f2691b 52%, #d6480f 100%); }
/* os raios são um canvas de 512px (desenhado uma vez) ampliado e girado pela placa de vídeo */
.lb-raios{ position:absolute; left:var(--cx); top:var(--cy); width:187vmax; height:187vmax; margin:-93.5vmax 0 0 -93.5vmax; animation:gira 80s linear infinite; will-change:transform; }
.lb-raios.b2{ animation-duration:140s; animation-direction:reverse; }
@keyframes gira{ to{ transform:rotate(360deg); } }
.lb-pontos{ position:absolute; top:-30px;right:-30px;bottom:-30px;left:-30px; background-image:radial-gradient(rgba(110,26,0,.24) 2.3px, transparent 2.9px); background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse 60% 70% at var(--cx) var(--cy), transparent 20%, #000 75%); mask-image:radial-gradient(ellipse 60% 70% at var(--cx) var(--cy), transparent 20%, #000 75%);
  animation:pontos 12s linear infinite; }
@keyframes pontos{ to{ transform:translate(26px, 26px); } }
.lb-vinheta{ position:absolute; top:0;right:0;bottom:0;left:0; background:radial-gradient(ellipse 75% 75% at 50% 50%, transparent 55%, rgba(95,22,0,.42) 100%); }
.lb-bolha{ position:absolute; bottom:-60px; width:var(--s); height:var(--s); border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(255,240,200,.55), rgba(255,200,120,.12) 60%, transparent 70%);
  left:var(--x); animation:bolha var(--d) linear infinite; animation-delay:var(--dl); }
@keyframes bolha{ from{ transform:translateY(0) translateX(0); opacity:0; } 10%{ opacity:1; } 50%{ transform:translateY(-55vh) translateX(18px); } 90%{ opacity:.8; } to{ transform:translateY(-115vh) translateX(-10px); opacity:0; } }
#lobby.parado .lb-raios, #lobby.parado .lb-pontos, #lobby.parado .lb-bolha, #lobby.parado .lb-heroi-cv, #lobby.parado .lb-carimbo, #lobby.parado .brilhinho, #lobby.parado .lb-jogar .brilho, #lobby.parado .ponto{ animation:none !important; }
/* com uma tela aberta por cima, o fundo do lobby fica parado (não gasta o celular à toa) */
#lobby.coberto .lb-fundo *, #lobby.coberto .lb-grade *, #lobby.coberto .lb-heroi::after{ animation-play-state:paused !important; }
#lobby.parado .lb-bolha{ display:none; }

.palco{ position:absolute; left:0; top:0; transform-origin:0 0; }
.palco *{ box-sizing:border-box; }
.palco h2, .palco h3, .palco p{ margin:0; font-weight:400; }

/* a grade do lobby (deitado) */
.lb-grade{ position:absolute; top:0;right:0;bottom:0;left:0; padding:18px 24px 16px; display:grid; grid-template-columns:400px minmax(0,1fr) 450px; grid-template-rows:96px minmax(0,1fr) 74px;
  gap:12px 28px; grid-template-areas:"eu centro cart" "esq centro dir" "base base base"; }
.lb-esq, .lb-dir{ display:flex; flex-direction:column; justify-content:center; gap:13px; min-height:0; }
.lb-esq{ grid-area:esq; } .lb-dir{ grid-area:dir; }
.lb-base{ grid-area:base; display:grid; grid-template-columns:400px minmax(0,1fr) minmax(0,1fr) 450px; gap:28px; }

/* cartão do jogador */
.lb-eu{ grid-area:eu; align-self:start; display:flex; align-items:center; gap:16px; height:92px; padding:0 22px 0 12px; border-radius:22px; text-align:left;
  background:linear-gradient(#1c2652, #111938); border:4px solid var(--borda); box-shadow:inset 0 3px 0 rgba(255,255,255,.1), 0 6px 0 var(--borda), 0 10px 18px rgba(80,20,0,.35); transition:transform .07s; }
.lb-eu:active{ transform:translateY(4px); }
.lb-eu canvas{ flex:none; width:70px; height:70px; }
.lb-eu .tx{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.lb-eu small{ font:bold 17px var(--fonte2); letter-spacing:3px; color:var(--amarelo); }
.lb-eu b{ font-weight:400; font-size:36px; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lb-eu .nv{ display:flex; align-items:center; gap:8px; font:bold 13px var(--fonte2); color:var(--sub); letter-spacing:1px; }
.lb-eu .nv i{ flex:1; max-width:150px; height:7px; border-radius:4px; background:rgba(255,255,255,.12); overflow:hidden; }
.lb-eu .nv i u{ display:block; height:100%; width:0; background:linear-gradient(90deg, var(--amarelo), #ff8f1f); transition:width .7s; }
.lb-eu > svg{ flex:none; width:34px; height:34px; color:var(--amarelo); }

/* moedas, gemas e ícones */
.lb-cart{ grid-area:cart; align-self:start; justify-self:end; display:flex; align-items:center; gap:10px; height:92px; }
.pilula{ display:flex; align-items:center; gap:10px; height:58px; padding:0 18px; border-radius:16px; font-size:24px; font-style:italic; letter-spacing:.5px; white-space:nowrap;
  background:linear-gradient(#1c2652, #111938); border:4px solid var(--borda); box-shadow:inset 0 2px 0 rgba(255,255,255,.1), 0 5px 0 var(--borda); color:var(--amarelo); }
.pilula.gemas{ color:#d6a6ff; }
.pilula b{ font-weight:400; color:#fff; min-width:40px; text-align:right; font-variant-numeric:tabular-nums; }
.pilula .ic-moeda, .pilula .ic-gema{ font-size:26px; }
.pilula.pula{ animation:pula .5s cubic-bezier(.2,.9,.3,1.6); }
@keyframes pula{ 40%{ transform:scale(1.15); } }
.icq{ position:relative; width:64px; height:64px; border-radius:16px; display:grid; place-items:center; color:#fff;
  background:linear-gradient(#3a2a3a, #24182a); border:4px solid var(--borda); box-shadow:inset 0 2px 0 rgba(255,255,255,.12), 0 5px 0 var(--borda); transition:transform .07s; }
.icq svg{ width:34px; height:34px; }
.icq:active{ transform:translateY(4px); box-shadow:inset 0 2px 0 rgba(255,255,255,.12), 0 1px 0 var(--borda); }
.icq.off svg{ opacity:.45; }
.ponto{ position:absolute; right:-7px; top:-7px; min-width:24px; height:24px; padding:0 6px; border-radius:12px; display:grid; place-items:center; font:bold 14px var(--fonte2); color:#fff; background:#ff2d55; box-shadow:0 0 0 3px var(--borda); animation:pontoPula 1.4s ease-in-out infinite; }
.ponto[hidden]{ display:none; }
@keyframes pontoPula{ 0%, 70%, 100%{ transform:translateY(0); } 80%{ transform:translateY(-6px); } 90%{ transform:translateY(0); } }

/* botões do menu: ícone colorido + nome + seta */
.mb{ position:relative; display:flex; align-items:stretch; height:70px; padding:4px; border-radius:18px; text-align:left;
  background:linear-gradient(#1c2652, #111938); border:4px solid var(--borda); box-shadow:inset 0 2px 0 rgba(255,255,255,.1), 0 6px 0 var(--borda), 0 10px 16px rgba(80,20,0,.3);
  transition:transform .07s, box-shadow .07s, filter .15s; }
.mb:active{ transform:translateY(5px); box-shadow:inset 0 2px 0 rgba(255,255,255,.1), 0 1px 0 var(--borda), 0 3px 6px rgba(80,20,0,.3); }
.mb .tl{ flex:none; width:68px; border-radius:12px; display:grid; place-items:center; background:var(--tc, var(--t-azul)); box-shadow:inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.18); color:#fff; }
.mb .tl svg{ width:38px; height:38px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.25)); animation:icone 5s ease-in-out infinite; animation-delay:calc(var(--d, 0s) * 9); }
@keyframes icone{ 0%, 86%, 100%{ transform:none; } 89%{ transform:rotate(-12deg) scale(1.12); } 93%{ transform:rotate(9deg) scale(1.08); } 96%{ transform:rotate(-4deg); } }
#lobby.parado .mb .tl svg{ animation:none; }
.mb .tl.esc{ color:#20160a; }
.mb .tx{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:3px; padding:0 8px 0 18px; }
.mb .tx b{ font-weight:400; font-style:italic; font-size:29px; line-height:1; letter-spacing:.6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 2px 0 rgba(0,0,0,.35); }
.mb .tx small{ font:bold 15px var(--fonte2); letter-spacing:.3px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase; }
.mb .seta{ flex:none; width:34px; display:grid; place-items:center; color:#fff; opacity:.9; }
.mb .seta svg{ width:22px; height:22px; }
.mb .ponto{ right:-8px; top:-8px; }
.mb.alto{ height:78px; }

/* JOGAR */
.lb-jogar-w{ position:relative; margin-top:4px; }
/* o brilho que pulsa com a música: só muda a opacidade (a placa de vídeo faz sozinha, sem redesenhar) */
.lb-pulso{ position:absolute; top:0;right:0;bottom:0;left:0; border-radius:22px; box-shadow:0 0 46px 12px rgba(255,230,100,.62); opacity:.3; will-change:opacity; pointer-events:none; }
.lb-jogar{ position:relative; width:100%; height:116px; border-radius:22px; display:flex; align-items:center; justify-content:center; gap:22px; color:#151a33; font-style:italic; font-size:70px; letter-spacing:2px;
  background:linear-gradient(#fff07a 0%, #ffd84a 45%, #ffbf1a 100%); border:5px solid var(--borda);
  box-shadow:inset 0 5px 0 rgba(255,255,255,.75), inset 0 -7px 0 rgba(180,110,0,.35), 0 8px 0 var(--borda), 0 14px 22px rgba(80,20,0,.4);
  overflow:hidden; transition:transform .07s; }
.lb-jogar svg{ width:56px; height:56px; }
.lb-jogar .brilho{ position:absolute; top:-50%; left:-30%; width:18%; height:200%; background:linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent); transform:rotate(18deg); animation:varre 3.6s ease-in-out infinite; pointer-events:none; will-change:transform; }
.lb-jogar:active{ transform:translateY(6px) scale(.99); box-shadow:inset 0 5px 0 rgba(255,255,255,.75), inset 0 -7px 0 rgba(180,110,0,.35), 0 2px 0 var(--borda), 0 5px 10px rgba(80,20,0,.4); }
.lb-jogar small{ position:absolute; bottom:10px; left:0; right:0; text-align:center; font:bold 15px var(--fonte2); letter-spacing:1px; color:rgba(30,26,10,.7); font-style:normal; }
@keyframes varre{ 0%, 55%{ transform:translateX(0) rotate(18deg); } 85%, 100%{ transform:translateX(860%) rotate(18deg); } }

/* o meio: carimbo GINGA, "Pronto, fulano!" e o seu botão girando devagar */
.lb-centro{ grid-area:centro; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:0; min-width:0; }
.lb-carimbo{ position:relative; font-style:italic; font-size:78px; line-height:1; letter-spacing:7px; color:#ffd59a; --o:#5e1d00; transform:rotate(-7deg); white-space:nowrap;
  text-shadow:-4px -4px 0 var(--o), 4px -4px 0 var(--o), -4px 4px 0 var(--o), 4px 4px 0 var(--o), 0 -4px 0 var(--o), 0 4px 0 var(--o), -4px 0 0 var(--o), 4px 0 0 var(--o), 0 9px 0 var(--o), 0 14px 16px rgba(80,20,0,.4);
  animation:carimbo 3s ease-in-out infinite; }
.lb-carimbo .lb-bat{ display:inline-block; will-change:transform; }
.lb-carimbo .lb-bat span{ display:inline-block; }
.lb-carimbo .lb-bat span:nth-child(even){ color:#fff3d6; }
@keyframes carimbo{ 50%{ transform:rotate(-5deg) scale(1.03); } }
.lb-pronto{ margin-top:16px; padding:6px 22px; border-radius:999px; font-style:italic; font-size:26px; color:rgba(255,255,255,.9); background:rgba(120,30,0,.22); box-shadow:inset 0 0 0 2px rgba(255,255,255,.14); white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.lb-heroi{ position:relative; margin-top:6px; flex:1 1 0; min-height:150px; max-height:300px; aspect-ratio:1; display:grid; place-items:center; }
.lb-heroi-cv{ position:relative; width:100%; height:100%; animation:flutua 3.4s ease-in-out infinite; cursor:pointer; }
.lb-heroi::after{ content:''; position:absolute; left:16%; right:16%; bottom:-2%; height:12%; border-radius:50%; background:radial-gradient(closest-side, rgba(70,15,0,.55), rgba(70,15,0,0)); z-index:-1; animation:sombra 3.4s ease-in-out infinite; }
@keyframes flutua{ 50%{ transform:translateY(-4%); } }
@keyframes sombra{ 50%{ transform:scale(.85); opacity:.7; } }
.lb-heroi-cv.pulo{ animation:pulo .9s cubic-bezier(.2,.8,.3,1); }
@keyframes pulo{ 0%{ transform:translateY(0) rotate(0); } 35%{ transform:translateY(-24%) rotate(200deg) scale(1.06); } 70%{ transform:translateY(2%) rotate(360deg) scale(.96); } 100%{ transform:translateY(0) rotate(360deg); } }
.brilhinho{ position:absolute; width:26px; height:26px; background:#fff8dc; clip-path:polygon(50% 0, 59% 41%, 100% 50%, 59% 59%, 50% 100%, 41% 59%, 0 50%, 41% 41%); animation:pisca 2.6s ease-in-out infinite; pointer-events:none; }
@keyframes pisca{ 0%, 100%{ opacity:.15; transform:scale(.5) rotate(0); } 50%{ opacity:1; transform:scale(1) rotate(45deg); } }

/* em pé */
.retrato .lb-grade{ padding:20px 22px 20px; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:96px 70px minmax(0,1fr) 124px repeat(6, 78px);
  gap:14px 16px; grid-template-areas:"eu eu" "cart cart" "centro centro" "jogar jogar" "salas ranking" "skins treino" "desafios loja" "passe clube" "comun chat" "ranq amigos"; }
.retrato .lb-esq, .retrato .lb-dir, .retrato .lb-base{ display:contents; }
.retrato .lb-cart{ justify-self:stretch; height:70px; justify-content:space-between; }
.retrato .lb-cart .pilula{ flex:1; justify-content:center; }
.retrato .mb{ height:78px; }
.retrato .mb .tx b{ font-size:26px; }
.retrato .mb .tx small{ font-size:13px; }
.retrato .lb-jogar-w{ grid-area:jogar; margin:0; }
.retrato .lb-jogar{ height:100%; }
.retrato .mb[data-a="clube"]{ grid-area:clube; } .retrato .mb[data-a="skins"]{ grid-area:skins; } .retrato .mb[data-a="treino"]{ grid-area:treino; } .retrato .mb[data-a="loja"]{ grid-area:loja; }
.retrato .mb[data-a="comun"]{ grid-area:comun; } .retrato .mb[data-a="passe"]{ grid-area:passe; } .retrato .mb[data-a="ranq"]{ grid-area:ranq; } .retrato .mb[data-a="salas"]{ grid-area:salas; }
.retrato .mb[data-a="desafios"]{ grid-area:desafios; } .retrato .mb[data-a="chat"]{ grid-area:chat; } .retrato .mb[data-a="amigos"]{ grid-area:amigos; } .retrato .mb[data-a="ranking"]{ grid-area:ranking; }
.retrato .lb-cart .pilula{ font-size:20px; padding:0 12px; gap:6px; }
.retrato .lb-cart .icq{ width:58px; height:58px; }
.retrato .lb-carimbo{ font-size:84px; }
.retrato .lb-heroi{ max-height:330px; }

/* entrada em cascata */
.entra{ animation:entra .5s cubic-bezier(.2,.9,.25,1.25) both; animation-delay:var(--d, 0s); }
@keyframes entra{ from{ opacity:0; transform:translateY(26px) scale(.94); } }
.entra-e{ animation:entraE .5s cubic-bezier(.2,.9,.25,1.25) both; animation-delay:var(--d, 0s); }
@keyframes entraE{ from{ opacity:0; transform:translateX(-50px); } }
.entra-d{ animation:entraD .5s cubic-bezier(.2,.9,.25,1.25) both; animation-delay:var(--d, 0s); }
@keyframes entraD{ from{ opacity:0; transform:translateX(50px); } }

/* EM BREVE (a ranqueada): apagadinho e com cadeado */
.mb.breve{ filter:saturate(.35); opacity:.86; }
.mb.breve .tx b{ color:#d5d9ea; }
.mb.breve .tl svg{ animation:none; }
.tag-breve{ flex:none; align-self:center; display:grid; place-items:center; width:38px; height:38px; margin-right:4px; border-radius:12px; color:#2a1c00; background:var(--amarelo); }
.tag-breve svg{ width:20px; height:20px; }
.mb.breve .tx small{ color:var(--amarelo); }

/* =================================================================== TELAS (painéis azul-marinho por cima do lobby) */
.folha{ position:absolute; top:0;right:0;bottom:0;left:0; z-index:5; display:flex; align-items:center; justify-content:center; padding:16px 20px; background:rgba(40,10,0,.42); animation:fundoEntra .2s; }
.folha[hidden]{ display:none; }
@keyframes fundoEntra{ from{ opacity:0; } }
.caixa{ position:relative; width:100%; height:100%; max-width:1580px; display:flex; flex-direction:column; border-radius:28px; overflow:hidden;
  background:linear-gradient(#18224a, #0e1534); border:5px solid var(--borda); box-shadow:inset 0 3px 0 rgba(255,255,255,.08), 0 10px 0 var(--borda), 0 22px 44px rgba(40,10,0,.5);
  animation:caixaEntra .26s cubic-bezier(.2,1.2,.4,1); }
@keyframes caixaEntra{ from{ opacity:0; transform:translateY(30px) scale(.97); } }
.cx-cab{ flex:none; display:flex; align-items:center; gap:16px; height:98px; padding:0 22px; background:linear-gradient(#24326e, #19244e); border-bottom:4px solid var(--borda); }
.cx-cab h2{ font-style:italic; font-size:46px; letter-spacing:1.5px; white-space:nowrap; text-shadow:0 3px 0 rgba(0,0,0,.4); }
.cx-cab .esp{ flex:1; }
.cx-cab .pilula{ height:54px; font-size:22px; }
.voltar{ flex:none; width:62px; height:62px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(#0e1534, #070b1e); box-shadow:inset 0 0 0 3px rgba(255,255,255,.12), 0 4px 0 rgba(0,0,0,.5); }
.voltar svg{ width:32px; height:32px; }
.voltar:active{ transform:translateY(3px); }
.cx-corpo{ flex:1 1 0; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; touch-action:pan-y; -webkit-overflow-scrolling:touch; padding:22px 26px 30px; scrollbar-width:thin; }
.sub-t{ display:flex; align-items:baseline; gap:14px; margin:4px 0 14px; font-style:italic; font-size:28px; color:var(--amarelo); letter-spacing:1px; }
.sub-t small{ font:bold 15px var(--fonte2); font-style:normal; color:var(--sub); letter-spacing:.3px; }
.sub-t ~ .sub-t{ margin-top:28px; }
.nota{ margin-top:18px; font:15px/1.45 var(--fonte2); color:var(--sub); }
.nota b{ color:#fff; }
.vazio{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:50px 20px; text-align:center; border-radius:22px; background:rgba(0,0,0,.18); box-shadow:inset 0 0 0 3px rgba(255,255,255,.06); }
.vazio b{ font-weight:400; font-style:italic; font-size:34px; color:var(--amarelo); }
.vazio span{ max-width:760px; font:16px/1.45 var(--fonte2); color:var(--sub); }
.vazio svg{ width:80px; height:80px; color:var(--sub2); }

/* chips de escolha */
.chips{ display:grid; gap:12px; }
.chips.c2{ grid-template-columns:repeat(2, minmax(0,1fr)); } .chips.c3{ grid-template-columns:repeat(3, minmax(0,1fr)); } .chips.c4{ grid-template-columns:repeat(4, minmax(0,1fr)); } .chips.c5{ grid-template-columns:repeat(5, minmax(0,1fr)); }
.chip{ min-height:84px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:8px; border-radius:18px; font-style:italic; font-size:30px; text-align:center;
  background:linear-gradient(#202c5e, #151e44); border:3px solid var(--borda); box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 4px 0 var(--borda); transition:transform .07s; }
.chip small{ font:bold 14px var(--fonte2); font-style:normal; color:var(--sub); letter-spacing:.3px; line-height:1.2; }
.chip.on{ background:linear-gradient(#ffe766, #ffc21a); color:#1a1200; }
.chip.on small{ color:#5a4300; }
.chip:active{ transform:translateY(3px); box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 1px 0 var(--borda); }
.chip[disabled]{ opacity:.35; }

/* ---------- SKINS ---------- */
.sk-corpo{ flex:1 1 0; min-height:0; display:grid; grid-template-columns:470px minmax(0,1fr); }
.sk-prev{ min-height:0; overflow-y:auto; display:grid; grid-template-columns:190px minmax(0,1fr); grid-template-areas:"cv meio" "rot rot" "cores cores"; align-items:center; align-content:start; gap:12px 16px; padding:18px 20px 22px; touch-action:pan-y;
  background:linear-gradient(var(--pc1, #3a2a7a), var(--pc2, #1d1648)); border-right:4px solid var(--borda); }
.sk-prev canvas{ grid-area:cv; width:190px; height:190px; animation:skGira 6s ease-in-out infinite; }
@keyframes skGira{ 50%{ transform:translateY(-6px) rotate(-6deg); } }
.sk-prev canvas.skpop{ animation:skPop .3s cubic-bezier(.2,1.6,.5,1); }
@keyframes skPop{ from{ transform:scale(.8); } }
.sk-meio{ grid-area:meio; min-width:0; display:flex; flex-direction:column; align-items:center; gap:8px; }
.sk-nome{ max-width:100%; font-style:italic; font-size:38px; letter-spacing:1px; text-align:center; text-shadow:0 3px 0 rgba(0,0,0,.35); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sk-rot{ font:bold 15px var(--fonte2); letter-spacing:3px; color:var(--pcl, #cdbfff); text-align:center; }
.sk-prev > .sk-rot{ grid-area:rot; margin-top:4px; }
.sk-txt{ width:170px; height:76px; border:0; border-radius:20px; outline:none; text-align:center; font:bold 46px var(--fonte2); color:#fff; background:rgba(0,0,0,.35); box-shadow:inset 0 0 0 3px rgba(255,255,255,.14); -webkit-user-select:text; user-select:text; }
.sk-txt:focus{ box-shadow:inset 0 0 0 4px var(--amarelo); }
.sk-txt::placeholder{ color:rgba(255,255,255,.25); }
.sk-dica{ font:14px var(--fonte2); color:var(--pcl, #cdbfff); text-align:center; }
.sk-cores{ grid-area:cores; display:grid; grid-template-columns:repeat(7, 48px); gap:9px; justify-content:center; }
.sk-cor{ width:48px; height:48px; border-radius:50%; background:var(--c); box-shadow:inset 0 0 0 3px rgba(0,0,0,.35), 0 0 0 3px rgba(255,255,255,.2); transition:transform .07s; }
.sk-cor.time{ grid-column:span 2; width:auto; border-radius:24px; font-style:italic; font-size:21px; letter-spacing:1px; color:#fff; background:linear-gradient(90deg, var(--vermelho) 50%, var(--azul) 50%); text-shadow:0 2px 0 rgba(0,0,0,.4); }
.sk-cor.on{ box-shadow:inset 0 0 0 3px rgba(0,0,0,.35), 0 0 0 5px var(--amarelo); transform:scale(1.06); }
.sk-cor:active{ transform:scale(.92); }
.sk-grade{ min-height:0; overflow-y:auto; padding:18px; display:grid; grid-template-columns:repeat(auto-fill, minmax(176px, 1fr)); gap:14px; align-content:start; touch-action:pan-y; }
.sk-item{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; height:196px; border-radius:20px;
  background:linear-gradient(#1f2a5a, #141c42); border:4px solid var(--borda); box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 5px 0 var(--borda); transition:transform .07s; }
.sk-item canvas{ width:116px; height:116px; }
.sk-item b{ font-weight:400; font-style:italic; font-size:27px; letter-spacing:.5px; text-shadow:0 2px 0 rgba(0,0,0,.4); }
.sk-item.on{ background:linear-gradient(var(--pc1, #6a3fd0), var(--pc2, #3c2490)); border-color:var(--amarelo); box-shadow:0 0 0 3px var(--amarelo), 0 5px 0 var(--borda); }
.sk-item:active{ transform:translateY(3px); }

/* ---------- TREINO ---------- */
.tr-grade{ display:grid; grid-template-columns:repeat(auto-fill, minmax(460px, 1fr)); gap:18px; }
.tr-card{ display:grid; grid-template-columns:120px minmax(0,1fr); grid-template-rows:auto auto 1fr; gap:6px 20px; padding:18px; min-height:180px; border-radius:22px; text-align:left;
  background:linear-gradient(#1f2a5a, #141c42); border:4px solid var(--borda); box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 6px 0 var(--borda); transition:transform .07s; }
.tr-card:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--borda); }
.tr-ic{ grid-row:1 / 4; width:120px; height:120px; border-radius:22px; display:grid; place-items:center; background:var(--c); box-shadow:inset 0 4px 0 rgba(255,255,255,.3), inset 0 -6px 0 rgba(0,0,0,.2); }
.tr-ic svg{ width:76px; height:76px; }
.tr-card b{ font-weight:400; font-style:italic; font-size:34px; }
.tr-card span{ font:16px/1.4 var(--fonte2); color:var(--sub); }
.tr-card em{ align-self:end; font-style:italic; font-size:22px; color:var(--amarelo); }

/* ---------- LOJA ---------- */
.abas{ display:flex; gap:10px; flex-wrap:wrap; }
.abas button{ height:58px; padding:0 24px; border-radius:16px; font-style:italic; font-size:24px; letter-spacing:.5px; color:var(--sub);
  background:linear-gradient(#202c5e, #151e44); border:3px solid var(--borda); box-shadow:0 4px 0 var(--borda); }
.abas button.on{ color:#1a1200; background:linear-gradient(#ffe766, #ffc21a); }
.lj-grade{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; margin-top:18px; }
.lj-item{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 12px 14px; border-radius:22px;
  background:linear-gradient(#1f2a5a, #141c42); border:4px solid var(--borda); box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 5px 0 var(--borda); }
.lj-item canvas{ width:120px; height:120px; }
.lj-item b{ font-weight:400; font-style:italic; font-size:27px; }
.lj-item .bt3d{ width:100%; }
.lj-item.uso{ border-color:var(--amarelo); box-shadow:0 0 0 3px var(--amarelo), 0 5px 0 var(--borda); }

/* ---------- PASSE ---------- */
.ps-hero{ display:flex; align-items:center; gap:28px; padding:24px 28px; border-radius:24px; background:linear-gradient(120deg, #3a2a7a, #1d2a6a 55%, #14306a); border:4px solid var(--borda); box-shadow:0 6px 0 var(--borda); }
.ps-hero .coroa{ flex:none; width:130px; height:130px; border-radius:28px; display:grid; place-items:center; background:linear-gradient(#ffe766, #f0b030); box-shadow:inset 0 4px 0 rgba(255,255,255,.5), 0 5px 0 #8a5a00; }
.ps-hero .coroa svg{ width:84px; height:84px; color:#3a2600; }
.ps-hero b{ display:block; font-weight:400; font-style:italic; font-size:44px; }
.ps-hero span{ display:block; margin-top:6px; font:17px/1.45 var(--fonte2); color:var(--sub); }
.ps-trilha{ display:flex; gap:14px; margin-top:22px; overflow-x:auto; padding-bottom:8px; touch-action:pan-x; }
.ps-nv{ flex:none; width:150px; height:170px; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:rgba(0,0,0,.25); border:3px dashed rgba(255,255,255,.18); color:var(--sub2); font-style:italic; font-size:22px; }
.ps-nv svg{ width:46px; height:46px; opacity:.6; }

/* ---------- RANQUEADA ---------- */
.rq-topo{ display:flex; flex-wrap:wrap; align-items:center; gap:26px; padding:22px 26px; border-radius:24px; background:linear-gradient(120deg, #2a1f5a, #18224a); border:4px solid var(--borda); box-shadow:0 6px 0 var(--borda); }
.rq-ins{ flex:none; width:150px; height:150px; filter:drop-shadow(0 6px 8px rgba(0,0,0,.5)); }
.rq-info{ flex:1 1 320px; min-width:0; display:flex; flex-direction:column; gap:8px; }
.rq-info b{ font-weight:400; font-style:italic; font-size:52px; line-height:1; color:var(--ec, #fff); text-shadow:0 4px 0 rgba(0,0,0,.4); }
.rq-info span{ font:bold 17px var(--fonte2); color:var(--sub); letter-spacing:.5px; }
.rq-barra{ display:block; width:100%; max-width:560px; height:18px; border-radius:9px; background:rgba(0,0,0,.4); overflow:hidden; box-shadow:inset 0 0 0 2px rgba(0,0,0,.3); }
.rq-barra i{ display:block; height:100%; width:0; border-radius:9px; background:linear-gradient(90deg, var(--amarelo), #ff5ab4); transition:width .6s; }
.rq-nums{ flex:none; display:grid; grid-template-columns:repeat(3, auto); gap:6px 26px; text-align:center; }
.rq-nums b{ font-weight:400; font-size:40px; } .rq-nums small{ font:bold 13px var(--fonte2); letter-spacing:1px; color:var(--sub); }
.rq-elos{ display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:10px; margin-top:16px; }
.rq-elo{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px; border-radius:16px; background:rgba(0,0,0,.2); font-style:italic; font-size:18px; color:var(--sub2); }
.rq-elo svg{ width:54px; height:54px; }
.rq-elo.on{ background:rgba(255,210,63,.14); color:#fff; box-shadow:inset 0 0 0 3px var(--amarelo); }
.rq-acao{ display:flex; justify-content:center; margin-top:22px; }
.rq-acao .bt3d{ height:96px; min-width:520px; font-size:46px; }

/* ---------- DESAFIOS ---------- */
.ds-lista{ display:flex; flex-direction:column; gap:14px; }
.ds-item{ display:grid; grid-template-columns:76px minmax(0,1fr) auto; align-items:center; gap:18px; padding:14px 18px; border-radius:20px; background:linear-gradient(#1f2a5a, #141c42); border:4px solid var(--borda); box-shadow:0 5px 0 var(--borda); }
.ds-ic{ width:76px; height:76px; border-radius:18px; display:grid; place-items:center; background:var(--t-amarelo); color:#2a1d00; box-shadow:inset 0 3px 0 rgba(255,255,255,.4); }
.ds-ic svg{ width:46px; height:46px; }
.ds-tx{ min-width:0; display:flex; flex-direction:column; gap:8px; }
.ds-tx b{ font-weight:400; font-style:italic; font-size:28px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ds-barra{ display:flex; align-items:center; gap:12px; font:bold 15px var(--fonte2); color:var(--sub); }
.ds-barra i{ flex:1; height:14px; border-radius:7px; background:rgba(0,0,0,.35); overflow:hidden; }
.ds-barra i u{ display:block; height:100%; background:linear-gradient(90deg, var(--t-teal), var(--lima)); border-radius:7px; }
.ds-item.pronto{ border-color:var(--amarelo); box-shadow:0 0 0 3px var(--amarelo), 0 5px 0 var(--borda); }

/* ---------- CLUBE ---------- */
.cl-corpo{ display:grid; grid-template-columns:300px minmax(0,1fr); gap:30px; align-items:start; }
.cl-prev{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:20px; border-radius:24px; background:rgba(0,0,0,.2); }
.cl-prev canvas{ width:220px; height:220px; }
.cl-prev b{ font-weight:400; font-style:italic; font-size:32px; text-align:center; }
.cl-campo{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
.cl-campo label{ font-style:italic; font-size:22px; color:var(--amarelo); }
.in-txt{ width:100%; height:66px; padding:0 18px; border:0; border-radius:16px; outline:none; font-family:var(--fonte); font-size:30px; color:#fff; background:rgba(0,0,0,.35); box-shadow:inset 0 0 0 3px rgba(255,255,255,.14); -webkit-user-select:text; user-select:text; }
.in-txt:focus{ box-shadow:inset 0 0 0 4px var(--amarelo); }
.cl-cores{ display:flex; flex-wrap:wrap; gap:10px; }
.cl-cores .sk-cor{ width:52px; height:52px; }

/* ---------- COMUNIDADE ---------- */
.cm-lista{ display:flex; flex-direction:column; gap:14px; }
.cm-item{ padding:18px 22px; border-radius:20px; background:linear-gradient(#1f2a5a, #141c42); border:4px solid var(--borda); }
.cm-item b{ display:block; font-weight:400; font-style:italic; font-size:28px; color:var(--amarelo); }
.cm-item p{ margin:8px 0 0; font:16px/1.5 var(--fonte2); color:var(--sub); }
.cm-item em{ font:bold 13px var(--fonte2); font-style:normal; letter-spacing:1px; color:var(--sub2); }

/* ---------- CHAT ---------- */
.ch-corpo{ flex:1 1 0; min-height:0; display:flex; flex-direction:column; padding:16px 22px 18px; gap:12px; }
.ch-msgs{ flex:1 1 0; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:12px; border-radius:18px; background:rgba(0,0,0,.25); touch-action:pan-y; font:17px/1.4 var(--fonte2); }
.ch-msg b{ font-weight:bold; color:var(--amarelo); margin-right:6px; }
.ch-msg.sis{ color:var(--sub2); font-style:italic; }
.ch-msg.t0 b{ color:#ff8a7e; } .ch-msg.t1 b{ color:#8fb4ff; }
.ch-envio{ flex:none; display:flex; gap:10px; }
.ch-envio .in-txt{ height:62px; font-family:var(--fonte2); font-size:20px; }

/* ---------- AJUSTES ---------- */
.aj-abas{ margin-bottom:20px; }
.aj-sec[hidden]{ display:none; }
.gf-grade{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; }
.gf-card{ position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:18px; border-radius:22px; text-align:left; min-height:230px;
  background:linear-gradient(#1f2a5a, #141c42); border:4px solid var(--borda); box-shadow:0 5px 0 var(--borda); transition:transform .08s; }
.gf-card b{ font-weight:400; font-style:italic; font-size:40px; letter-spacing:2px; color:var(--c); }
.gf-card span{ font:15px/1.4 var(--fonte2); color:var(--sub); }
.gf-card .pontos{ display:flex; gap:6px; margin-top:auto; }
.gf-card .pontos i{ width:30px; height:12px; border-radius:6px; background:rgba(255,255,255,.14); }
.gf-card .pontos i.on{ background:var(--c); box-shadow:0 0 10px var(--c); }
.gf-card.on{ border-color:var(--c); box-shadow:0 0 0 3px var(--c), 0 5px 0 var(--borda); }
.gf-card.on::after{ content:'EM USO'; position:absolute; top:14px; right:14px; padding:3px 10px; border-radius:8px; font-size:15px; background:var(--c); color:#14092e; font-style:italic; }
.gf-card:active{ transform:scale(.97); }
.lin{ display:grid; grid-template-columns:minmax(0, 1fr) 360px 70px; align-items:center; gap:18px; min-height:80px; padding:6px 0; border-bottom:2px solid rgba(255,255,255,.06); font-size:26px; font-style:italic; }
.lin span small{ display:block; font:15px var(--fonte2); font-style:normal; color:var(--sub); margin-top:4px; }
.lin output{ text-align:right; color:var(--amarelo); font-variant-numeric:tabular-nums; }
.lin input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:44px; background:transparent; cursor:pointer; touch-action:none; margin:0; }
.lin input[type=range]::-webkit-slider-runnable-track{ height:14px; border-radius:7px; background:linear-gradient(90deg, var(--amarelo) var(--p, 50%), rgba(255,255,255,.18) var(--p, 50%)); }
.lin input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:40px; height:40px; margin-top:-13px; border-radius:50%; background:#fff; border:6px solid var(--amarelo2); box-shadow:0 3px 6px rgba(0,0,0,.5); }
.lin input[type=range]::-moz-range-track{ height:14px; border-radius:7px; background:rgba(255,255,255,.18); }
.lin input[type=range]::-moz-range-progress{ height:14px; border-radius:7px; background:var(--amarelo); }
.lin input[type=range]::-moz-range-thumb{ width:28px; height:28px; border-radius:50%; background:#fff; border:6px solid var(--amarelo2); }
.lin.sw{ grid-template-columns:minmax(0,1fr) auto; }
.sw-b{ position:relative; width:110px; height:58px; border-radius:29px; background:rgba(255,255,255,.14); box-shadow:inset 0 0 0 2px rgba(255,255,255,.15); transition:background .2s; }
.sw-b::after{ content:''; position:absolute; left:6px; top:6px; width:46px; height:46px; border-radius:50%; background:#fff; box-shadow:0 3px 6px rgba(0,0,0,.4); transition:transform .2s cubic-bezier(.3,1.4,.5,1); }
.sw-b[aria-checked="true"]{ background:var(--verde2); }
.sw-b[aria-checked="true"]::after{ transform:translateX(52px); }
.seg{ display:flex; border-radius:16px; overflow:hidden; border:3px solid var(--borda); }
.seg button{ height:58px; padding:0 20px; font-style:italic; font-size:22px; color:var(--sub); background:#1a2350; white-space:nowrap; }
.seg button + button{ border-left:2px solid var(--borda); }
.seg button.on{ background:var(--amarelo); color:#1a1200; }
.aj-acao{ display:flex; flex-wrap:wrap; gap:16px; align-items:center; padding:18px 0; border-bottom:2px solid rgba(255,255,255,.06); }
.aj-acao span{ flex:1 1 300px; font:16px/1.4 var(--fonte2); color:var(--sub); }

/* ---------- PERFIL ---------- */
.pf-topo{ display:flex; flex-wrap:wrap; align-items:center; gap:26px; padding:22px 26px; border-radius:24px; margin-bottom:24px; background:linear-gradient(120deg, #2a1f5a, #18224a); border:4px solid var(--borda); box-shadow:0 6px 0 var(--borda); }
.pf-topo canvas{ width:170px; height:170px; flex:none; }
.pf-info{ flex:1 1 320px; min-width:0; display:flex; flex-direction:column; gap:12px; }
.pf-nome{ display:flex; align-items:center; gap:14px; }
.pf-nome > span, .pf-nome > input{ flex:1 1 auto; min-width:0; height:74px; display:flex; align-items:center; padding:0 18px; font-size:40px; border-radius:16px; background:rgba(0,0,0,.3); box-shadow:inset 0 0 0 3px rgba(255,255,255,.12); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pf-nome input{ border:0; outline:0; color:#fff; font-family:var(--fonte); background:rgba(255,255,255,.14); -webkit-user-select:text; user-select:text; }
.pf-lapis{ flex:none; width:70px; height:70px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(#3b6fe0, #1c3f9a); border:3px solid var(--borda); }
.pf-lapis svg{ width:34px; height:34px; }
.pf-nv{ display:flex; align-items:baseline; gap:14px; font-style:italic; font-size:30px; color:var(--amarelo); }
.pf-nv span{ font:bold 16px var(--fonte2); font-style:normal; color:var(--sub); }
.barra-xp{ display:block; width:100%; max-width:520px; height:16px; border-radius:8px; background:rgba(0,0,0,.4); overflow:hidden; }
.barra-xp i{ display:block; height:100%; width:0; border-radius:8px; background:linear-gradient(90deg, var(--amarelo), #ff8f1f); transition:width .8s; }
.pf-stats{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; }
.pf-st{ display:flex; flex-direction:column; gap:4px; padding:16px 20px; border-radius:20px; background:linear-gradient(#1f2a5a, #141c42); border:4px solid var(--borda); }
.pf-st small{ font:bold 14px var(--fonte2); letter-spacing:1.5px; color:var(--sub); }
.pf-st b{ font-weight:400; font-size:46px; font-variant-numeric:tabular-nums; }
.pf-st.d b{ color:var(--amarelo); }
.pf-zerar{ display:flex; flex-wrap:wrap; align-items:center; gap:18px; margin-top:28px; font:16px var(--fonte2); color:var(--sub); }

/* ---------- janelinhas ---------- */
.pop{ position:absolute; top:0;right:0;bottom:0;left:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(10,4,20,.6); animation:fundoEntra .2s; }
.pop[hidden]{ display:none; }
.pop-caixa{ position:relative; width:860px; max-width:100%; max-height:100%; overflow:auto; padding:34px 40px 34px; border-radius:30px; text-align:center;
  background:linear-gradient(#24326e, #141c42); border:5px solid var(--borda); box-shadow:0 10px 0 var(--borda), 0 24px 50px rgba(0,0,0,.6); animation:caixaEntra .3s cubic-bezier(.2,1.3,.4,1); }
.pop-caixa h2{ margin:14px 0 10px; font-style:italic; font-size:54px; line-height:1.05; color:var(--amarelo); text-wrap:balance; }

.pop-caixa .in-txt{ height:84px; font-size:40px; text-align:center; color:#141c42; background:#f4f6ff; box-shadow:inset 0 4px 0 rgba(0,0,0,.08); }

.pop-erro{ display:block; min-height:22px; margin-top:8px; font:16px var(--fonte2); color:#ff9a8a; }
.pop .chips{ margin:10px 0; text-align:left; }
.pop .sub-t{ justify-content:flex-start; }

/* em pé */
.retrato .folha{ padding:12px; }
.retrato .cx-cab{ height:92px; padding:0 16px; gap:12px; }
.retrato .cx-cab h2{ font-size:38px; }

.retrato .sk-cor{ width:52px; height:52px; }

.retrato .sk-item{ height:170px; }
.retrato .tr-grade{ grid-template-columns:minmax(0,1fr); }
.retrato .gf-grade{ grid-template-columns:repeat(2, minmax(0,1fr)); }

.retrato .pf-stats{ grid-template-columns:repeat(2, minmax(0,1fr)); }

.retrato .rq-acao .bt3d{ min-width:0; width:100%; }
.retrato .cl-corpo{ grid-template-columns:minmax(0,1fr); }
.retrato .chips.c4{ grid-template-columns:repeat(2, minmax(0,1fr)); }
.retrato .chips.c5{ grid-template-columns:repeat(3, minmax(0,1fr)); }

.pop-caixa.larga{ width:1240px; padding:26px 34px 28px; }
.pop-caixa.larga h2{ margin:8px 0 4px; font-size:48px; }
.jr-grade{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 28px; text-align:left; }
.jr-grade .sub-t{ margin:10px 0 8px; font-size:24px; }

.retrato .jr-grade{ grid-template-columns:minmax(0,1fr); }

/* =================================================================== SALAS (lista, criar e dentro da sala) */
.sl-barra{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:14px; }
.sl-busca{ flex:1 1 260px; min-width:200px; position:relative; }

.sl-busca svg{ position:absolute; left:16px; top:50%; width:26px; height:26px; transform:translateY(-50%); color:var(--sub2); pointer-events:none; }
.sl-seg{ display:flex; border-radius:16px; overflow:hidden; border:3px solid var(--borda); }

.sl-con{ display:inline-flex; align-items:center; gap:10px; height:46px; padding:0 16px; border-radius:23px; font:bold 15px var(--fonte2); letter-spacing:.5px; background:rgba(0,0,0,.3); color:var(--sub); white-space:nowrap; }

.sl-con.vai i{ background:var(--amarelo); animation:piscaSuave .8s infinite; }

.sl-cab{ display:grid; grid-template-columns:minmax(0,1fr) 110px 130px 110px 160px 170px 170px; gap:12px; padding:0 18px 8px; font:bold 14px var(--fonte2); letter-spacing:1.2px; color:var(--sub2); }
.sl-lista{ display:flex; flex-direction:column; gap:10px; }
.sl-linha{ display:grid; grid-template-columns:minmax(0,1fr) 110px 130px 110px 160px 170px 170px; gap:12px; align-items:center; min-height:88px; padding:8px 12px 8px 18px; border-radius:20px; text-align:left;
  background:linear-gradient(#1f2a5a, #141c42); border:4px solid var(--borda); box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 5px 0 var(--borda); }

.sl-nome{ min-width:0; display:flex; flex-direction:column; gap:3px; }
.sl-nome b{ display:flex; align-items:center; gap:8px; font-weight:400; font-style:italic; font-size:28px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sl-nome b svg{ flex:none; width:24px; height:24px; color:var(--amarelo); }
.sl-nome small{ font:bold 14px var(--fonte2); color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sl-c{ font-style:italic; font-size:22px; text-align:center; white-space:nowrap; }
.sl-c small{ display:block; font:bold 12px var(--fonte2); font-style:normal; color:var(--sub2); letter-spacing:.5px; }
.sl-st{ justify-self:center; }
.sl-linha .bt3d{ height:58px; font-size:23px; padding:0 18px; }
.sl-vazio{ margin-top:10px; }

/* ---------- criar sala ---------- */
.cs-grade{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px 28px; text-align:left; }
.cs-campo{ display:flex; flex-direction:column; gap:10px; }
.cs-campo > label, .cs-campo > span{ font-style:italic; font-size:22px; color:var(--amarelo); }
.cs-campo .in-txt{ height:64px; font-size:28px; text-align:left; color:#fff; background:rgba(0,0,0,.35); box-shadow:inset 0 0 0 3px rgba(255,255,255,.14); }

.cs-full{ grid-column:1 / -1; }

/* ---------- dentro da sala ---------- */
.sa-cab{ flex-wrap:nowrap; }
.sa-tit{ min-width:0; display:flex; flex-direction:column; gap:4px; }
.sa-tit h2{ overflow:hidden; text-overflow:ellipsis; max-width:620px; font-size:40px !important; }
.sa-chips{ display:flex; flex-wrap:wrap; gap:6px; }
.sa-chips .tag{ height:26px; font-size:15px; padding:0 10px; }
.sa-abas{ display:flex; gap:8px; }
.sa-abas button{ height:52px; padding:0 18px; border-radius:14px; font-style:italic; font-size:21px; color:var(--sub); background:#1a2350; border:3px solid var(--borda); white-space:nowrap; }

.sa-corpo{ flex:1 1 0; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,.78fr) minmax(0,1fr); grid-template-rows:minmax(0,1fr) 210px; gap:14px 16px; padding:16px 20px 18px;
  grid-template-areas:"ta te tb" "chat chat acao"; }
.sa-time{ grid-area:ta; min-height:0; display:flex; flex-direction:column; border-radius:20px; overflow:hidden; background:rgba(0,0,0,.22); border:4px solid var(--borda); }
.sa-time.b{ grid-area:tb; } .sa-time.e{ grid-area:te; }
.sa-time header{ flex:none; display:flex; align-items:center; gap:10px; height:54px; padding:0 14px; font-style:italic; font-size:24px; letter-spacing:1px; background:var(--tc, #3a4372); text-shadow:0 2px 0 rgba(0,0,0,.4); box-shadow:inset 0 -4px 0 rgba(0,0,0,.18); }
.sa-time header b{ flex:1; font-weight:400; }
.sa-time header small{ font:bold 15px var(--fonte2); opacity:.95; }
.sa-mems{ flex:1 1 0; min-height:0; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; touch-action:pan-y; }
.sa-mem{ display:flex; align-items:center; gap:10px; min-height:56px; padding:4px 10px 4px 6px; border-radius:14px; text-align:left; background:rgba(255,255,255,.05); }
.sa-mem canvas{ flex:none; width:46px; height:46px; }
.sa-mem b{ flex:1; min-width:0; font-weight:400; font-size:23px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sa-mem .tag{ height:24px; font-size:13px; padding:0 8px; }

.sa-pe{ flex:none; display:flex; flex-wrap:wrap; gap:8px; padding:8px; border-top:2px solid rgba(255,255,255,.06); }

.sa-vaz{ padding:14px; font:15px var(--fonte2); color:var(--sub2); text-align:center; }

.sa-chat .ch-envio .bt3d{ height:54px; }
.sa-acao{ grid-area:acao; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:14px; border-radius:20px; background:rgba(0,0,0,.22); border:4px solid var(--borda); }
.sa-status{ font:bold 16px/1.35 var(--fonte2); color:var(--sub); text-align:center; }
.sa-status b{ color:var(--amarelo); }
.sa-acao .bt3d{ width:100%; height:70px; font-size:30px; }
.sa-aj{ flex:1 1 0; min-height:0; overflow-y:auto; padding:20px 26px; touch-action:pan-y; }
.sa-aj .cs-grade{ max-width:1200px; }
.sa-est{ flex:1 1 0; min-height:0; overflow-y:auto; padding:20px 26px; touch-action:pan-y; }
.menu-mem{ position:absolute; z-index:50; min-width:300px; padding:10px; border-radius:20px; background:linear-gradient(#24326e, #141c42); border:4px solid var(--borda); box-shadow:0 8px 0 var(--borda), 0 18px 30px rgba(0,0,0,.5); display:flex; flex-direction:column; gap:8px; animation:caixaEntra .2s; }
.menu-mem h3{ padding:6px 8px 4px; font-style:italic; font-size:24px; color:var(--amarelo); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.menu-mem .bt3d{ width:100%; justify-content:flex-start; height:54px; font-size:21px; }

.retrato .sl-cab{ display:none; }
.retrato .sl-linha{ grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"nome acao" "info acao"; gap:6px 12px; }
.retrato .sl-linha .sl-nome{ grid-area:nome; }
.retrato .sl-linha .sl-info{ grid-area:info; display:flex; flex-wrap:wrap; gap:6px 14px; }

.sl-info{ display:contents; }
.retrato .sl-c{ font-size:18px; text-align:left; }

.retrato .cs-grade{ grid-template-columns:minmax(0,1fr); }
.retrato .sa-corpo{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:minmax(220px,1fr) 150px minmax(200px,.9fr) auto; grid-template-areas:"ta tb" "te te" "chat chat" "acao acao"; overflow-y:auto; }
.retrato .sa-cab{ flex-wrap:wrap; height:auto; padding:12px 16px; }
.retrato .sa-tit h2{ max-width:440px; }

.sl-nota{ flex:1 1 300px; font:15px/1.4 var(--fonte2); color:var(--sub); }

.sl-nome b span{ min-width:0; overflow:hidden; text-overflow:ellipsis; }
.sl-linha{ cursor:pointer; }
.sl-acao .bt3d svg{ width:24px; height:24px; }
.cs-pe{ flex:none; display:flex; justify-content:flex-end; gap:16px; padding:14px 22px; background:rgba(0,0,0,.18); border-top:4px solid var(--borda); }

.cs-linha small{ letter-spacing:0; }
.sa-pe[hidden]{ display:none; }

.sa-aj .pop-acoes{ margin-top:22px; }

.lg-olho{ position:absolute; right:6px; top:50%; transform:translateY(-50%); width:52px; height:48px; border-radius:12px; display:grid; place-items:center; color:var(--sub2); }
