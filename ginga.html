const Editor = {
  aberto: false, origem: null, sel: 'chute', alvos: {}, arr: null,
  abre(origem){
    this.origem = origem; this.aberto = true; this.sel = this.sel || 'chute';
    const ed = $('#editor'); ed.hidden = false; ed.classList.toggle('fundo', origem !== 'jogo');
    if (origem !== 'jogo'){ $('#cv-jogo').style.visibility = 'hidden'; }
    Entrada.zera();
    this.monta();
    this.resize = () => { if (this.aberto) this.monta(); };
    addEventListener('resize', this.resize);
  },
  monta(){
    const ed = $('#editor'), L = HUD.layout(), ori = HUD.ori();
    ed.innerHTML = `<div class="ed-campo" aria-hidden="true"></div><div id="ed-painel" role="dialog" aria-label="Editar botões">
      <div class="ed-cab"><b id="ed-nome"></b><button type="button" class="bt3d cinza" id="ed-padrao">PADRÃO</button><button type="button" class="bt3d verde" id="ed-ok">${IC.ok}PRONTO</button></div>
      <div class="ed-lin"><span>TAMANHO</span><input type="range" id="ed-tam" min="60" max="180" step="5" aria-label="Tamanho do botão escolhido"><output id="ed-tam-o"></output></div>
      <div class="ed-lin"><span>TRANSPARÊNCIA</span><input type="range" id="ed-op" min="30" max="100" step="5" aria-label="Transparência dos botões"><output id="ed-op-o"></output></div>
      <div class="ed-dica">Arraste cada botão para onde quiser. Vale só para o celular ${ori === 'retrato' ? 'em pé' : 'deitado'}.</div></div>`;
    this.alvos = {};
    for (const id of HUD_IDS){
      const c = L[id], a = el('div', 'ed-alvo' + (id === 'pausa' ? ' quad' : ''));
      a.dataset.id = id; a.setAttribute('role', 'button'); a.setAttribute('aria-label', HUD_NOMES[id]); a.tabIndex = 0;
      const orig = id === 'joy' ? HUD.el.joy : id === 'passe' ? HUD.el.passe : id === 'chute' ? HUD.el.chute : HUD.el.pausa;
      const cp = orig.cloneNode(true); cp.removeAttribute('id'); cp.querySelectorAll('[id]').forEach(x => x.removeAttribute('id')); cp.classList.add('copia'); cp.classList.remove('on', 'ativo', 'cheio'); cp.setAttribute('aria-hidden', 'true'); cp.tabIndex = -1;
      a.append(cp); a.append(el('b', null, HUD_NOMES[id]));
      ed.append(a); this.alvos[id] = a;
      this.poe(id, c.x, c.y, c.tam);
      a.addEventListener('pointerdown', e => this.pega(e, id));
      a.addEventListener('keydown', e => this.teclas(e, id));
    }
    $('#ed-ok', ed).addEventListener('click', () => this.fecha());
    $('#ed-padrao', ed).addEventListener('click', () => { S.hud[HUD.ori()] = {}; salvar(); Som.ui('desliga'); this.monta(); });
    const tam = $('#ed-tam', ed), op = $('#ed-op', ed);
    const pinta = i => i.style.setProperty('--p', ((i.value - i.min) / (i.max - i.min) * 100) + '%');
    tam.addEventListener('input', () => { const u = this.muda(this.sel); u.s = tam.value / 100; $('#ed-tam-o').textContent = tam.value + '%'; pinta(tam); const c = HUD.layout()[this.sel]; this.poe(this.sel, c.x, c.y, c.tam); });
    tam.addEventListener('change', () => salvar());
    op.value = S.cfg.opac; $('#ed-op-o').textContent = op.value + '%'; pinta(op);
    op.addEventListener('input', () => { S.cfg.opac = +op.value; $('#ed-op-o').textContent = op.value + '%'; pinta(op); ed.style.setProperty('--op', String(op.value / 100)); });
    op.addEventListener('change', () => { salvar(); HUD.cfg(); });
    ed.style.setProperty('--op', String(clamp(S.cfg.opac / 100, .3, 1)));
    this.escolhe(this.sel);
  },
  muda(id){ const ori = HUD.ori(); S.hud[ori] = S.hud[ori] || {}; return S.hud[ori][id] = S.hud[ori][id] || {}; },
  poe(id, x, y, tam){
    const a = this.alvos[id]; if (!a) return;
    a.style.left = x + 'px'; a.style.top = y + 'px'; a.style.width = a.style.height = tam + 'px';
    a.style.setProperty('--bs', tam + 'px'); a.style.setProperty('--js', tam + 'px');
  },
  escolhe(id){
    this.sel = id;
    for (const k of HUD_IDS) this.alvos[k].classList.toggle('sel', k === id);
    $('#ed-nome').textContent = HUD_NOMES[id];
    const u = (S.hud[HUD.ori()] || {})[id], v = Math.round((u && u.s ? u.s : 1) * 100);
    const tam = $('#ed-tam'); tam.value = v; $('#ed-tam-o').textContent = v + '%'; tam.style.setProperty('--p', ((v - 60) / 120 * 100) + '%');
    this.painelLonge();
  },
  // o painel vai para onde não tampa nenhum botão (em cima, no meio ou embaixo)
  painelLonge(){
    const p = $('#ed-painel'); if (!p) return;
    const L = HUD.layout(), H = innerHeight, ph = p.offsetHeight, pw = p.offsetWidth, px = (innerWidth - pw) / 2, m = margensTela();
    const tops = [m.t + 10, (H - ph) / 2, H - m.b - 10 - ph];
    const sobra = y => { let a = 0; for (const id of HUD_IDS){ const c = L[id], r = c.tam / 2 + 10; const ox = Math.max(0, Math.min(px + pw, c.x + r) - Math.max(px, c.x - r)), oy = Math.max(0, Math.min(y + ph, c.y + r) - Math.max(y, c.y - r)); a += ox * oy * (id === this.sel ? 3 : 1); } return a; };
    let melhor = tops[0], ma = Infinity;
    for (const y of tops){ const a = sobra(y); if (a < ma - 1){ ma = a; melhor = y; } }
    p.style.top = Math.round(melhor) + 'px'; p.style.bottom = 'auto'; p.classList.remove('baixo');
  },
  pega(e, id){
    e.preventDefault(); e.stopPropagation();
    this.escolhe(id); Som.ui('toque');
    const a = this.alvos[id], r = a.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    this.arr = { id, pid: e.pointerId, dx: e.clientX - cx, dy: e.clientY - cy, tam: r.width };
    try { a.setPointerCapture(e.pointerId); } catch (_) {}
    a.classList.add('arrasta'); $('#ed-painel').classList.add('some');
    const move = ev => {
      if (!this.arr || ev.pointerId !== this.arr.pid) return;
      const W = innerWidth, H = innerHeight, t = this.arr.tam;
      const x = clamp(ev.clientX - this.arr.dx, t / 2 + 2, W - t / 2 - 2), y = clamp(ev.clientY - this.arr.dy, t / 2 + 2, H - t / 2 - 2);
      a.style.left = x + 'px'; a.style.top = y + 'px'; this.arr.x = x; this.arr.y = y;
    };
    const solta = ev => {
      if (!this.arr || ev.pointerId !== this.arr.pid) return;
      if (this.arr.x != null){ const u = this.muda(id); u.x = this.arr.x / innerWidth; u.y = this.arr.y / innerHeight; salvar(); }
      this.arr = null; a.classList.remove('arrasta'); $('#ed-painel').classList.remove('some'); this.painelLonge();
      a.removeEventListener('pointermove', move); a.removeEventListener('pointerup', solta); a.removeEventListener('pointercancel', solta);
    };
    a.addEventListener('pointermove', move); a.addEventListener('pointerup', solta); a.addEventListener('pointercancel', solta);
  },
  teclas(e, id){
    const passo = e.shiftKey ? 20 : 6, d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!d) return; e.preventDefault(); this.escolhe(id);
    const c = HUD.layout()[id], u = this.muda(id);
    const x = clamp(c.x + d[0] * passo, c.tam / 2, innerWidth - c.tam / 2), y = clamp(c.y + d[1] * passo, c.tam / 2, innerHeight - c.tam / 2);
    u.x = x / innerWidth; u.y = y / innerHeight; salvar(); this.poe(id, x, y, c.tam);
  },
  fecha(){
    if (!this.aberto) return;
    this.aberto = false; salvar(); Som.ui('liga');
    removeEventListener('resize', this.resize);
    const ed = $('#editor'); ed.hidden = true; ed.innerHTML = ''; ed.classList.remove('fundo');
    HUD.cfg();
    if (this.origem === 'jogo' && Jogo.p){ $('#cv-jogo').style.visibility = 'visible'; Jogo.reabrePausa(); }
    else { $('#cv-jogo').style.visibility = App.estado === 'jogo' ? 'visible' : 'hidden'; Telas.abaAj = 'controles'; Telas.abre('ajustes'); aviso('Botões salvos'); }
  }
};

// ======================================================================= LOGO
function desenhaLogo(g, x, y, tam, t, batida, neon = true, anim = null){
  const txt = 'GINGA';
  g.save(); g.translate(x, y);
  g.font = `${tam}px "Lilita One", "Arial Black", sans-serif`; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  const larg = [...txt].map(c => g.measureText(c).width), esp = tam * .02, total = larg.reduce((a, b) => a + b, 0) + esp * (txt.length - 1);
  // onda do calçadão por baixo
  const oy = tam * .2;
  g.save(); g.lineCap = 'round';
  const prog = anim ? anim.onda : 1;
  const onda = (cor, lw, dy) => { if (prog <= 0) return; g.strokeStyle = cor; g.lineWidth = lw; g.beginPath(); const n = Math.max(1, Math.round(40 * prog)); for (let i = 0; i <= n; i++){ const u = i / 40, xx = -total * .56 + u * total * 1.12; g.lineTo(xx, oy + dy + Math.sin(u * TAU * 1.5 + t * 2.4) * tam * .06); } g.stroke(); };
  onda('#120a30', tam * .2, tam * .02); onda('#2ee0cf', tam * .1, 0); onda('rgba(255,255,255,.6)', tam * .03, -tam * .02);
  g.restore();
  g.transform(1, 0, -.16, 1, 0, 0);
  let cx = -total / 2;
  [...txt].forEach((ch, i) => {
    const pulo = batida ? Math.max(0, Math.sin((batida.f + i * .12) * Math.PI)) * (batida.n % 4 === i % 4 ? 1 : .35) : (Math.sin(t * 3 + i * .7) * .5 + .5) * .35;
    const L = anim ? anim.letras[i] : null;
    const dy = -pulo * tam * .07 + (L ? L.dy * tam : 0), rot = (i % 2 ? .05 : -.05) + Math.sin(t * 1.6 + i) * .02 + (L ? L.rot : 0), w = larg[i];
    if (L && L.a <= 0){ cx += w + esp; return; }
    g.save(); g.translate(cx + w / 2, dy); g.rotate(rot); if (L){ g.globalAlpha = L.a; g.scale(L.s, L.s); }
    g.lineJoin = 'round';
    g.fillStyle = '#120a30'; g.fillText(ch, -w / 2, tam * .09);
    g.strokeStyle = '#120a30'; g.lineWidth = tam * .17; g.strokeText(ch, -w / 2, 0);
    const gr = g.createLinearGradient(0, -tam * .75, 0, tam * .05);
    gr.addColorStop(0, '#fff7c2'); gr.addColorStop(.35, '#ffd23f'); gr.addColorStop(.7, '#ff9f1c'); gr.addColorStop(1, '#ff5a7a');
    if (neon){ g.shadowColor = 'rgba(255,140,60,.75)'; g.shadowBlur = tam * .25; }
    g.fillStyle = gr; g.fillText(ch, -w / 2, 0);
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(255,255,255,.55)'; g.save(); g.beginPath(); g.rect(-w, -tam * .78, w * 2, tam * .28); g.clip(); g.fillText(ch, -w / 2, 0); g.restore();
    g.restore();
    cx += w + esp;
  });
  g.globalAlpha = 1;
  if (anim && anim.onda < 1){ g.restore(); return; }
  // brilho em estrela
  const sx = total / 2 + tam * .06, sy = -tam * .68, sp = .6 + .4 * Math.sin(t * 4);
  g.fillStyle = '#fff'; g.save(); g.translate(sx, sy); g.rotate(t); estrela(g, 0, 0, tam * .13 * sp, tam * .03, 4); g.fill(); g.restore();
  g.restore();
}

// os raios de sol do fundo: desenhados uma vez num canvas pequeno e girados pela placa de vídeo
// (antes eram um gradiente gigante que o celular redesenhava o tempo todo)
function desenhaRaios(cv, n, largura, cor, alfa, fase){
  const T = 512, c = T / 2; cv.width = cv.height = T;
  const g = cv.getContext('2d'); g.clearRect(0, 0, T, T); g.fillStyle = cor;
  const passo = TAU / n, w = largura * Math.PI / 180;
  for (let i = 0; i < n; i++){ const a = (fase - 90) * Math.PI / 180 + i * passo; g.beginPath(); g.moveTo(c, c); g.arc(c, c, c, a, a + w); g.closePath(); g.fill(); }
  g.globalCompositeOperation = 'destination-in';
  const rg = g.createRadialGradient(c, c, 0, c, c, c);
  rg.addColorStop(0, `rgba(0,0,0,${alfa})`); rg.addColorStop(.33, `rgba(0,0,0,${alfa * .6})`); rg.addColorStop(.69, `rgba(0,0,0,${alfa * .15})`); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, T, T); g.globalCompositeOperation = 'source-over';
}

function desenhaEscudo(g, x, y, R, cor, cor2, sigla){
  g.save(); g.translate(x, y);
  const forma = () => { g.beginPath(); g.moveTo(0, -R); g.lineTo(R * .86, -R * .7); g.lineTo(R * .86, R * .05); g.quadraticCurveTo(R * .8, R * .7, 0, R); g.quadraticCurveTo(-R * .8, R * .7, -R * .86, R * .05); g.lineTo(-R * .86, -R * .7); g.closePath(); };
  forma(); g.fillStyle = SK_PRETO; g.fill();
  g.scale(.9, .9); forma(); g.fillStyle = cor; g.fill();
  g.save(); forma(); g.clip(); g.fillStyle = cor2; g.fillRect(-R, -R * .12, R * 2, R * .3); g.restore();
  g.font = `${R * .62}px "Lilita One", "Arial Black", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = R * .12; g.strokeStyle = SK_PRETO; g.strokeText(sigla || 'G', 0, R * .02); g.fillStyle = '#fff'; g.fillText(sigla || 'G', 0, R * .02);
  g.restore();
}
function desenhaEloIns(g, x, y, R, e){
  g.save(); g.translate(x, y);
  const pts = []; for (let i = 0; i < 6; i++){ const a = -Math.PI / 2 + i * TAU / 6; pts.push([Math.cos(a) * R, Math.sin(a) * R]); }
  g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fillStyle = SK_PRETO; g.fill();
  g.scale(.86, .86); g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
  const gr = g.createLinearGradient(0, -R, 0, R); gr.addColorStop(0, corMix(e.cor, '#ffffff', .45)); gr.addColorStop(1, corMix(e.cor, '#000000', .3)); g.fillStyle = gr; g.fill();
  g.fillStyle = 'rgba(255,255,255,.9)'; estrela(g, 0, -R * .05, R * .5, R * .22); g.fill();
  g.font = `${R * .32}px "Lilita One", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = SK_PRETO;
  g.fillText(['I', 'II', 'III', 'IV', 'V', 'VI'][e.i] || '', 0, R * .62);
  g.restore();
}

  ljMonta(c){
    c.querySelectorAll('[data-aba]').forEach(b => b.classList.toggle('on', b.dataset.aba === this.abaLoja));
    const bolas = this.abaLoja === 'bolas', itens = bolas ? BOLAS : RASTROS, meus = bolas ? S.loja.bolas : S.loja.rastros, uso = bolas ? S.loja.bola : S.loja.rastro;
    const g = $('#lj-grade', c);
    g.innerHTML = itens.map(it => {
      const tem = meus.includes(it.id) || it.preco === 0, emUso = uso === it.id;
      const bt = emUso ? `<button type="button" class="bt3d mini cinza" disabled>EM USO</button>` : tem ? `<button type="button" class="bt3d mini verde" data-usar="${it.id}">USAR</button>`
        : `<button type="button" class="bt3d mini amarelo" data-comprar="${it.id}"><i class="${it.gema ? 'ic-gema' : 'ic-moeda'}"></i>${fmt(it.preco)}</button>`;
      return `<div class="lj-item${emUso ? ' uso' : ''}"><canvas width="240" height="240" data-prev="${it.id}"></canvas><b>${it.nome}</b>${bt}</div>`;
    }).join('');

    g.querySelectorAll('[data-comprar]').forEach(b => b.addEventListener('click', () => {
      const it = itens.find(x => x.id === b.dataset.comprar), saldo = it.gema ? S.gemas : S.moedas;

      meus.push(it.id); if (bolas) S.loja.bola = it.id; else S.loja.rastro = it.id; salvar();
      Som.ui('compra'); aviso(`<b>${esc(it.nome)}</b> é seu!`); this.carteira(); this.ljMonta(c);
    }));
    this.ljBolas = $$('canvas[data-prev]', g).map(cv => ({ cv, id: cv.dataset.prev, e: Bola3D.nova(), bolas }));

  anima(dt){
    this.t += dt;

      for (const it of this.ljBolas){
        const g = it.cv.getContext('2d'); g.clearRect(0, 0, 240, 240);
        if (it.bolas){ Bola3D.rola(it.e, 160, 70, dt, 70); g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(120, 205, 70, 14, 0, 0, TAU); g.fill(); Bola3D.desenha(g, it.e, 120, 116, 78, 0, false, BOLA[it.id].est); }
        else {

          for (let i = 0; i < n; i++){ const f = i / n, x = 30 + f * 150, y = 140 - Math.sin(f * 3 + this.t * 3) * 30 * f; g.fillStyle = `rgba(${r.cores[i % r.cores.length]},${f * .8})`; g.beginPath(); g.arc(x, y, 6 + f * 18, 0, TAU); g.fill(); }

      }
    }
  },

/* ---- 83-conta.js ---- */
// ======================================================================= CONTA: nome de usuário + senha, com ID (quem cria primeiro é o #1)
// Com servidor: a conta fica no servidor (o ID é do servidor e o progresso vai junto para qualquer aparelho).
// Sem servidor: a conta fica neste aparelho (IDs deste aparelho, começando no #1), com a senha guardada como hash.
const CONTAS_LOCAIS = 'ginga-contas', ULTIMO_USUARIO = 'ginga-ultimo-usuario';
const ITER_SENHA = 60000;
const b64 = u8 => { let s = ''; for (const x of u8) s += String.fromCharCode(x); return btoa(s); };
const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const espera = ms => new Promise(r => setTimeout(r, ms));

async function derivaSenha(senha, sal, iter){

  async criaLocal(usuario, senha, lembrar){

    const sal = salAleatorio(), hash = await derivaSenha(senha, sal, ITER_SENHA);

// Só salas personalizadas: cada um cria a sua. Sem servidor, a sala fica neste aparelho e você monta os times com bots;
// com servidor, as salas são online para todo mundo.
const stZero = () => ({ j: 0, v: 0, g: 0, a: 0, m: 0 });
const NUMS_BOT = ['7', '9', '10', '11', '8', '5', '3', '4', '2', '6'];
const SalaLocal = {
  seq: 0,
  eu(time){ return { id: 'eu', cid: Conta.atual ? Conta.atual.id : null, vf: !!(Conta.atual && Conta.atual.vf), nome: S.nome || 'Você', visual: visualLimpo(S.visual), time, bot: null, st: stZero() }; },
  bot(s, time, dif){
    const usados = new Set(s.membros.filter(m => m.time === time).map(m => m.visual.texto));
    const num = NUMS_BOT.find(n => !usados.has(n)) || String(rint(12, 99));
    return { id: 'b' + Date.now().toString(36) + (++this.seq), nome: nomeDeBot(s), visual: { desenho: 'padrao', texto: num, cor: 'time' }, time, bot: clamp(dif | 0, 0, 3), st: stZero() };
  },
  base(id, nome, tipo, cfg){ return { id, local: true, nome, tipo, tranca: false, senha: '', dono: 'eu', cfg: cfgSala(cfg), regiao: 'local', status: 'espera', membros: [], placar: [0, 0], hist: [] }; },
  // times cheios de bots, com uma vaga no VERMELHO para você
  enche(s, dif){
    for (const t of [0, 1]) while (vagasTime(s, t) > 0) s.membros.push(this.bot(s, t, dif));
  },
  nova(nome, cfg){
    const s = this.base('L' + Date.now().toString(36), nome, 'pers', cfg);
    s.membros.push(this.eu(0)); this.enche(s, S.modo.dif);
    return s;
  },
  carrega(d){
    const s = this.base(d.id, d.nome, 'pers', d.cfg);
    s.membros = (d.membros || []).map(m => ({ id: m.id, nome: m.id === 'eu' ? (S.nome || 'Você') : limpaTexto(m.nome, 16) || 'Bot', visual: visualLimpo(m.visual), time: [0, 1, 2].includes(m.time) ? m.time : ESPECTADOR, bot: m.id === 'eu' ? null : clamp(m.bot | 0, 0, 3), st: Object.assign(stZero(), m.st || {}) }));
    if (!s.membros.some(m => m.id === 'eu')) s.membros.unshift(this.eu(timeQueEntra(s)));
    s.hist = Array.isArray(d.hist) ? d.hist.slice(0, 10) : [];
    return s;
  },
  acha(id){ const d = S.salasLocais.find(x => x.id === id); return d ? this.carrega(d) : null; },
  atualizaEu(s){ const e = s.membros.find(m => m.id === 'eu'); if (e){ e.nome = S.nome || 'Você'; e.visual = visualLimpo(S.visual); e.cid = Conta.atual ? Conta.atual.id : null; e.vf = !!(Conta.atual && Conta.atual.vf); } },
  salva(s){
    if (!s || !s.local || s.tipo !== 'pers') return;
    const d = { id: s.id, nome: s.nome, cfg: s.cfg, membros: s.membros.map(m => ({ id: m.id, nome: m.nome, visual: m.visual, time: m.time, bot: m.bot, st: m.st })), hist: s.hist };
    const i = S.salasLocais.findIndex(x => x.id === s.id);
    if (i >= 0) S.salasLocais[i] = d; else S.salasLocais.unshift(d);
    S.salasLocais = S.salasLocais.slice(0, 10); salvar();
  },
  apaga(id){ S.salasLocais = S.salasLocais.filter(x => x.id !== id); salvar(); },
  // os mesmos comandos do servidor; devolve o texto do erro ou nada
  cmd(s, c, d){
    const alvo = d.alvo != null ? s.membros.find(m => m.id === d.alvo) : null;
    if (c === 'time'){
      const t = +d.time; if (!alvo || ![0, 1, 2].includes(t)) return 'Jogador não encontrado';
      if (alvo.time === t) return null;
      if (t !== ESPECTADOR && vagasTime(s, t) <= 0) return `O ${NOMES_TIME[t]} está cheio`;
      alvo.time = t; Salas.sis(`${alvo.nome} foi para ${t === ESPECTADOR ? 'os espectadores' : 'o ' + NOMES_TIME[t]}`); return null;
    }
    if (c === 'bot'){
      const t = +d.time; if (![0, 1].includes(t)) return 'Time inválido';
      if (vagasTime(s, t) <= 0) return `O ${NOMES_TIME[t]} está cheio`;
      const b = this.bot(s, t, d.dif); s.membros.push(b); Salas.sis(`${b.nome} (bot ${DIF_NOME[b.bot]}) entrou no ${NOMES_TIME[t]}`); return null;
    }
    if (c === 'expulsar'){
      if (!alvo || alvo.id === 'eu') return 'Não dá para tirar esse';
      s.membros = s.membros.filter(m => m !== alvo); Salas.sis(`${alvo.nome} saiu da sala`); return null;
    }
    if (c === 'botDif'){ if (!alvo || alvo.bot == null) return 'Não é bot'; alvo.bot = clamp(d.dif | 0, 0, 3); return null; }
    if (c === 'enche'){ this.enche(s, d.dif == null ? S.modo.dif : d.dif); return null; }
    if (c === 'esvazia'){ s.membros = s.membros.filter(m => m.bot == null); return null; }
    if (c === 'comecar'){
      if (!s.membros.some(m => m.time === 0) || !s.membros.some(m => m.time === 1)) return 'Precisa de pelo menos um jogador em cada time';
      App.salaPartida(s); return null;
    }
    return 'Comando desconhecido';
  },
  ajustes(s, nome, cfg){
    s.nome = nome; s.cfg = cfgSala(cfg);
    // diminuiu o modo: quem sobrou vai para a arquibancada (bots saem)
    for (const t of [0, 1]){
      let extra = -vagasTime(s, t);
      for (let i = s.membros.length - 1; i >= 0 && extra > 0; i--){ const m = s.membros[i]; if (m.time !== t) continue; if (m.bot != null) s.membros.splice(i, 1); else m.time = ESPECTADOR; extra--; }
    }
  }
};

      const sub = r.tipo === 'oficial' ? 'SALA OFICIAL' : r.regiao === 'local' ? 'SUA SALA · NESTE APARELHO' : r.dono ? 'DONO: ' + seloHtml(r.donoVf) + esc(r.dono) : 'PERSONALIZADA';

        <div class="sl-nome"><b>${r.tranca ? IC.cadeado : ''}<span>${esc(r.nome)}</span></b><small>${sub}${r.placar ? ` · ${r.placar[0]} × ${r.placar[1]}` : ''}</small></div>
        <div class="sl-info"><span class="sl-c">${r.modo}v${r.modo}<small>MODO</small></span><span class="sl-c">${CAMPO_NOME[r.campo] || '–'}<small>CAMPO</small></span><span class="sl-c">${REGIAO_NOME[r.regiao] || esc(String(r.regiao || '').toUpperCase())}<small>${r.regiao === 'local' ? 'APARELHO' : 'REGIÃO'}</small></span>
          <span class="sl-c">${r.jog}/${r.max}<small>${r.esp ? r.esp + ' ASSISTINDO' : 'JOGADORES'}</small></span><span class="sl-st"><span class="tag ${stCls[r.status] || ''}">${STATUS_NOME[r.status] || r.status}</span></span></div>
        <div class="sl-acao"><button type="button" class="bt3d pq ${ver ? 'cinza' : 'verde'}" data-entrar="${esc(r.id)}" data-ver="${ver ? 1 : ''}">${ver ? IC.olho + 'ASSISTIR' : 'ENTRAR'}</button></div></div>`;
    }).join('');
    L.querySelectorAll('[data-entrar]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation(); Som.ui('toque');
      const r = rows.find(x => x.id === b.dataset.entrar); if (!r) return;
      if (r.tranca && r.regiao !== 'local') this.pedeSenha(r, !!b.dataset.ver); else this.entrar(r.id, '', !!b.dataset.ver);
    }));
    L.querySelectorAll('.sl-linha').forEach(d => d.addEventListener('click', () => { const b = d.querySelector('[data-entrar]'); if (b) b.click(); }));
  },
  pedeSenha(r, ver, erro){
    const c = Telas.pop(`<span class="tag vermelho">${IC.cadeado.replace('<svg', '<svg style="width:18px;height:18px;margin-right:6px"')}SALA COM SENHA</span><h2>${esc(r.nome)}</h2><p>Digite a senha para entrar.</p>
      <input type="password" class="in-txt" id="pp-senha" maxlength="${SALA.senhaMax}" autocomplete="off" aria-label="Senha da sala"><span class="pop-erro" id="pp-erro">${erro ? esc(erro) : ''}</span>
      <div class="pop-acoes"><button type="button" class="bt3d cinza" id="pp-nao">CANCELAR</button><button type="button" class="bt3d verde" id="pp-sim">ENTRAR</button></div>`);
    const inp = $('#pp-senha', c); setTimeout(() => inp.focus(), 50);
    const ok = () => { const v = senhaLimpa(inp.value); if (!v){ $('#pp-erro', c).textContent = 'Digite a senha'; Som.ui('erro'); return; } Telas.popFecha(); this.entrar(r.id, v, ver); };
    $('#pp-nao', c).addEventListener('click', () => { Som.ui('fecha'); Telas.popFecha(); });
    $('#pp-sim', c).addEventListener('click', ok);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
  },
  entrar(id, senha, assistir){
    if (id[0] === 'L'){
      const s = SalaLocal.acha(id); if (!s){ aviso('Essa sala não existe mais'); this.renderLista(); return; }
      this.entraLocal(s); return;
    }
    if (!Rede.on){ aviso('Sem conexão com o servidor'); return; }
    this.entrando = { id, senha, assistir }; aviso('Entrando na sala…', 1.5);
    Rede.envia({ t: 'entrar', id, senha: senha || '', assistir: !!assistir });
  },
  entraLocal(s){
    this.sairDaSala(true);
    SalaLocal.atualizaEu(s);
    this.sala = s; this.meuId = 'eu'; this.aba = 'sala';
    this.chat = [{ sis: true, texto: `Você entrou na sala ${s.nome}. Complete os times com bots e toque em COMEÇAR.` }];

    this.monta(); this.mostraSala();
  },
  // entra na sala aberta (sem senha e com vaga) que tiver mais gente; sem nenhuma, cria a sua
  rapido(){
    if (Rede.on){ aviso('Procurando uma sala…', 1.5); Rede.envia({ t: 'rapido', modo: S.modo.n }); return; }
    this.mostraCriar();
  },

  // ------------------------------------------------ CRIAR SALA
  formHtml(f, editavel, extra = ''){
    const grupo = (tit, k, ops, cls) => `<div class="cs-campo"><span>${tit}</span><div class="chips ${cls}">${ops.map(([v, a, b]) => `<button type="button" class="chip${f.cfg[k] === v ? ' on' : ''}" data-k="${k}" data-v="${v}"${editavel ? '' : ' disabled'}>${a}${b ? `<small>${b}</small>` : ''}</button>`).join('')}</div></div>`;
    return `<div class="cs-grade">
      <div class="cs-campo cs-full"><label for="cs-nome">NOME DA SALA</label><input class="in-txt" id="cs-nome" maxlength="${SALA.nomeMax}" autocomplete="off" spellcheck="false" placeholder="Ex.: Racha do ${esc(S.nome || 'Calçadão')}" value="${esc(f.nome)}"${editavel ? '' : ' disabled'}></div>
      ${extra}
      ${grupo('MODO', 'modo', [[1, '1v1'], [2, '2v2'], [3, '3v3'], [4, '4v4']], 'c4')}
      ${grupo('CAMPO', 'campo', [[1, 'PEQUENO'], [2, 'MÉDIO'], [3, 'GRANDE']], 'c3')}
      ${grupo('TEMPO', 'tempo', SALA.tempos.map(t => [t, t + ' MIN']), 'c4')}
      ${grupo('GOLS PARA ACABAR', 'gols', SALA.gols.map(g => [g, g ? String(g) : 'SEM']), 'c5')}
      ${grupo('HORÁRIO', 'hora', [['tarde', 'TARDE'], ['por', 'PÔR DO SOL'], ['noite', 'NOITE']], 'c3')}
      ${grupo('JOGABILIDADE', 'jogab', [['leve', 'LEVE', 'quase não desliza'], ['classica', 'CLÁSSICA', 'com inércia']], 'c2')}
      <div class="cs-linha cs-full"><span>GOL DE OURO NO EMPATE<small style="display:block;font:15px var(--fonte2);font-style:normal;color:var(--sub)">se acabar o tempo empatado, quem marcar primeiro vence</small></span><button type="button" class="sw-b" role="switch" id="cs-ouro" aria-checked="${f.cfg.ouro}" aria-label="Gol de ouro"${editavel ? '' : ' disabled'}></button></div>
      <div class="cs-linha cs-full"><span>TROCAR DE TIME NA PARTIDA<small style="display:block;font:15px var(--fonte2);font-style:normal;color:var(--sub)">com a bola rolando, dá para ir para o outro time ou para os espectadores</small></span><button type="button" class="sw-b" role="switch" id="cs-troca" aria-checked="${f.cfg.trocaJogo !== false}" aria-label="Trocar de time na partida"${editavel ? '' : ' disabled'}></button></div>
    </div>`;
  },
  ligaForm(c, f){
    c.querySelectorAll('.chip[data-k]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.k, v = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v;
      f.cfg[k] = v; Som.ui('toque');
      if (k === 'modo' && !f.campoMexeu){ f.cfg.campo = campoPadrao(v); c.querySelectorAll('.chip[data-k="campo"]').forEach(x => x.classList.toggle('on', +x.dataset.v === f.cfg.campo)); }
      if (k === 'campo') f.campoMexeu = true;
      c.querySelectorAll(`.chip[data-k="${k}"]`).forEach(x => x.classList.toggle('on', x === b));
    }));
    const ouro = $('#cs-ouro', c); if (ouro) ouro.addEventListener('click', () => { f.cfg.ouro = !f.cfg.ouro; ouro.setAttribute('aria-checked', String(f.cfg.ouro)); Som.ui(f.cfg.ouro ? 'liga' : 'desliga'); });
    const tj = $('#cs-troca', c); if (tj) tj.addEventListener('click', () => { f.cfg.trocaJogo = !(f.cfg.trocaJogo !== false); tj.setAttribute('aria-checked', String(f.cfg.trocaJogo)); Som.ui(f.cfg.trocaJogo ? 'liga' : 'desliga'); });
    const nome = $('#cs-nome', c); if (nome) nome.addEventListener('input', () => { f.nome = nome.value; });
  },
  mostraCriar(){
    this.vista = 'criar'; this.fechaMenu();
    const c = this.caixa(); if (!c) return;
    const f = this.form = { nome: '', senha: '', onde: Rede.on ? 'online' : 'local', cfg: cfgSala({ modo: S.modo.n, tempo: Math.round(S.modo.dur / 60), hora: S.modo.hora, jogab: S.cfg.jogab }), campoMexeu: false };
    const onde = `<div class="cs-campo cs-full"><span>ONDE</span><div class="chips c2"><button type="button" class="chip${f.onde === 'online' ? ' on' : ''}" data-onde="online"${Rede.on ? '' : ' disabled'}>ONLINE<small>${Rede.on ? 'todo mundo do servidor vê' : 'precisa do servidor'}</small></button><button type="button" class="chip${f.onde === 'local' ? ' on' : ''}" data-onde="local">NESTE APARELHO<small>você e os bots</small></button></div></div>
      <div class="cs-campo cs-full" id="cs-senha-box"><label for="cs-senha">SENHA <small style="font:15px var(--fonte2);color:var(--sub)">(opcional, só nas salas online)</small></label><input class="in-txt" id="cs-senha" type="password" maxlength="${SALA.senhaMax}" autocomplete="new-password" placeholder="Sem senha"></div>`;
    c.innerHTML = `<div class="cx-cab"><button type="button" class="voltar" data-volta aria-label="Voltar">${IC.voltar}</button><h2>CRIAR SALA</h2><span class="tag">PERSONALIZADA</span><span class="esp"></span></div>
      <div class="cx-corpo">${this.formHtml(f, true, onde)}<span class="pop-erro" id="cs-erro"></span></div>
      <div class="cs-pe"><button type="button" class="bt3d cinza" data-volta>CANCELAR</button><button type="button" class="bt3d verde" id="cs-ok">${IC.mais}CRIAR SALA</button></div>`;
    c.querySelectorAll('[data-volta]').forEach(b => b.addEventListener('click', () => { Som.ui('fecha'); this.mostraLista(); }));
    this.ligaForm(c, f);
    const senha = $('#cs-senha', c), box = $('#cs-senha-box', c);
    const ondeMuda = () => { senha.disabled = f.onde !== 'online'; box.style.opacity = f.onde === 'online' ? 1 : .45; };
    c.querySelectorAll('[data-onde]').forEach(b => b.addEventListener('click', () => { f.onde = b.dataset.onde; Som.ui('toque'); c.querySelectorAll('[data-onde]').forEach(x => x.classList.toggle('on', x === b)); ondeMuda(); }));
    ondeMuda();
    $('#cs-ok', c).addEventListener('click', () => {
      const nome = nomeSala($('#cs-nome', c).value || `Racha do ${S.nome || 'Calçadão'}`);
      if (!nome){ $('#cs-erro', c).textContent = `O nome precisa de ${SALA.nomeMin} a ${SALA.nomeMax} letras`; Som.ui('erro'); return; }
      Som.ui('toque');
      if (f.onde === 'online' && Rede.on){ aviso('Criando a sala…', 1.5); Rede.envia({ t: 'criar', nome, senha: senhaLimpa(senha.value), cfg: f.cfg }); return; }
      const s = SalaLocal.nova(nome, f.cfg); SalaLocal.salva(s); this.entraLocal(s);
      this.sis('Sala criada! Os times já vêm com bots: toque num bot para tirar ou mudar de time.');
    });
  },

  // ------------------------------------------------ DENTRO DA SALA
  mostraSala(){
    this.vista = 'sala'; this.fechaMenu();
    const c = this.caixa(); if (!c || !this.sala) return;
    c.innerHTML = `<div class="cx-cab sa-cab"><button type="button" class="voltar" data-sai aria-label="Sair da sala">${IC.voltar}</button>
        <div class="sa-tit"><h2 id="sa-nome"></h2><div class="sa-chips" id="sa-chips"></div></div><span class="esp"></span>
        <div class="sa-abas" role="tablist"><button type="button" data-aba="sala">SALA</button><button type="button" data-aba="aj">AJUSTES</button><button type="button" data-aba="est">ESTATÍSTICAS</button></div></div>
      <div id="sa-conteudo" style="flex:1 1 0;min-height:0;display:flex;flex-direction:column"></div>`;
    $('[data-sai]', c).addEventListener('click', () => { Som.ui('fecha'); this.sairDaSala(); this.mostraLista(); });
    c.querySelectorAll('[data-aba]').forEach(b => b.addEventListener('click', () => { if (this.aba === b.dataset.aba) return; this.aba = b.dataset.aba; Som.ui('toque'); this.montaAba(); }));
    this.montaAba();
  },
  montaAba(){
    const c = this.caixa(); if (!c) return;
    c.querySelectorAll('[data-aba]').forEach(b => b.classList.toggle('on', b.dataset.aba === this.aba));
    const box = $('#sa-conteudo', c); this.fechaMenu();
    if (this.aba === 'sala'){
      box.innerHTML = `<div class="sa-corpo">
        <section class="sa-time" style="--tc:${CORES_TIME[0]}" data-t="0"><header><b>VERMELHO</b><small></small></header><div class="sa-mems"></div><div class="sa-pe"></div></section>
        <section class="sa-time e" data-t="2"><header><b>ESPECTADORES</b><small></small></header><div class="sa-mems"></div><div class="sa-pe"></div></section>
        <section class="sa-time b" style="--tc:${CORES_TIME[1]}" data-t="1"><header><b>AZUL</b><small></small></header><div class="sa-mems"></div><div class="sa-pe"></div></section>
        <div class="sa-chat"><div class="ch-msgs" id="sa-msgs" aria-live="polite"></div><form class="ch-envio" id="sa-form"><input class="in-txt" id="sa-in" maxlength="${SALA.chatMax}" autocomplete="off" placeholder="Fale com a sala" aria-label="Mensagem para a sala"><button type="submit" class="bt3d pq" aria-label="Enviar">${IC.enviar}</button></form></div>
        <div class="sa-acao" id="sa-acao"></div></div>`;
      $('#sa-form', box).addEventListener('submit', e => { e.preventDefault(); const i = $('#sa-in', box), t = limpaTexto(i.value, SALA.chatMax); if (!t) return; i.value = ''; this.fala(t); });
    } else if (this.aba === 'aj'){
      box.innerHTML = `<div class="sa-aj" id="sa-aj"></div>`;
      this.renderAjustes();
    } else box.innerHTML = `<div class="sa-est" id="sa-est"></div>`;
    this.renderSala();
  },
  renderSala(){
    const c = this.caixa(), s = this.sala; if (!c || !s || this.vista !== 'sala') return;
    $('#sa-nome', c).textContent = s.nome;
    const chips = [`<span class="tag">${s.cfg.modo}v${s.cfg.modo}</span>`, `<span class="tag cinza">CAMPO ${CAMPO_NOME[s.cfg.campo]}</span>`, `<span class="tag cinza">${s.cfg.tempo} MIN${s.cfg.gols ? ' · ' + s.cfg.gols + ' GOLS' : ''}</span>`,
      s.local ? '<span class="tag verde">NESTE APARELHO</span>' : `<span class="tag azul">${REGIAO_NOME[s.regiao] || 'ONLINE'}</span>`, s.tipo === 'oficial' ? '<span class="tag roxo">OFICIAL</span>' : '', s.tranca ? '<span class="tag vermelho">COM SENHA</span>' : '',
      s.status === 'jogo' ? `<span class="tag vermelho">EM JOGO${s.placar ? ' · ' + s.placar[0] + ' × ' + s.placar[1] : ''}</span>` : ''];
    $('#sa-chips', c).innerHTML = chips.join('');
    if (this.aba === 'sala'){ this.renderTimes(); this.renderChat(); this.renderAcao(); }
    else if (this.aba === 'est') this.renderEst();
    else if (this.aba === 'aj' && !this.souDono) this.renderAjustes();
  },
  renderTimes(){
    const c = this.caixa(), s = this.sala, eu = this.eu, dono = this.souDono, jogo = s.status !== 'espera';
    for (const sec of c.querySelectorAll('.sa-time')){
      const t = +sec.dataset.t, ms = s.membros.filter(m => m.time === t);
      $('header small', sec).textContent = t === ESPECTADOR ? `${ms.length}/${SALA.espMax}` : `${ms.length}/${s.cfg.modo}`;
      const lista = $('.sa-mems', sec);
      lista.innerHTML = ms.length ? ms.map(m => `<button type="button" class="sa-mem${m.id === this.meuId ? ' eu' : ''}" data-m="${esc(String(m.id))}"><canvas width="10" height="10" aria-hidden="true"></canvas><b>${seloHtml(m.vf)}${esc(m.nome)}${m.cid ? `<small class="sa-cid">#${m.cid | 0}</small>` : ''}${m.id === this.meuId ? ' (você)' : ''}</b>${m.id === s.dono ? '<span class="tag">DONO</span>' : ''}${m.bot != null ? `<span class="tag cinza">BOT ${DIF_NOME[m.bot] || ''}</span>` : ''}${m.volta ? '<span class="tag vermelho">VOLTANDO</span>' : ''}</button>`).join('')
        : `<div class="sa-vaz">${t === ESPECTADOR ? 'Ninguém assistindo' : 'Time vazio'}</div>`;
      lista.querySelectorAll('.sa-mem').forEach(b => {
        const m = s.membros.find(x => String(x.id) === b.dataset.m); if (!m) return;
        const v = visualLimpo(m.visual), cor = corDoVisual(v, t === ESPECTADOR ? '#8a90a8' : CORES_TIME[t]);
        pintaBotao(b.querySelector('canvas'), 46, { desenho: v.desenho, texto: v.texto, cor }, { anel: t !== ESPECTADOR && v.cor !== 'time' ? CORES_TIME[t] : null });
        b.addEventListener('click', e => { e.stopPropagation(); this.menuMembro(m, b); });
      });
      const pe = $('.sa-pe', sec), bts = [];
      const podeMudar = eu && eu.time !== t && (!jogo || s.local || t === ESPECTADOR || (s.cfg && s.cfg.trocaJogo));   // trocaJogo
      if (podeMudar && (t === ESPECTADOR || vagasTime(s, t) > 0)) bts.push(`<button type="button" class="bt3d mini${t === ESPECTADOR ? ' cinza' : ' verde'}" data-ir="${t}">${t === ESPECTADOR ? IC.olho + 'ASSISTIR' : 'ENTRAR'}</button>`);
      if (dono && t !== ESPECTADOR && vagasTime(s, t) > 0 && s.tipo !== 'oficial') bts.push(`<button type="button" class="bt3d mini cinza" data-bot="${t}">${IC.robo}+ BOT</button>`);
      pe.innerHTML = bts.join(''); pe.hidden = !bts.length;
      pe.querySelectorAll('[data-ir]').forEach(b => b.addEventListener('click', () => { Som.ui('toque'); this.acao('time', { alvo: this.meuId, time: +b.dataset.ir }); }));
      pe.querySelectorAll('[data-bot]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); this.menuBot(+b.dataset.bot, b); }));
    }
  },
  renderAcao(){
    const box = $('#sa-acao', this.caixa()), s = this.sala; if (!box) return;
    const temA = s.membros.some(m => m.time === 0), temB = s.membros.some(m => m.time === 1), pronto = temA && temB;
    let st, bts = '';
    if (s.status === 'jogo'){
      st = `Partida rolando${s.placar ? `: <b>${s.placar[0]} × ${s.placar[1]}</b>` : ''}${s.pausada ? ' (pausada)' : ''}`;
      if (this.online) bts += `<button type="button" class="bt3d amarelo" id="sa-ver">${IC.olho}VER PARTIDA</button>`;
      if (this.souDono) bts += `<button type="button" class="bt3d vermelho pq" id="sa-parar">PARAR PARTIDA</button>`;
    } else if (s.status === 'comecando'){ st = '<b>Começando…</b>'; }
    else if (s.tipo === 'oficial' && !s.local){ st = pronto ? 'A partida começa sozinha em instantes' : 'A partida começa sozinha quando os <b>dois times</b> tiverem gente'; }
    else if (this.souDono){
      st = pronto ? 'Times prontos! Toque em <b>COMEÇAR</b>' : 'Precisa de pelo menos <b>um jogador em cada time</b>';
      bts += `<button type="button" class="bt3d amarelo" id="sa-comecar"${pronto ? '' : ' disabled'}>${IC.play}COMEÇAR</button>`;
      if (s.local) bts += `<div style="display:flex;gap:8px"><button type="button" class="bt3d mini cinza" id="sa-enche" style="flex:1">${IC.robo}COMPLETAR</button><button type="button" class="bt3d mini cinza" id="sa-esvazia" style="flex:1">TIRAR BOTS</button></div>`;
    } else st = `Esperando <b>${esc((s.membros.find(m => m.id === s.dono) || {}).nome || 'o dono')}</b> começar`;
    box.innerHTML = `<p class="sa-status">${st}</p>${bts}`;
    const on = (id, f) => { const b = $(id, box); if (b) b.addEventListener('click', f); };
    on('#sa-comecar', () => { Som.ui('toque'); this.acao('comecar'); });
    on('#sa-parar', () => { Som.ui('toque'); this.acao('parar'); });
    on('#sa-ver', () => { Som.ui('toque'); Online.assistir(); });
    on('#sa-enche', () => { Som.ui('equipa'); this.acao('enche', { dif: S.modo.dif }); });
    on('#sa-esvazia', () => { Som.ui('toque'); this.acao('esvazia'); });
  },
  renderChat(){
    const m = $('#sa-msgs', this.caixa()); if (!m) return;
    m.innerHTML = this.chat.slice(-60).map(x => `<div class="ch-msg${x.sis ? ' sis' : ''}${x.time === 0 || x.time === 1 ? ' t' + x.time : ''}">${autorChat(x)}${esc(x.texto)}</div>`).join('') || '<div class="ch-msg sis">Ninguém falou nada ainda.</div>';
    m.scrollTop = m.scrollHeight; ligaAutores(m);
    const i = $('#sa-in', this.caixa()); if (i && this.online){ const mudo = Conta.semChat(); i.disabled = mudo; i.placeholder = mudo ? Conta.textoMudo() : 'Fale com a sala'; }
  },
  renderAjustes(){
    const box = $('#sa-aj', this.caixa()), s = this.sala; if (!box) return;
    const ed = this.souDono && s.status === 'espera';
    const f = this.form = { nome: s.nome, cfg: { ...s.cfg }, campoMexeu: true, senha: { modo: 'manter', valor: '' } };
    const senha = !s.local && this.souDono ? `<div class="cs-campo cs-full"><span>SENHA ${s.tranca ? '<small style="font:15px var(--fonte2);color:var(--sub)">(a sala tem senha)</small>' : ''}</span>
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><div class="seg"><button type="button" class="on" data-sm="manter">MANTER</button><button type="button" data-sm="trocar">${s.tranca ? 'TROCAR' : 'COLOCAR'}</button>${s.tranca ? '<button type="button" data-sm="tirar">TIRAR</button>' : ''}</div>
      <input class="in-txt" id="sa-senha" type="password" maxlength="${SALA.senhaMax}" autocomplete="new-password" placeholder="Nova senha" disabled style="flex:1 1 240px;height:58px"></div></div>` : '';
    box.innerHTML = this.formHtml(f, ed, senha) + `<div class="pop-acoes" style="justify-content:flex-start">${ed ? `<button type="button" class="bt3d verde" id="sa-salvar">${IC.ok}SALVAR AJUSTES</button>` : ''}${s.local && s.tipo === 'pers' ? `<button type="button" class="bt3d vermelho pq" id="sa-apagar">APAGAR SALA</button>` : ''}</div>

/* ---- 85-ranking.js ---- */
// ======================================================================= RANKING: quem mais fez gols, deu assistências e foi o melhor da partida nas salas
// Com servidor: todas as contas do jogo (o servidor soma no fim de cada partida que vale).
// Sem servidor: as contas deste aparelho (as partidas nas salas deste aparelho, com bots, valem aqui).
const RK_ABAS = [['g', 'GOLS', 'gols'], ['a', 'ASSISTÊNCIAS', 'assist.'], ['m', 'MELHOR DA PARTIDA', 'vezes']];
// as contas deste aparelho com os números de cada uma (a conta aberta usa o que está na memória)
function rkLocais(){
  const st = Conta.loja(), eu = Conta.atual && Conta.atual.modo === 'local' ? Conta.atual.id : 0;
  return st.contas.map(c => {
    const d = c.id === eu ? S : lerJSON(CHAVE + ':L' + c.id);
    return { cid: c.id, nome: c.usuario, vf: !!c.vf, visual: visualLimpo(c.id === eu ? S.visual : (d && d.visual) || c.visual), rk: rkLimpo(d && d.rk), eu: c.id === eu, criado: c.criado || 0 };
  });
}
// ordena por um número (empate: quem jogou menos fica na frente, depois o ID menor) e põe a posição
function rkOrdena(lista, por){
  const l = lista.filter(x => x.rk[por] > 0).sort((x, y) => y.rk[por] - x.rk[por] || x.rk.j - y.rk.j || x.cid - y.cid);
  let pos = 0, ult = null;
  l.forEach((x, i) => { if (x.rk[por] !== ult){ pos = i + 1; ult = x.rk[por]; } x.pos = pos; });
  return l;
}
// a posição de uma conta em cada ranking (0 = ainda sem número)
function rkPosicoes(lista, cid){ const o = {}; for (const [k] of RK_ABAS){ const x = rkOrdena(lista, k).find(y => y.cid === cid); o[k] = x ? x.pos : 0; } return o; }
const posTx = n => n ? n + 'º' : '–';

const Ranking = {
  aba: 'g', lista: null, eu: null, total: 0, carregando: false, espera: null, esperaT: 0,
  get local(){ return !Conta.online || !Rede.on || !Conta.servidorOk; },
  monta(c){
    c.innerHTML = Telas.cab('RANKING', '<span class="tag">SALAS</span>', false) + `<div class="cx-corpo rk-corpo">
      <div class="abas rk-abas" role="tablist">${RK_ABAS.map(([k, n]) => `<button type="button" role="tab" data-rk="${k}">${n}</button>`).join('')}</div>
      <div class="rk-lista" id="rk-lista"></div>
      <div class="rk-eu" id="rk-eu"></div>
      <p class="nota" id="rk-nota"></p></div>`;
    c.querySelectorAll('[data-rk]').forEach(b => b.addEventListener('click', () => { if (this.aba === b.dataset.rk) return; this.aba = b.dataset.rk; Som.ui('toque'); this.carrega(); }));
    this.carrega();
  },
  caixa(){ return Telas.aberta === 'ranking' && Telas.el ? $('.caixa', Telas.el) : null; },
  carrega(){
    const c = this.caixa(); if (!c) return;
    c.querySelectorAll('[data-rk]').forEach(b => { b.classList.toggle('on', b.dataset.rk === this.aba); b.setAttribute('aria-selected', String(b.dataset.rk === this.aba)); });
    $('#rk-nota', c).innerHTML = this.local
      ? 'Sem servidor: aparecem as <b>contas deste aparelho</b>, com as partidas nas salas daqui. Com o servidor ligado, aparece todo mundo do jogo.'
      : 'Valem as partidas nas <b>salas online</b> com gente de verdade nos dois times. O melhor da partida é quem fez mais pelo time (gols, assistências, chutes e passes).';
    if (this.local){
      const todas = rkLocais(), l = rkOrdena(todas, this.aba), eu = todas.find(x => x.eu);
      this.lista = l.slice(0, 50); this.total = l.length;
      this.eu = eu ? { pos: (l.find(x => x.eu) || {}).pos || 0, v: eu.rk[this.aba], j: eu.rk.j } : null;
      this.render(); return;
    }
    this.lista = null; this.render();
    this.pede({ t: 'ranking', por: this.aba }).then(m => {
      if (m.por !== this.aba) return;
      this.lista = (Array.isArray(m.lista) ? m.lista : []).map(x => ({ cid: x.cid | 0, nome: limpaTexto(x.nome, 16), vf: !!x.vf, visual: visualLimpo(x.visual), rk: rkLimpo(x.rk), pos: x.pos | 0, eu: !!(Conta.atual && Conta.atual.id === (x.cid | 0)) }));
      this.total = m.total | 0; this.eu = m.eu ? { pos: m.eu.pos | 0, v: m.eu.v | 0, j: m.eu.j | 0 } : null;
      this.render();
    }).catch(e => { if (e === 'trocou') return; const L = $('#rk-lista', this.caixa() || document); if (L) L.innerHTML = `<div class="vazio" style="padding:30px"><b>${esc(typeof e === 'string' ? e : 'Não deu para carregar')}</b></div>`; });
  },
  // uma pergunta por vez para o servidor
  pede(msg){
    return new Promise((res, rej) => {
      if (!Rede.on) return rej('Sem conexão com o servidor');
      if (this.espera) this.espera.rej('trocou');
      this.espera = { res, rej, t: msg.t };
      clearTimeout(this.esperaT); this.esperaT = setTimeout(() => { if (this.espera){ this.espera = null; rej('O servidor não respondeu'); } }, 8000);
      Rede.envia(msg);
    });
  },
  recebe(m){ const e = this.espera; if (!e || e.t !== m.t) return; this.espera = null; clearTimeout(this.esperaT); if (m.erro) e.rej(limpaTexto(m.erro, 100)); else e.res(m); },
  render(){
    const c = this.caixa(); if (!c) return;
    const L = $('#rk-lista', c), E = $('#rk-eu', c), aba = RK_ABAS.find(x => x[0] === this.aba);
    if (!this.lista){ L.innerHTML = '<div class="vazio" style="padding:30px"><b>Carregando…</b></div>'; E.innerHTML = ''; return; }
    if (!this.lista.length){
      L.innerHTML = `<div class="vazio rk-vazio">${IC.podio.replace('<svg', '<svg style="width:76px;height:76px"')}<b>${this.aba === 'g' ? 'Ninguém marcou ainda' : this.aba === 'a' ? 'Ninguém deu assistência ainda' : 'Ninguém foi o melhor da partida ainda'}</b><span>Jogue nas salas e apareça aqui!</span><button type="button" class="bt3d amarelo pq" id="rk-jogar">${IC.play}IR PARA AS SALAS</button></div>`;
      $('#rk-jogar', L).addEventListener('click', () => { Som.ui('abre'); Telas.abre('salas'); });
    } else {
      L.innerHTML = this.lista.map(x => `<button type="button" class="rk-linha${x.eu ? ' eu' : ''}${x.pos <= 3 ? ' top' + x.pos : ''}" data-cid="${x.cid}">
        <span class="rk-pos">${x.pos <= 3 ? `<i>${IC.coroa}</i>` : ''}${x.pos}º</span><canvas width="10" height="10" aria-hidden="true"></canvas>
        <span class="rk-nome"><b>${seloHtml(x.vf)}${esc(x.nome)}${x.eu ? ' <small>(você)</small>' : ''}</b><small>#${x.cid} · ${x.rk.j} ${x.rk.j === 1 ? 'jogo' : 'jogos'}</small></span>
        <span class="rk-v"><b>${fmt(x.rk[this.aba])}</b><small>${aba[2]}</small></span></button>`).join('');
      L.querySelectorAll('.rk-linha').forEach(b => {
        const x = this.lista.find(y => y.cid === +b.dataset.cid); if (!x) return;
        pintaBotao(b.querySelector('canvas'), 48, { desenho: x.visual.desenho, texto: x.visual.texto, cor: corDoVisual(x.visual, CORES_TIME[0]) });
        b.addEventListener('click', () => { Som.ui('abre'); this.cartao(x); });
      });
    }
    const eu = this.eu;
    E.innerHTML = Conta.atual ? `<span>VOCÊ</span><b>${eu && eu.pos ? eu.pos + 'º' : 'sem posição'}</b><span>${eu ? fmt(eu.v) : 0} ${aba[2]}${this.total ? ` · ${this.total} no ranking` : ''}</span>` : '';
  },
  // o cartão de um jogador (o admin ajusta os números por aqui também)
  async cartao(x){
    let p = { cid: x.cid, nome: x.nome, vf: x.vf, visual: x.visual, rk: x.rk, pos: null };
    if (this.local){ const todas = rkLocais(); const y = todas.find(z => z.cid === x.cid); if (y){ p.rk = y.rk; p.vf = y.vf; } p.pos = rkPosicoes(todas, x.cid); }
    else { try { const m = await this.pede({ t: 'perfilDe', id: x.cid }); if (m.p){ p = Object.assign(p, { nome: limpaTexto(m.p.usuario, 16) || p.nome, vf: !!m.p.vf, visual: visualLimpo(m.p.visual), rk: rkLimpo(m.p.rk), pos: m.p.pos || null }); } } catch (_) {} }

// ======================================================================= REDE — WebSocket com o servidor do GINGA (ginga-servidor.js)
// Sem endereço configurado, tenta o mesmo endereço de onde o jogo foi aberto (ws://host/ginga).
const Rede = {
  ws: null, on: false, estado: 'off', id: null, ping: 0, bloqueado: false, servidor: '',
  salas: [], online: [], nSalas: 0, nOnline: 0, chat: { brasil: [], global: [] },
  tent: 0, timer: 0, pingT: 0, quer: false, parado: false,
  token(){
    let t = ''; try { t = localStorage.getItem('ginga-token') || ''; } catch (_) {}
    if (!/^[a-z0-9]{16,40}$/.test(t)){
      const r = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(12)) : Array.from({ length: 12 }, () => Math.random() * 256 | 0);
      t = Array.from(r, b => b.toString(36).padStart(2, '0')).join('').slice(0, 24);
      try { localStorage.setItem('ginga-token', t); } catch (_) {}
    }
    return t;
  },
  urlPadrao(){ const l = location; if (l.protocol !== 'http:' && l.protocol !== 'https:') return ''; return (l.protocol === 'https:' ? 'wss://' : 'ws://') + l.host + '/ginga'; },
  url(){
    let s = String(S.cfg.servidor || '').trim();
    if (!s) return this.urlPadrao();
    if (!/^wss?:\/\//i.test(s)) s = (/^https:\/\//i.test(s) || location.protocol === 'https:' ? 'wss://' : 'ws://') + s.replace(/^https?:\/\//i, '');
    try { const u = new URL(s); if (u.pathname === '/' || !u.pathname) u.pathname = '/ginga'; return u.href; } catch (_) { return ''; }
  },
  muda(estado){
    const antes = this.on;
    this.estado = estado; this.on = estado === 'on';
    if (!this.on){ this.id = null; clearInterval(this.pingT); }
    if (antes !== this.on || estado === 'vai'){
      Salas.redeMudou(); Conta.redeMudou();
      if (App.estado === 'lobby'){ Lobby.atualiza(); if (Telas.aberta === 'chat') Telas.chMonta(Telas.el.querySelector('.caixa')); if (Telas.aberta === 'amigos') Telas.amRender(); }
    }
  },
  // sem endereço escrito nos ajustes, só conecta sozinho se o jogo foi aberto pelo ginga-servidor.js
  // (pergunta o /saude antes; aqui no Claude não tem servidor, então nem tenta e o login não fica esperando)
  sondou: false,
  async sonda(){
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return false;
    try {
      const ctl = window.AbortController ? new AbortController() : null, t = setTimeout(() => ctl && ctl.abort(), 2500);
      const r = await fetch('/saude', { cache: 'no-store', signal: ctl ? ctl.signal : undefined }); clearTimeout(t);
      if (!r.ok) return false;
      const j = await r.json(); return !!(j && j.ok && j.protocolo);
    } catch (_) { return false; }
  },
  conectar(manual){
    clearTimeout(this.timer);
    if (manual){ this.quer = true; this.parado = false; }
    if (this.parado) return;
    const url = this.url();
    if (!url){ this.muda('off'); if (manual) aviso('Endereço do servidor inválido'); return; }
    if (!manual && !String(S.cfg.servidor || '').trim() && !this.sondou){
      this.muda('vai');
      this.sonda().then(ok => { this.sondou = ok; if (ok) this.conectar(false); else this.muda('off'); });
      return;
    }
    if (this.ws){ const w = this.ws; this.ws = null; w.onclose = null; try { w.close(); } catch (_) {} }
    let ws;
    try { ws = new WebSocket(url); }
    catch (_) { this.bloqueado = true; this.muda('off'); if (manual) aviso('Este lugar não deixa conectar nesse endereço'); return; }
    this.ws = ws; this.muda('vai');
    ws.onopen = () => { if (this.ws !== ws) return; this.tent = 0; this.envia({ t: 'oi', v: PROTO, nome: S.nome || 'Jogador', visual: visualLimpo(S.visual), token: this.token(), mira: !!S.cfg.mira, sessao: Conta.tokenPara(url) }); };
    ws.onmessage = e => { if (this.ws !== ws) return; let m; try { m = JSON.parse(e.data); } catch (_) { return; } if (m && typeof m.t === 'string') this.recebe(m); };
    ws.onerror = () => {};
    ws.onclose = e => {
      if (this.ws !== ws) return;
      this.ws = null; const estava = this.on; this.muda('off'); Conta.servidorOk = false;
      if (e && (e.code === 4000 || e.code === 4001)) this.parado = true;   // a conta (ou esta aba) entrou em outro lugar: não fica brigando
      if (estava && !this.parado) aviso('A conexão com o servidor caiu', 2.6);
      if (estava) Online.caiu();
      if (!this.parado && (this.quer || estava || S.cfg.servidor)){ this.tent++; this.timer = setTimeout(() => this.conectar(false), Math.min(30000, 1500 * Math.pow(2, Math.min(this.tent, 6) - 1))); }
    };
  },
  desconectar(){ this.quer = false; clearTimeout(this.timer); if (this.ws){ const w = this.ws; this.ws = null; w.onclose = null; try { w.close(); } catch (_) {} } this.muda('off'); Online.caiu(); },
  envia(m){ const w = this.ws; if (w && w.readyState === 1){ try { w.send(JSON.stringify(m)); return true; } catch (_) {} } return false; },
  perfil(){ if (this.on) this.envia({ t: 'perfil', nome: S.nome || 'Jogador', visual: visualLimpo(S.visual), mira: !!S.cfg.mira }); },
  oi(){ this.perfil(); },
  recebe(m){
    switch (m.t){
      case 'bemvindo':
        this.id = m.id; this.servidor = limpaTexto(m.nome, 40); this.quer = true; Conta.conectou();
        if (m.chat){ this.chat.brasil = (m.chat.brasil || []).slice(-60); this.chat.global = (m.chat.global || []).slice(-60); }
        this.muda('on');
        clearInterval(this.pingT); this.pingT = setInterval(() => this.envia({ t: 'ping', c: performance.now() }), 3000); this.envia({ t: 'ping', c: performance.now() });
        this.envia({ t: 'salas' });
        break;
      case 'pong': if (typeof m.c === 'number') this.ping = Math.max(0, Math.round(performance.now() - m.c)); break;
      case 'salas':
        this.salas = Array.isArray(m.lista) ? m.lista.filter(r => r && typeof r.id === 'string') : [];
        this.nSalas = this.salas.length; this.nOnline = m.online | 0;
        Salas.listaMudou(); if (App.estado === 'lobby' && !Salas.el) Lobby.atualiza();
        break;
      case 'sala': if (m.sala && Array.isArray(m.sala.membros)) Salas.estado(m.sala); break;
      case 'saiu': Online.caiu(); Salas.saiu(m.motivo); break;
      case 'erro':
        if (m.cod === 'versao'){ aviso('O servidor é de outra versão do GINGA', 4); this.desconectar(); return; }
        if (m.cod === 'outroAparelho'){ this.parado = true; Conta.outroAparelho(); return; }
        if (Conta.recebeErro(m)) return;
        if (m.cod === 'mudo'){ Conta.recebeMudo(m); return; }
        if (Admin.recebeErro(m)) return;
        if (m.cod === 'precisaConta'){ Salas.entrando = null; Conta.pedeConta(); return; }
        Salas.erro(m); break;
      case 'conta': if (m.id > 0) Conta.recebeConta(m); else Online.msg({ t: 'contagem', n: m.n }); break;
      case 'semConta': Conta.semConta(m); break;
      case 'senhaOk': Conta.senhaOk(); break;
      case 'selo': Conta.mudaSelo(!!m.vf); break;
      case 'mudo': Conta.recebeMudo(m); break;
      case 'admin': Admin.recebe(m); break;
      case 'rk': Conta.recebeRk(m); break;
      case 'ranking': case 'perfilDe': Ranking.recebe(m); break;
      case 'renomeou': Conta.renomeou(m); break;
      case 'dig': {
        if (typeof R !== 'undefined' && R.p) for (const j of R.p.jog){ if (String(j.id) === String(m.id)) j.digAte = m.on ? performance.now() + 2600 : 0; }
        break;
      }
      case 'chat': {
        const msg = { de: limpaTexto(m.de, 16), texto: limpaTexto(m.texto, SALA.chatMax), time: m.time, sis: !!m.sis, cid: m.cid | 0, vf: !!m.vf };
        if (m.canal === 'sala') Salas.chatSala(msg);
        else if (this.chat[m.canal]){ const l = this.chat[m.canal]; l.push(msg); if (l.length > 80) l.splice(0, l.length - 80); if (Telas.aberta === 'chat' && Telas.canalChat === m.canal) Telas.chRender(); }
        break;
      }
      case 'online': this.online = Array.isArray(m.lista) ? m.lista : []; this.nOnline = this.online.length; if (Telas.aberta === 'amigos') Telas.amRender(); break;
      case 'partida': case 'elenco': case 'q': case 'contagem': case 'fase': case 'fim': case 'pausa': Online.msg(m); break;
    }
  }
};

const Admin = {

  // ---------------- conversa com o servidor (uma pergunta por vez)

// ======================================================================= PARTIDA ONLINE — o servidor manda as fotos (30 por segundo) e o jogo desenha
// um pouquinho no passado (o "atraso" dos ajustes), sempre entre duas fotos: assim ninguém treme.
const Online = {
  m: null, buf: [], off: null, evs: [], fora: false, ultIn: '', ultEnvio: 0, golK: 0, rt: 0,
  msg(m){
    switch (m.t){
      case 'partida':
        this.m = m; this.buf.length = 0; this.off = null; this.evs.length = 0; this.fora = false; this.golK = 0;
        if (Salas.sala) Salas.sala.status = 'jogo';
        if (!this.ativo()) this.entra(); else Jogo.reiniciaOnline(m);
        break;
      case 'elenco': if (this.m){ this.m.jog = m.jog; if (this.ativo()) Jogo.elencoOnline(m.jog); } break;
      case 'q': if (this.m) this.q(m); break;
      case 'contagem': if (this.ativo()) Jogo.contaOnline(m.n | 0); break;
      case 'fase': if (this.m) this.m.fase = m.f; if (this.ativo()) Jogo.faseOnline(m.f); break;
      case 'pausa': if (this.m) this.m.pausada = !!m.on; if (this.ativo()) Jogo.pausaOnline(!!m.on, limpaTexto(m.por, 16)); break;
      case 'fim': if (this.ativo()) Jogo.fimOnline(m); this.m = null; break;
    }
  },
  ativo(){ return App.estado === 'jogo' && !!Jogo.cfg && Jogo.cfg.tipo === 'online'; },
  entra(){
    const m = this.m; if (!m || this.fora) return;
    const cfg = cfgSala(m.cfg);
    App.comecaJogo({ tipo: 'online', n: cfg.modo, arena: cfg.campo, dur: +m.tempo || 0, gols: cfg.gols, ouro: cfg.ouro, hora: cfg.hora, jogab: cfg.jogab,
      times: this.times(m.jog), placar: Array.isArray(m.placar) ? m.placar : [0, 0], faseIni: m.fase, ouroAtivo: !!m.ouro, pausada: !!m.pausada });
  },
  // quem voltou para a sala no meio da partida pode voltar a assistir
  assistir(){ this.fora = false; if (this.m) this.entra(); else aviso('A partida já acabou'); },
  sairDaTela(){ this.fora = true; },
  times(jog){ return [0, 1].map(t => (jog || []).filter(x => x && x.time === t).map(x => ({ id: x.id, mid: x.id, nome: limpaTexto(x.nome, 16) || '?', visual: visualLimpo(x.visual), eu: x.id === Rede.id, vf: !!x.vf, remoto: true }))); },
  caiu(){ this.m = null; this.buf.length = 0; this.evs.length = 0; if (this.ativo()) App.lobby(); },
  q(m){
    if (typeof m.k !== 'number' || !Array.isArray(m.b) || !Array.isArray(m.d)) return;
    const t = agora(), o = m.k / 60 - t;
    if (this.off === null || o > this.off) this.off = o; else this.off += (o - this.off) * .02;
    const ult = this.buf[this.buf.length - 1];
    if (ult && m.k <= ult.k) return;               // chegou fora de ordem
    this.buf.push(m); if (this.buf.length > 300) this.buf.shift();
    if (Array.isArray(m.e)) for (const e of m.e) this.evs.push({ k: m.k, e });
    if (this.m){ if (Array.isArray(m.pl)) this.m.placar = m.pl; if (typeof m.tm === 'number') this.m.tempo = m.tm; this.m.ouro = !!m.o; }
    if (this.ativo()) Jogo.relogioOnline(m.tm, !!m.o);
  },
  // coloca todo mundo onde estava no instante (agora − atraso)
  aplica(p){
    const n = this.buf.length; if (!n) return 0;
    const rt = (agora() + this.off) * 60 - clamp(S.cfg.atraso, 30, 200) * .06;
    let a = null, b = null;
    for (let i = n - 1; i >= 0; i--){ if (this.buf[i].k <= rt){ a = this.buf[i]; b = this.buf[i + 1] || null; break; } }
    if (!a){ a = this.buf[0]; b = null; }
    const u = b ? clamp((rt - a.k) / Math.max(1, b.k - a.k), 0, 1) : 0;
    const ext = b ? 0 : clamp((rt - a.k) / 60, 0, .1);
    const bl = p.bola, A = a.b, B = b ? b.b : null;
    bl.px = bl.x; bl.py = bl.y; bl.pz = bl.z;
    if (B){ bl.x = lerp(A[0], B[0], u); bl.y = lerp(A[1], B[1], u); bl.vx = lerp(A[2], B[2], u); bl.vy = lerp(A[3], B[3], u); bl.z = lerp(A[4], B[4], u); }
    else { bl.x = A[0] + A[2] * ext; bl.y = A[1] + A[3] * ext; bl.vx = A[2]; bl.vy = A[3]; bl.z = A[4]; }
    const mb = b ? new Map(b.d.map(x => [x[0], x])) : null;
    for (const d of a.d){
      const j = Jogo.porId.get(d[0]); if (!j) continue;
      const e = mb && mb.get(d[0]);
      j.px = j.x; j.py = j.y;
      if (e){ j.x = lerp(d[1], e[1], u); j.y = lerp(d[2], e[2], u); j.vx = lerp(d[3], e[3], u); j.vy = lerp(d[4], e[4], u); j.carga = lerp(d[5], e[5], u); }
      else { j.x = d[1] + d[3] * ext; j.y = d[2] + d[4] * ext; j.vx = d[3]; j.vy = d[4]; j.carga = d[5]; }
      j.forteCd = d[6] || 0;
    }
    this.rt = rt;
    return rt;
  },
  // eventos (chute, trave, gol...) saem na hora em que a bola chega lá na tela
  eventos(rt, f){
    while (this.evs.length && this.evs[0].k <= rt){
      const { k, e } = this.evs.shift();
      if (!e || typeof e.tipo !== 'string') continue;
      const ev = { ...e };
      for (const c of ['j', 'autor', 'assist']) if (c in e){ ev[c] = e[c] == null ? null : Jogo.porId.get(e[c]) || null; }
      if ('j' in e && !ev.j) continue;
      if (ev.tipo === 'gol') this.golK = k;
      f(ev);
    }
  },
  // depois do replay: o que aconteceu enquanto ele passava não toca de novo
  descarta(){ const rt = (agora() + (this.off || 0)) * 60 - clamp(S.cfg.atraso, 30, 200) * .06; this.evs = this.evs.filter(x => x.k > rt); this.rt = rt; },
  // replay: as fotos dos últimos segundos antes do gol, em 60 quadros por segundo
  quadrosReplay(p){
    const fim = (this.golK || (this.buf.length ? this.buf[this.buf.length - 1].k : 0)) + 24, ini = fim - 190;
    const fotos = this.buf.filter(s => s.k >= ini && s.k <= fim);
    const quadro = s => {
      const f = new Float32Array(3 + p.jog.length * 3); f[0] = s.b[0]; f[1] = s.b[1]; f[2] = s.b[4];
      const m = new Map(s.d.map(x => [x[0], x]));
      p.jog.forEach((j, i) => { const d = m.get(j.id); f[3 + i * 3] = d ? d[1] : j.x; f[4 + i * 3] = d ? d[2] : j.y; f[5 + i * 3] = d ? d[5] : 0; });
      return f;
    };
    const out = [];
    for (let i = 0; i < fotos.length; i++){
      const a = quadro(fotos[i]); out.push(a);
      if (fotos[i + 1]){ const b = quadro(fotos[i + 1]), mid = new Float32Array(a.length); for (let q = 0; q < a.length; q++) mid[q] = (a[q] + b[q]) / 2; out.push(mid); }
    }
    return out;
  },
  // controles: manda quando muda (no máximo ~30 vezes por segundo) e repete a cada 1/4 s
  enviaEntrada(inp){
    const mx = Math.round(inp.mx * 100) / 100, my = Math.round(inp.my * 100) / 100, k = inp.kD ? 1 : 0, pp = inp.pD ? 1 : 0;
    const bot = k + ',' + pp + ',' + inp.kN + ',' + inp.pN, chave = mx + ',' + my + ',' + bot, t = agora();
    if (chave === this.ultIn && t - this.ultEnvio < .25) return;
    if (bot === this.ultBot && t - this.ultEnvio < .032) return;
    this.ultIn = chave; this.ultBot = bot; this.ultEnvio = t;
    Rede.envia({ t: 'in', mx, my, k, p: pp, kn: inp.kN, pn: inp.pN });
  }
};

const GOLEIRO_TREINO = { reac: .42, atraso: .24, erro: .2, tol: .34, vel: .6, carga: 0, passe: 0, antecipa: .4, duplo: 0, lerdo: .2 };
function contaAte(e, total, prefixo){
  if (!e) return; const t0 = performance.now(), dur = 900;
  const f = () => { const u = clamp((performance.now() - t0) / dur, 0, 1); e.innerHTML = prefixo + fmt(total * easeOutCubic(u)); if (u < 1) requestAnimationFrame(f); };
  f();
}
// o visual que o botão veste no campo: cor do time (ou a escolhida, com um anel do time em volta)

}

const Jogo = {

    if (jogou){

      const ss = S.stats; ss.partidas++; if (venceu) ss.vitorias++; else if (empate) ss.empates++; else ss.derrotas++;
      ss.gols += st.gols; ss.assist += st.assist; ss.fortes += st.fortes || 0; ss.golsFortes += this.golsFortes;

      if (naSala){ missaoSoma('salas', 1); if (souMelhor) missaoSoma('melhor', 1); }
      if (tipo === 'ranq') rq = this.contaRanq(venceu, empate, ga - gb);
      // RANKING DAS SALAS: sem servidor, a conta deste aparelho soma aqui; online, o servidor soma e manda os números
      const linhaRk = () => ['+1 jogo', st.gols ? `+${st.gols} ${st.gols > 1 ? 'gols' : 'gol'}` : '', st.assist ? `+${st.assist} assist.` : '', souMelhor ? '+1 melhor da partida' : ''].filter(Boolean).join(' · ');
      if (tipo === 'sala'){
        if (!Conta.atual || Conta.atual.modo === 'local'){ const r = S.rk = rkLimpo(S.rk); r.j++; if (venceu) r.v++; r.g += st.gols; r.a += st.assist; if (souMelhor) r.m++; rkTx = linhaRk(); rkOk = true; }
        else rkTx = 'Partida neste aparelho: não conta no ranking online';
      } else if (tipo === 'online'){

    const bts = naSala ? `<button type="button" class="bt3d cinza" id="rs-lobby">${tipo === 'online' ? 'SAIR DA SALA' : 'LOBBY'}</button><button type="button" class="bt3d verde" id="rs-sala">VOLTAR PARA A SALA</button>`

    const pal = $('#sobre-palco');

      ${jogou ? `<div class="rs-premio"><span><i class="ic-moeda"></i>+${moedas}</span><span class="xp">+${xp} XP</span>${rq ? `<span style="color:${rq.d >= 0 ? 'var(--lima)' : 'var(--coral)'}">${rq.d >= 0 ? '+' : ''}${rq.d} PTS · ${rq.elo}</span>` : ''}${subiu ? `<span class="up">NÍVEL ${S.nivel}! <i class="ic-gema"></i>+${subiu * 5}</span>` : ''}</div>` : '<p class="nota" style="text-align:center">Você assistiu essa: sem prêmios.</p>'}

    const on = (id, f) => { const e = $(id); if (e) e.addEventListener('click', f); };

  contaRanq(venceu, empate, saldo){
    const R0 = S.rank, antes = eloDe(R0.pts);
    const d = venceu ? 25 + Math.min(15, Math.max(0, saldo - 1) * 5) : empate ? 5 : -20;

  setInterval(() => {
    const g = G(), hud = document.getElementById('hud');
    const ver = !!(hud && !hud.hidden && g.Salas && g.Salas.sala && !g.Salas.sala.local && g.Rede && g.Rede.on);
    if (barra.hidden === !ver) { if (ver) renderMsgs(); return; }
    barra.hidden = !ver;
    if (!ver){ try { inp.blur(); } catch (_) {} } else renderMsgs();
  }, 500);
  setInterval(renderMsgs, 700);

  form.addEventListener('submit', e => {
    e.preventDefault();
    const t = inp.value.replace(/\s+/g, ' ').trim().slice(0, 80);
    dig(false, true);
    if (t && G().Salas) G().Salas.fala(t);
    inp.value = '';
    try { inp.blur(); } catch (_) {}
  });

  // o botãozinho de cima abre o EDITAR BOTÕES (vale nas partidas online também)
  const bEditar = document.getElementById('h-editar');
  if (bEditar) bEditar.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    try { const g = G(); if (g.Jogo && g.Jogo.painel) g.Jogo.fechaPainel(); if (g.Editor) g.Editor.abre('jogo'); } catch (_) {}
  });

  // "digitando…": avisa a sala enquanto escreve (vale para os 3 campos de chat da sala)
  let digOn = false, digT = 0;
  const CAMPOS = ['sa-in', 'sj-in', 'chj-in'];
  function dig(on, forca){
    const t = performance.now();
    if (on){ if (digOn && t - digT < 1800) return; digOn = true; digT = t; }
    else { if (!digOn && !forca) return; digOn = false; }
    try { const g = G(); if (g.Rede && g.Rede.on) g.Rede.envia({ t: 'dig', on: on ? 1 : 0 }); } catch (_) {}
  }
  document.addEventListener('focusin', e => { if (CAMPOS.includes(e.target.id)) dig(true); });
  document.addEventListener('input', e => { if (CAMPOS.includes(e.target.id)) dig(true); });
  // iPhone: sem zoom de dois toques nem de pinça (o Android já não fazia isso)
  document.addEventListener('gesturestart', e => e.preventDefault());
  let ultimoToque = 0;
  document.addEventListener('touchend', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')){ ultimoToque = 0; return; }   // campo de texto: deixa focar
    const agora = performance.now();
    if (agora - ultimoToque <= 350 && e.cancelable) e.preventDefault();
    ultimoToque = agora;
  }, { passive: false });

  document.addEventListener('focusout', e => {
    if (CAMPOS.includes(e.target.id)) dig(false, true);
    setTimeout(() => { try { const g = G(); if (g.App && g.App.estado === 'jogo') g.App.redimensiona(true); } catch (_) {} }, 350);   // teclado fechou: a tela volta ao tamanho certo
  });

  // a barra sobe junto com o teclado do celular — o jogo atrás NÃO se mexe (tela fixa)
  if (window.visualViewport){
    const sobe = () => {
      if (barra.hidden) return;
      const livre = visualViewport.height + visualViewport.offsetTop;
      barra.style.bottom = Math.max(8, Math.round(innerHeight - livre + 8)) + 'px';
    };
    visualViewport.addEventListener('resize', sobe);
    visualViewport.addEventListener('scroll', sobe);
  }
})();
</script>
</body>
</html>
